function limitaElenco32(){
  const out=[];
  S.clubes.forEach(c=>{
    while(c.elenco.length>MAX_ELENCO){
      const cand=c.elenco.filter(j=>!j.emprestado).sort((a,b)=>(a.f+(a.pot-a.f)*.3-Math.max(0,a.idade-31))-(b.f+(b.pot-b.f)*.3-Math.max(0,b.idade-31)))[0];
      if(!cand)break;c.elenco=c.elenco.filter(x=>x.id!==cand.id);if(c.id===S.meu)out.push(cand.nome);
    }
  });
  if(out.length)setTimeout(()=>aviso("Elenco acima de "+MAX_ELENCO+": foram liberados "+out.join(", ")+"."),600);
}


// ===== TRANSFERÊNCIA DE TÉCNICOS (v49) =====
// Duas janelas por temporada: MEIO (ao fechar o 1º turno) e FIM. Técnicos de baixa confiança são demitidos; os livres vão para clubes
// sem técnico; técnicos muito bons de clubes pequenos podem ser contratados por clubes maiores. O USUÁRIO demitido recebe ofertas.
function confiancaDe(c,t,N){                                            // 0–100, mesma fórmula do usuário, para qualquer clube da liga
  const pos=t.findIndex(x=>x.id===c.id)+1;
  const esperado=[...S.clubes].sort((a,b)=>b.forca-a.forca).findIndex(x=>x.id===c.id)+1;
  if(c._conf==null)c._conf=70;
  const base=100-(pos-1)*3.5,sobra=(esperado-pos)*2.2,zona=pos>N-4?-14*(esperado<=N-6?1:.35):0;
  const alvo=Math.max(5,Math.min(100,base+sobra+zona+(c.caixa<0?-10:0)));
  c._conf=Math.round(c._conf*.8+alvo*.2);return c._conf;
}
function pDemissao(m){return m>=40?0:Math.min(.95,(40-m)/25)}
function ofertasParaMim(motivo){
  const eu=S.clubes[S.meu],rep=reputacao();
  const lista=S.clubes.filter(c=>c.id!==S.meu).map(c=>({c,at:c.forca-rep}))
    .filter(o=>o.at<=12)                                                  // clubes não muito acima da sua reputação
    .sort(()=>R()-.5).slice(0,4).map(o=>o.c);
  if(lista.length<2){const todos=[...S.clubes].filter(c=>c.id!==S.meu).sort((a,b)=>a.forca-b.forca);lista.push(...todos.slice(0,2).filter(c=>!lista.includes(c)))}
  return lista.slice(0,4);
}
function aceitaOferta(id){
  const novo=S.clubes[id],eu=S.clubes[S.meu];
  const hab=eu.tec.hab,tit=eu.tec.tit;
  const antigoTecNovo=geraTec(eu.forca),tecAntigoDoNovo=novo.tec?novo.tec.nome:"—";
  eu.tec=antigoTecNovo;                                                   // o clube antigo ganha técnico novo
  try{regTec("fim",S.treinador,antigoTecNovo.nome,eu.nome,S.pais,"Você saiu (demitido)");regTec("fim",tecAntigoDoNovo,S.treinador,novo.nome,S.pais,"Você assumiu o clube")}catch(e){}
  S.meu=id;S.dir=70;S.tor=70;S.cap=null;S.selId=null;S.emp=[];S.homeAba="jogar";S.cob=null;S.cobPen=null;S.esc=null;
  novo.tec={id:"eu",nome:S.treinador,hab:hab,tit:tit,sal:0,idade:40,meu:true};
  S.clubes.forEach(c=>{c._conf=70});
  try{garanteTec();auto(novo,true)}catch(e){}
  S.ofertas=null;save();fechaDlg();aviso("Você agora é o técnico do "+novo.nome+"!",render);
}
function recusaOfertas(){S.ofertas=null;fechaDlg();aviso("Você recusou as ofertas.\nA diretoria do clube atual concede uma última chance: a confiança volta a 40 e você segue no cargo até a próxima janela.",()=>{S.dir=40;S.tor=40;save();render()})}
function janelaTecnicos(tipo,silencioso){                                          // tipo: "meio" | "fim"
  const t=tabela(),N=t.length,rod=S.rodada||0,meuId=S.meu;
  const eventos=[];
  if(!S.tecLivres)S.tecLivres=[];
  let nMundo=0;try{nMundo=janelaTecnicosMundo(tipo)}catch(e){}
  if(nMundo)eventos.push('🌍 +'+nMundo+' trocas de técnicos pelo mundo (veja o Histórico)');
  // 1) quem é demitido
  const demitidos=[];
  S.clubes.forEach(c=>{
    const ehMeu=c.id===meuId,conf=ehMeu?Math.min(S.dir==null?70:S.dir,S.tor==null?70:S.tor):confiancaDe(c,t,N);
    const pos=t.findIndex(x=>x.id===c.id)+1;
    if(pos<=3)return;                                                     // top 3 nunca demite
    if(tipo==="meio"&&rod<8)return;                                       // proteção nas 8 primeiras rodadas
    if(R()<pDemissao(conf)){
      if(ehMeu){demitidos.push({c,eu:true,conf});return}
      if(!c.tec||c.tec.meu)return;
      demitidos.push({c,eu:false,conf,tec:c.tec});
    }
  });
  // 2) IA: demitidos vão para livres; cada clube sem técnico contrata o melhor livre "parecido"
  const semTec=[];
  demitidos.forEach(d=>{
    if(d.eu)return;
    const velho=d.c.tec;velho.sal=velho.sal||Math.round(velho.hab*velho.hab/40*1000);S.tecLivres.push(velho);semTec.push(d.c);
    eventos.push("❌ "+d.c.nome+" demitiu "+velho.nome+" (confiança "+d.conf+")");
    d.c._velhoNome=velho.nome;
  });
  // 3) cobiça: técnico muito bom (hab≥80) de clube bem abaixo pode ir para um clube bem acima que está procurando
  semTec.forEach(c=>{
    S.tecLivres.sort((a,b)=>Math.abs(a.hab-(c.forca+5))-Math.abs(b.hab-(c.forca+5)));
    const novo=S.tecLivres.find(x=>x.id!==undefined)||null;
    if(novo){S.tecLivres=S.tecLivres.filter(x=>x!==novo);c.tec=novo;c._conf=70;eventos.push("✅ "+c.nome+" contratou "+novo.nome+" (H "+novo.hab+")")}
    else{c.tec=geraTec(c.forca);c._conf=70;eventos.push("✅ "+c.nome+" contratou "+c.tec.nome)}
    try{regTec(tipo,c._velhoNome,c.tec.nome,c.nome,S.pais,"Demissão por resultados",c._conf)}catch(e){}
  });
  while(S.tecLivres.length<8)S.tecLivres.push(geraTec(rnd(50,85)));
  S.tecLivres=S.tecLivres.slice(0,16);
  // 4) clube grande rouba técnico bom de clube pequeno (1 por janela, 25% de chance)
  if(R()<.25){
    const grandes=[...S.clubes].filter(c=>c.id!==meuId).sort((a,b)=>b.forca-a.forca).slice(0,4);
    const peq=[...S.clubes].filter(c=>c.id!==meuId&&c.tec&&!c.tec.meu).sort((a,b)=>a.forca-b.forca).slice(0,10).filter(c=>c.tec.hab>=70);
    if(grandes.length&&peq.length){
      const g=grandes[Math.floor(R()*grandes.length)],q=peq[Math.floor(R()*peq.length)];
      if(g.tec&&!g.tec.meu&&g.tec.hab<q.tec.hab-6){
        const a=g.tec,b=q.tec;g.tec=b;q.tec=a;g._conf=q._conf=70;
        eventos.push("🔁 "+g.nome+" contratou "+b.nome+" do "+q.nome+" (e "+q.nome+" ficou com "+a.nome+")");
        try{regTec(tipo,a.nome,b.nome,g.nome,S.pais,"Contratado do "+q.nome);regTec(tipo,b.nome,a.nome,q.nome,S.pais,"Trocou com o "+g.nome)}catch(e){}
      }
    }
  }
  S.eventosTec=eventos.slice(0,10);
  // 5) o usuário
  const eu=demitidos.find(d=>d.eu);
  const quando=tipo==="meio"?"no meio da temporada":"no fim da temporada";
  if(eu){try{regTec(tipo,S.treinador,"—",eu.c.nome,S.pais,"Você foi demitido",eu.conf)}catch(e){}}
  if(silencioso){S._tecPend={eu:!!eu,tipo,eventos:eventos.slice(0,8),ofertas:eu?ofertasParaMim(tipo).map(c=>c.id):[],clubeAnt:S.clubes[S.meu].nome};return eventos}
  if(eu){
    const of=ofertasParaMim(tipo);S.ofertas=of.map(c=>c.id);
    const clubeAnt=S.clubes[S.meu].nome;
    const cartoes=of.map(c=>`<div class="tbR"><span class="tbN">${escudo(c,16)}<span><b>${c.nome}</b><small>${iconeFama(c.nome)} ${nomeFama(c.nome)} · Força ${Math.round(c.forca)}</small></span></span><button class="sm s" onclick="aceitaOferta(${c.id})">Aceitar</button></div>`).join("");
    modal(`<div style="margin-bottom:8px"><b>👔 Você foi demitido!</b><br><small class="mu">A diretoria do ${clubeAnt} perdeu a confiança ${quando}. Clubes interessados:</small></div><div class="tbL">${cartoes}</div><div class="row" style="margin-top:10px"><button class="s" onclick="recusaOfertas()">Recusar tudo</button></div>`);
  }else if(eventos.length){
    setTimeout(()=>aviso("👔 Janela de técnicos ("+(tipo==="meio"?"meio da temporada":"fim da temporada")+")\n\n"+eventos.slice(0,8).join("\n")),500);
  }
  return eventos;
}

// ===== TÉCNICOS DO MUNDO + HISTÓRICO (v50) =====
// Cada clube de OUTRO país tem um técnico em S.tecMundo[nome]. Nasce da semente (não pesa no save até mudar). As trocas usam a tabela real
// de cada liga (tabelaDe). Tudo (minha liga + mundo) entra em S.histTec: [{temp,tipo,saiu,entrou,clube,pais,motivo,conf}].
function tecDoMundo(pais,div,idx,nome){
  if(!S.tecMundo)S.tecMundo={};
  if(S.tecMundo[nome])return S.tecMundo[nome];
  const rg=rngClube("tecM|"+nome);
  const pico=picoClube(pais,div,idx);
  const hab=Math.max(30,Math.min(95,Math.round(pico+rg()*27-12)));
  const t={id:"m"+Math.floor(rg()*1e9).toString(36),nome:NOMES_T[Math.floor(rg()*NOMES_T.length)]+" "+SOB_T[Math.floor(rg()*SOB_T.length)],hab,tit:Math.floor(rg()*12),idade:35+Math.floor(rg()*33)};
  S.tecMundo[nome]=t;return t;
}
function regTec(tipo,saiu,entrou,clube,pais,motivo,conf,div){
  if(!S.histTec)S.histTec=[];
  S.histTec.push({temp:S.temp,tipo,saiu:saiu||"—",entrou:entrou||"—",clube,pais:pais||S.pais,motivo:motivo||"",conf:conf==null?null:Math.round(conf),div:div==null?0:div});
  S.histTec=S.histTec.filter(x=>S.temp-x.temp<4);                                // guarda só as últimas 4 temporadas
  if(S.histTec.length>700)S.histTec=S.histTec.slice(-700);
}
function janelaTecnicosMundo(tipo){
  if(!S.tecMundo)S.tecMundo={};
  let total=0;
  Object.keys(LIGAS).forEach(pais=>{
    if(pais===S.pais)return;
    const nd=LIGAS[pais].length;
    for(let dv=0;dv<nd;dv++){
      let t;try{t=tabelaDe(pais,dv)}catch(e){continue}
      if(!t||t.length<8)continue;
      const N=t.length,lista=LIGAS[pais][dv];
      // força esperada: ordem pelo pico
      const idxDe={};lista.forEach((c,i)=>{idxDe[c[0]]=i});
      const esp=[...t].map(x=>({n:x.nome,p:picoClube(pais,dv,idxDe[x.nome]!=null?idxDe[x.nome]:0)})).sort((a,b)=>b.p-a.p).map(x=>x.n);
      t.forEach((x,pos0)=>{
        const pos=pos0+1;if(pos<=3)return;
        const i=idxDe[x.nome];if(i==null)return;
        const jogos=x.j||0;if(tipo==="meio"&&jogos<8)return;
        // confiança "do momento" (sem estado guardado): a mesma fórmula, aplicada à tabela atual
        const esperado=esp.indexOf(x.nome)+1;
        const base=100-(pos-1)*3.5,sobra=(esperado-pos)*2.2,zona=pos>N-4?-14*(esperado<=N-6?1:.35):0;
        const conf=Math.max(5,Math.min(100,base+sobra+zona));
        if(R()>=pDemissao(conf)*0.9)return;
        const velho=tecDoMundo(pais,dv,i,x.nome);
        const livres=S.tecLivres||[];
        let novo=null;
        if(livres.length&&R()<.5){livres.sort((a,b)=>Math.abs(a.hab-(velho.hab))-Math.abs(b.hab-(velho.hab)));novo=livres.shift();S.tecLivres=livres;}
        if(!novo){const rg=R;novo={id:"m"+Math.floor(rg()*1e9).toString(36),nome:pick(NOMES_T)+" "+pick(SOB_T),hab:Math.max(30,Math.min(95,Math.round(picoClube(pais,dv,i)+rnd(-12,14)))),tit:rnd(0,8),idade:rnd(35,66)}}
        S.tecMundo[x.nome]=novo;

// ===== 11 EM CAMPO OBRIGATÓRIO (v55) =====
// Antes de QUALQUER partida do seu time (liga, copas, Mundial) o jogo exige 11 titulares aptos. Faltou gente (expulso, lesão, suspensão)?
// Ele completa sozinho com o melhor reserva da mesma posição; se não houver ninguém, bloqueia e leva você à Tática.
function aptoParaJogar(j){return !(j.lesao>0)&&!(j.suspenso>0)&&!j.expulso&&!j.emprestadoFora}
function titularesAptos(c){return c.elenco.filter(j=>j.tit&&aptoParaJogar(j))}
function motivoInapto(j){return j.lesao>0?"lesionado ("+j.lesao+"j)":j.suspenso>0?"suspenso":j.expulso?"expulso":"indisponível"}
function garante11(c,silencioso){
  c=c||meuReal();if(!c)return{ok:true,trocas:[]};
  const fe0=x=>x.f*(0.7+0.3*(x.en==null?100:x.en)/100);
  // 1) cada titular que não pode jogar vira UMA vaga (a do goleiro tem prioridade)
  const vagas=[];
  c.elenco.forEach(j=>{if(j.tit&&!aptoParaJogar(j)){j.tit=false;vagas.push({sai:j,entra:null,improv:false})}});
  vagas.sort((a,b)=>(a.sai.pos==="GOL"?0:1)-(b.sai.pos==="GOL"?0:1));
  // 2) cada vaga: melhor reserva da MESMA posição; senão outro de linha; sem goleiro apto, um jogador de linha improvisa no gol
  vagas.forEach(v=>{
    const pool=c.elenco.filter(x=>!x.tit&&aptoParaJogar(x));if(!pool.length)return;
    const pos=v.sai.pos;let m=pool.filter(x=>x.pos===pos).sort((a,b)=>fe0(b)-fe0(a))[0]||null;
    if(!m&&pos==="GOL"){m=pool.sort((a,b)=>fe0(b)-fe0(a))[0];v.improv=true}
    else if(!m){m=pool.filter(x=>x.pos!=="GOL").sort((a,b)=>fe0(b)-fe0(a))[0]||null}
    if(!m)return;
    m.px=v.sai.px;m.py=v.sai.py;m._g=grupoPos(m);m._slot=v.sai._slot;m._role=v.sai._role;m.tit=true;v.entra=m;
    if(S.cap===v.sai.id)S.cap=m.id;
  });
  // 3) ainda faltam titulares (escalação incompleta)? completa do banco
  let g=0;
  while(titularesAptos(c).length<11&&g++<20){
    const pool=c.elenco.filter(x=>!x.tit&&aptoParaJogar(x));if(!pool.length)break;
    const temGol=titularesAptos(c).some(x=>x.pos==="GOL");
    const gol=!temGol?pool.filter(x=>x.pos==="GOL")[0]:null;
    const linha=pool.filter(x=>x.pos!=="GOL").sort((a,b)=>fe0(b)-fe0(a))[0];
    (gol||linha||pool[0]).tit=true;
  }
  const ok=titularesAptos(c).length>=11;
  if(vagas.some(v=>v.entra)||!ok){try{auto(c,true)}catch(e){}}                  // reorganiza as posições sem perder quem já está escalado
  if(!ok&&!silencioso){
    const faltam=11-titularesAptos(c).length;
    const lista=c.elenco.filter(j=>!aptoParaJogar(j)).map(j=>"• "+j.nome+" ("+j.pos+") — "+motivoInapto(j)).slice(0,6).join("\\n");
    S.aba="tat";
    aviso("⛔ Você precisa de 11 jogadores em campo.\\nFaltam "+faltam+" apto(s) no elenco.\\n\\n"+(lista?"Indisponíveis:\\n"+lista+"\\n\\n":"")+"Contrate ou promova alguém da base e escale o time na Tática.",render);
    return{ok:false,trocas:vagas};
  }
  if(!silencioso&&vagas.some(v=>v.entra)){
    const txt=vagas.filter(v=>v.entra).map(v=>"• "+v.entra.nome+(v.improv?" (improvisado no gol)":"")+" entra no lugar de "+v.sai.nome+" ("+motivoInapto(v.sai)+")").join("\\n");
    setTimeout(()=>toast("🔁 Time completado:\\n"+txt),100);
  }
  return{ok,trocas:vagas};
}

// ===== EVOLUÇÃO DURANTE OS CAMPEONATOS (v57) =====
// Quem JOGA ganha força a cada partida (na liga, nas copas e no Mundial): ganho = falta até o potencial × taxa da idade × nota do jogo × minutos jogados.
// 75% do crescimento anual chega assim, aos poucos; o fim de ano paga só o restante (maturação) e o treino dos reservas. Aos 29 anos ninguém evolui mais.
const EVO_PARTE_JOGOS=.75,EVO_JOGOS_ANO=60;
function fracAnualIdade(i){return i<=20?.22:i<=22?.20:i<=24?.16:i<=27?.11:.06}
function ganhoPorJogo(j,nota,minutos,fama){
  if(j.idade>28)return 0;
  const fr=(j.fReal!=null?j.fReal:j.f),falta=Math.max(0,(j.pot||fr)-fr);if(falta<=0)return 0;
  const fn=Math.max(.5,Math.min(1.8,1+(nota-6)*.4));                      // nota 6 = 1,0× · 8+ = 1,8× · 5 ou menos = 0,5×
  const fm=Math.max(0,Math.min(1,minutos/90));                            // quem entrou aos 80' ganha pouco
  const bf=1+[0,.15,.35][fama||0];
  return Math.min(falta,falta*fracAnualIdade(j.idade)*EVO_PARTE_JOGOS/EVO_JOGOS_ANO*fn*fm*bf);
}
function aplicaGanhoJogo(clube,j,g){
  if(!(g>0))return 0;
  const fr=(j.fReal!=null?j.fReal:j.f),novo=Math.min(100,Math.min(j.pot||100,fr+g));
  if(j.f0Temp==null||j.f0TempAno!==S.temp){j.f0Temp=(j.fReal!=null?j.fReal:j.f);j.f0TempAno=S.temp}
  const antes=j.f;j.fReal=novo;j.f=Math.max(15,Math.min(100,Math.round(novo)));
  if(j.f!==antes){                                                         // virou um ponto inteiro: atualiza valor, salário e força do time
    j.val=valorDe(j.f,j.idade,j.pot,j.mk);j.sal=salarioDe(j.f,j.mk);
    try{clube.forca=forcaMedia(clube)}catch(e){}
    return j.f-antes;
  }
  return 0;
}
// minutos de cada jogador numa partida: titular o jogo todo; quem entrou, a partir do minuto da substituição; quem saiu, até ela
function minutosDoJogo(o,subs,idJ){
  let ini=0,fim=90;
  (subs||[]).forEach(x=>{if(x.entra===idJ)ini=x.m;if(x.sai===idJ)fim=x.m});
  return Math.max(0,fim-ini);
}


// ===== EVOLUÇÃO DOS CLUBES DA IA DURANTE A TEMPORADA (v57) =====
// Minha liga: a cada rodada os titulares da IA ganham como um jogador de nota ≈ 6,3. Mundo compacto: em passos a cada rodada simulada.
// O fim de ano da IA continua pagando o restante (maturação). Assim os rivais crescem junto com o seu time.
function evoluiIARodada(){
  try{
    const rodadas=Math.max(1,(S.fixt||[]).length),pesoRod=EVO_JOGOS_ANO/rodadas;     // 38 rodadas ≈ 60 jogos de ritmo
    S.clubes.forEach((c,ci)=>{
      if(ci===S.meu)return;
      const fama=nivelFama(c.nome);let mudou=false;
      c.elenco.forEach(j=>{
        if(j.idade>28)return;
        const jogou=j.tit||R()<.2;if(!jogou)return;
        const nota=6.3+(R()-.5)*.8,g=ganhoPorJogo(j,nota,j.tit?90:30,fama)*pesoRod;
        const d=aplicaGanhoJogo(c,j,g);if(d>0)mudou=true;
      });
      if(mudou)try{c.forca=forcaMedia(c)}catch(e){}
    });
  }catch(e){}
}
// mundo compacto: ganho por fatia de rodada (em décimos de força), só para quem tem potencial e idade ≤ 28
function evoluiMundoFatia(frac){
  // frac = fatia da temporada que acabou de passar (ex.: 1/38). O estado compacto guarda a força em DÉCIMOS; cada fatia rende bem menos que 0,1,
  // então o ganho em décimos é sorteado (parte inteira + 1 com chance = parte fracionária): a média fica exata e nada é perdido no arredondamento.
  try{
    if(!S.mundo)return;
    const rg=R;
    Object.keys(S.mundo).forEach(k=>{
      const est=S.mundo[k];if(!est||!est.c)return;
      let mudou=false;
      est.c=est.c.map(t=>{
        const idade=t[0];if(idade>28)return t;
        const f=t[1]/10,pot=t[2],falta=Math.max(0,pot-f);if(falta<=0)return t;
        const dec=falta*fracAnualIdade(idade)*EVO_PARTE_JOGOS*frac*10*(0.6+rg()*.8);   // ganho da fatia, em décimos
        const b=Math.floor(dec),inc=b+(rg()<dec-b?1:0);if(inc<=0)return t;
        const novo=Math.min(pot*10,t[1]+inc);if(novo===t[1])return t;
        const r=t.slice();r[1]=novo;mudou=true;return r;
      });
    });
    S._mem={};                                                                         // clubes montados na sessão serão remontados já evoluídos
  }catch(e){}
}

function evolucaoFichaHTML(j){

  if(j.idade>28)return `<div><small>Evolução</small><b style="color:#ffb86b">Declínio</b><small>${j.idade} anos: só perde força</small></div>`;
  if(fr>=pot-0.05)return `<div><small>Evolução</small><b style="color:#7dff9a">No teto</b><small>potencial ${pot}</small></div>`;

}


// ===== ENTROSAMENTO E MORAL (v58) =====
// ENTROSAMENTO (0–100, por jogador): sobe +1,2 a cada jogo que atua; jogador novo começa em 20; cai −1,5 por jogo no banco. O time joga com
// força × (0,97 + 0,06 × entrosamento médio do XI / 100): de −3% (grupo todo novo) a +3% (grupo afinado, ≈ 1 ponto de força).
// MORAL (0–100, por jogador): vitória +2,5 · empate 0 · derrota −3 · titular +0,4 · reserva −0,6 · clássico ganho +2 / perdido −3 · título +10.
// Efeito: força × (0,97 + 0,06 × moral/100). Moral muito baixa (<25) faz o jogador recusar renovação e pedir para sair.
function entrosJ(j){return j.entr==null?60:j.entr}
function moralJ(j){return j.mor==null?60:j.mor}
function entrosMedio(c){const t=c.elenco.filter(x=>x.tit);return t.length?t.reduce((q,x)=>q+entrosJ(x),0)/t.length:60}
function fatorEntrosMoral(c){
  const t=c.elenco.filter(x=>x.tit);if(!t.length)return 1;
  const e=t.reduce((q,x)=>q+entrosJ(x),0)/t.length,m=t.reduce((q,x)=>q+moralJ(x),0)/t.length;
  return (0.97+0.06*e/100)*(0.985+0.03*m/100);             // entrosamento ±3% · moral ±1,5% (juntos: de −4,5% a +4,5%)
}
function jogadorNovoNoClube(j){j.entr=20;j.mor=Math.max(50,moralJ(j))}                      // chama quando alguém chega
function atualizaEntrosMoral(c,res,classico){               // res: 1 vitória · 0 empate · −1 derrota. Chamado no fim de cada jogo do SEU time.
  c.elenco.forEach(j=>{
    const jogou=!!j.jogou_ultimo;
    j.entr=Math.max(0,Math.min(100,entrosJ(j)+(jogou?1.2:-1.5)));
    let m=moralJ(j)+(res>0?2.5:res<0?-3:0)+(jogou?.4:-.6)+(classico?(res>0?2:res<0?-3:0):0);
    j.mor=Math.max(jogou?20:15,Math.min(100,m));
  });
}
function rotuloEntros(v){return v>=80?"Afinado":v>=55?"Bom":v>=35?"Em formação":"Desentrosado"}
function rotuloMoral(v){return v>=80?"Motivado":v>=55?"Bem":v>=35?"Irritado":"Descontente"}
function corNivel(v){return v>=65?"#3ddc84":v>=40?"#f5c542":"#ff5d5d"}

// ===== JOGADORES LIVRES, PERMUTA E PATROCÍNIO (v58) =====
// LIVRES: no fim da temporada ficam ~30 jogadores sem clube (os seus com contrato vencido + veteranos e jovens sem espaço no mundo). Contratação SEM passe:
// você paga só as luvas (3 meses de salário) e o salário pedido (+10–25%). A lista é renovada todo ano; quem sobra volta ao mercado como veterano.
function geraLivres(saidosMeus){
  const lista=[];
  (saidosMeus||[]).forEach(j=>{const c={...j};["px","py","_slot","_role","tit","num"].forEach(k=>delete c[k]);c.origem="Seu ex-jogador";lista.push(c)});
  const eu=meuReal(),n=Math.max(0,30-lista.length);
  for(let i=0;i<n;i++){
    const idade=R()<.55?rnd(30,34):rnd(19,24);
    const alvo=Math.max(22,(eu?eu.forca:45)-rnd(14,0)-(idade>=30?0:6));
    const j=novoJog(pick(POS),alvo);j.idade=idade;
    if(idade>=29)j.pot=j.f;
    j.val=valorDe(j.f,j.idade,j.pot,j.mk);j.sal=salarioDe(j.f,j.mk);j.ct=0;j.origem=idade>=30?"Veterano sem clube":"Jovem dispensado";
    lista.push(j);
  }
  S.livres=lista.slice(0,32);
}
function salarioPedidoLivre(j){return Math.round(j.sal*1000*(1.10+((j.hum||40)%15)/100))}   // +10% a +24%
function contrataLivre(id){
  const eu=meuReal(),k=(S.livres||[]).findIndex(x=>x.id===id);if(k<0)return;
  const j=S.livres[k];
  if(elencoCheio(eu))return avisoCheio();
  const sal=salarioPedidoLivre(j),luvas=sal*3;
  if(eu.caixa<luvas)return aviso("Caixa insuficiente para as luvas ("+R$(luvas)+").");
  pergunta(`${j.nome} (${j.pos}, ${j.idade} anos, F${j.f}) está livre.\nSalário pedido: ${R$(sal)}/mês · Luvas: ${R$(luvas)} (3 meses).\nContrato (1 a 4 anos):`,2,a=>{
    const an=Math.max(1,Math.min(4,parseInt(a)||2));
    confirma(`Contratar ${j.nome} por ${an} ano(s)?\nLuvas: ${R$(luvas)}\nSalário: ${R$(sal)}/mês`,()=>{
      eu.caixa-=luvas;finDesp("Luvas (jogadores livres)",luvas);
      const novo={...j,ct:an,en:100,tit:false,gols:0,sal:sal/1000,raro:false};delete novo.origem;
      jogadorNovoNoClube(novo);eu.elenco.push(novo);S.livres.splice(k,1);auto(eu,true);save();render();toast(novo.nome+" assinou com você!");
    });
  });
}
function livresHTML(){
  const L=S.livres||[];
  if(!L.length)return `<div class="card"><small class="mu">Sem jogadores livres agora. A lista é renovada no fim de cada temporada, quando os contratos vencem.</small></div>`;
  const eu=meuReal();
  return `<div class="card"><h3>🆓 Jogadores livres (${L.length})</h3><small class="mu">Sem passe: você paga só as luvas (3 meses de salário). O salário é o que pesa todo mês.</small>
    <div class="tbL" style="max-height:380px;overflow:auto;margin-top:6px">${[...L].sort((a,b)=>b.f-a.f).map(j=>{const sal=salarioPedidoLivre(j);
      return `<div class="tbR"><span class="tbN"><span><b>${j.nome}</b> <small class="mu">${j.pos} · ${j.idade} anos · F${j.f}${j.pot>j.f?" → "+j.pot:""}</small><small>${j.origem||""} · ${R$(sal)}/mês · luvas ${R$(sal*3)}</small></span></span><button class="sm s" ${eu.caixa<sal*3?'disabled':''} onclick="contrataLivre('${j.id}')">Contratar</button></div>`}).join("")}</div></div>`;

// PERMUTA: oferece UM jogador seu (+ dinheiro opcional) por um jogador de outro clube da sua liga. O clube compara o valor total com o preço pedido.
function abrePermuta(clubeId,jid){
  const eu=meuReal(),cl=S.clubes[clubeId];if(!cl)return;
  const alvo=cl.elenco.find(x=>x.id===jid);if(!alvo)return;
  const pedido=precoPedido(cl,alvo);

function propoePermuta(clubeId,jid,meuId){

function geraPropostasPatrocinio(){
  const eu=meuReal();if(!eu)return;
  const econ=(typeof ECON_PAIS!=="undefined"&&ECON_PAIS[S.pais])||.6;
  const fama=nivelFama(eu.nome),div=S.div;
  const base=[1.0,.30,.10][div]*econ*1.4e6*(1+[0,.5,1.2][fama])*(0.8+eu.forca/100);
  const marcas=["Banco Aurora","Rede Atlântica","Cervejaria do Vale","Telecom Nova","Construtora Prime","Airways Sul","Supermercados Boa Compra","Energia Viva","Seguradora Global","Cartão Ouro"].sort(()=>R()-.5).slice(0,3);
  const nclubes=S.clubes.length;
  S.patroPropostas=marcas.map((m,i)=>{
    const anos=[1,2,3][i],fixo=Math.round(base*(.85+i*.1)/1e4)*1e4;
    const meta=i===0?{tipo:"semi",txt:"Sem meta (valor menor)",pos:0,bonus:0}:i===1?{tipo:"top",txt:"Terminar entre os "+Math.max(3,Math.round(nclubes*.35))+" primeiros",pos:Math.max(3,Math.round(nclubes*.35)),bonus:Math.round(fixo*.35/1e4)*1e4}:{tipo:"top",txt:"Terminar entre os "+Math.max(2,Math.round(nclubes*.2))+" primeiros",pos:Math.max(2,Math.round(nclubes*.2)),bonus:Math.round(fixo*.7/1e4)*1e4};

// ===== RENOVAÇÃO AUTOMÁTICA DE CONTRATOS (v59) =====
// Caixa na tela de Elenco: "Renovar contratos automaticamente". Ao virar a temporada, quem está no último ano renova por 2 anos, com aumento
// de 4% a 12% no salário (menos para quem tem moral alta). Só renova quem VALE: força acima da média do elenco OU jovem (até 24 anos) com potencial.
// Quem está descontente (moral < 25), tem 34+ anos ou é reserva fraco sai de graça, como antes. O que foi renovado aparece no aviso do fim da temporada.
function opcRenovaAuto(){return !!(S.cfg&&S.cfg.renovaAuto)}
function setRenovaAuto(v){S.cfg=S.cfg||{};S.cfg.renovaAuto=!!v;save();render()}
function renovaAutomatico(){
  const eu=meuReal(),out={renov:[],ficou:[]};
  if(!opcRenovaAuto())return out;
  const medF=eu.elenco.reduce((q,j)=>q+j.f,0)/Math.max(1,eu.elenco.length);
  eu.elenco.forEach(j=>{
    if(j.emprestado||(j.ct||1)>1)return;                        // só quem vence nesta virada (ct ainda será decrementado)
    const vale=j.f>=medF-1||(j.idade<=24&&(j.pot||j.f)>=j.f+4);
    const ok=vale&&j.idade<34&&moralJ(j)>=25;
    if(!ok){out.ficou.push(j.nome);return}
    const aum=1+.04+Math.max(0,(60-moralJ(j)))/60*.08;           // 4% a 12%
    j.sal=Math.round(j.sal*aum*10)/10;j.ct=3;                    // 3 porque vencerContratos tira 1 → fica 2 anos
    j.renovAuto=S.temp;out.renov.push(j.nome);
  });
  return out;
}

// ===== PRÊMIOS INDIVIDUAIS · TODAS AS LIGAS (v59) =====
// Em CADA liga (as 60 do mundo, incluindo a sua) o jogo escolhe no fim da temporada: 🏆 Melhor jogador · 🧤 Melhor goleiro · 🌟 Revelação (até 21 anos)
// · ⚽ Artilheiro (já existente) · 📋 Time do Ano (11 jogadores). Cada premiado recebe um impulso de FORÇA em % (limitado pelo potencial, só até 28 anos):
// Melhor +1,5% · Goleiro +1,0% · Revelação +2,0% · Artilheiro +1,0% · Time do Ano +0,7% (teto de +4% por temporada). A partir dos 29 vira só prestígio.
const PREMIO_PCT={melhor:.015,goleiro:.010,revelacao:.020,art:.010,time:.007};
const PREMIO_NOME={melhor:"🏆 Melhor jogador",goleiro:"🧤 Melhor goleiro",revelacao:"🌟 Revelação",art:"⚽ Artilheiro",time:"📋 Time do Ano"};
const TIME_DO_ANO=[["GOL",1],["ZAG",2],["LD",1],["LE",1],["VOL",1],["MEI",2],["PE",1],["ATA",2]];                 // 11
function aplicaPremioForca(j,tipos){                                                                                // j é um jogador montado (objeto) — devolve os pontos ganhos
  if(!j||j.idade>28)return 0;
  const pct=Math.min(.04,tipos.reduce((q,t)=>q+(PREMIO_PCT[t]||0),0));
  const fr=(j.fReal!=null?j.fReal:j.f),ganho=Math.min(Math.max(0,(j.pot||fr)-fr),fr*pct);
  if(ganho<=0)return 0;
  j.fReal=fr+ganho;j.f=Math.max(15,Math.min(100,Math.round(j.fReal)));
  return ganho;
}
// índice de temporada de um jogador do MUNDO (slot): força + gols + campanha do clube + sorte determinística
function indiceMundo(t,pos,golsLiga,posClube,nClubes,rg){
  const f=t[1]/10,idade=t[0];
  const ofensivo=(pos==="ATA"||pos==="PE"||pos==="MEI")?1:(pos==="GOL"?0:.4);
  const camp=(nClubes-posClube)/Math.max(1,nClubes-1);                                  // 0 (último) .. 1 (campeão)
  return f*.5+golsLiga*2.2*ofensivo+camp*18+rg()*6;
}
function premiosMundoLiga(pais,div,rg){
  const L=S.ligas&&S.ligas[chaveLiga(pais,div)];if(!L)return null;
  const tab=tabelaDe(pais,div);if(!tab||tab.length<4)return null;
  const posDe={};tab.forEach((x,i)=>posDe[x.nome]=i+1);
  const cands=[];
  tab.forEach(x=>{
    const ch=chaveFixa(pais,x.nome);if(!ch)return;
    const kc=chaveClube(pais,ch.div,ch.idx);
    if(!S.mundo)S.mundo={};
    if(!S.mundo[kc])S.mundo[kc]=criaEstadoMundo(kc,picoClube(pais,ch.div,ch.idx));
    const est=S.mundo[kc];
    est.c.forEach((t,slot)=>{
      const pos=POS22[slot],g=(L.gols&&L.gols[x.nome+"#"+slot])||0,as=(L.ass&&L.ass[x.nome+"#"+slot])||0;
      cands.push({kc,slot,pos,idade:t[0],f:t[1]/10,pot:t[2],g,clube:x.nome,idx:indiceMundo(t,pos,g+as*.6,posDe[x.nome],tab.length,rg)});
    });
  });
  if(!cands.length)return null;
  const topo=(arr,n)=>[...arr].sort((a,b)=>b.idx-a.idx).slice(0,n);
  const out={melhor:topo(cands.filter(c=>c.pos!=="GOL"||true),1)[0],
    goleiro:topo(cands.filter(c=>c.pos==="GOL"),1)[0],
    revelacao:topo(cands.filter(c=>c.idade<=21),1)[0],
    time:[]};
  const usados=new Set();
  TIME_DO_ANO.forEach(([pos,n])=>{topo(cands.filter(c=>c.pos===pos&&!usados.has(c.kc+"|"+c.slot)),n).forEach(c=>{usados.add(c.kc+"|"+c.slot);out.time.push(c)})});
  return out;
}
// aplica o impulso no estado compacto do mundo e devolve os nomes (para o histórico)
function aplicaPremiosMundo(pais,div,P){
  if(!P)return[];
  const porSlot={};                                                                      // "kc|slot" → [tipos]
  const add=(c,tipo)=>{if(!c)return;const k=c.kc+"|"+c.slot;(porSlot[k]=porSlot[k]||{c,t:[]}).t.push(tipo)};
  add(P.melhor,"melhor");add(P.goleiro,"goleiro");add(P.revelacao,"revelacao");P.time.forEach(c=>add(c,"time"));
  const hist=[];
  Object.values(porSlot).forEach(({c,t})=>{
    const est=S.mundo[c.kc],tt=est.c[c.slot];if(!tt)return;
    const fake={f:Math.round(tt[1]/10),fReal:tt[1]/10,pot:tt[2],idade:tt[0]};
    const g=aplicaPremioForca(fake,t);
    if(g>0){const r=tt.slice();r[1]=Math.round(fake.fReal*10);est.c[c.slot]=r}
    let nome="?";try{const ch=chaveFixa(pais,c.clube);nome=nomeDoSlot(c.kc,pais,ch.div,ch.idx,c.slot)}catch(e){}
    hist.push({nome,clube:c.clube,pos:c.pos,tipos:t,ganho:Math.round(g*10)/10,idade:c.idade});
  });
  S._mem={};                                                                             // clubes montados serão remontados já com o impulso
  return hist;
}
function fechaPremiosIndividuais(){
  // MUNDO (todas as ligas, menos a sua): decide e aplica
  const resumo={};let totalPremiados=0;
  Object.keys(LIGAS).forEach(pais=>{
    if(pais===S.pais)return;
    const rg=rngClube("premios|"+pais+"|"+S.temp);
    LIGAS[pais].forEach((_,div)=>{
      try{const P=premiosMundoLiga(pais,div,rg);if(!P)return;
        const h=aplicaPremiosMundo(pais,div,P);totalPremiados+=h.length;
        resumo[pais+"|"+div]={melhor:h.find(x=>x.tipos.includes("melhor")),goleiro:h.find(x=>x.tipos.includes("goleiro")),revelacao:h.find(x=>x.tipos.includes("revelacao")),time:h.filter(x=>x.tipos.includes("time")).length};
      }catch(e){}
    });
  });
  // SUA LIGA: usa elencos reais (notas, gols, minutos)
  const meus=premiosSuaLiga();
  if(meus)resumo[S.pais+"|"+S.div]=meus.resumo;
  if(!S.premiosHist)S.premiosHist=[];
  S.premiosHist.push({temp:S.temp,ligas:resumo});
  if(S.premiosHist.length>6)S.premiosHist=S.premiosHist.slice(-6);
  return{resumo,meus,totalPremiados};
}
function premiosSuaLiga(){
  const todos=S.clubes.flatMap(c=>c.elenco.map(j=>({j,c})));
  const posDe={};tabela().forEach((x,i)=>posDe[x.id]=i+1);
  const n=S.clubes.length;
  const ind=o=>{const j=o.j,nm=j.mediaNota!=null?j.mediaNota:6;
    const ofensivo=(j.pos==="ATA"||j.pos==="PE"||j.pos==="MEI")?1:(j.pos==="GOL"?0:.4);
    return j.f*.45+nm*4+(j.golsLiga||0)*1.8*ofensivo+((n-posDe[o.c.id])/Math.max(1,n-1))*14+(j.selRodada||0)*1.2};
  const top=(arr,k)=>[...arr].sort((a,b)=>ind(b)-ind(a)).slice(0,k);
  const melhor=top(todos,1)[0],goleiro=top(todos.filter(o=>o.j.pos==="GOL"),1)[0],revel=top(todos.filter(o=>o.j.idade<=21),1)[0];
  const time=[];const usado=new Set();
  TIME_DO_ANO.forEach(([pos,k])=>top(todos.filter(o=>o.j.pos===pos&&!usado.has(o.j.id)),k).forEach(o=>{usado.add(o.j.id);time.push(o)}));
  const art=[...todos].filter(o=>(o.j.golsLiga||0)>0).sort((a,b)=>(b.j.golsLiga||0)-(a.j.golsLiga||0))[0];
  const por={};const add=(o,t)=>{if(!o)return;(por[o.j.id]=por[o.j.id]||{o,t:[]}).t.push(t)};
  add(melhor,"melhor");add(goleiro,"goleiro");add(revel,"revelacao");add(art,"art");time.forEach(o=>add(o,"time"));
  const meusPremiados=[];
  Object.values(por).forEach(({o,t})=>{
    const antes=o.j.f,g=aplicaPremioForca(o.j,t);
    if(g>0){o.j.val=valorDe(o.j.f,o.j.idade,o.j.pot,o.j.mk);o.j.sal=salarioDe(o.j.f,o.j.mk);try{o.c.forca=forcaMedia(o.c)}catch(e){}}
    o.j.premios=(o.j.premios||[]);t.forEach(x=>o.j.premios.push({t:S.temp,p:x}));
    if(o.c.id===S.meu)meusPremiados.push({nome:o.j.nome,pos:o.j.pos,tipos:t,ganho:Math.round(g*10)/10,de:antes,para:o.j.f});
    if(t.includes("melhor")||t.includes("goleiro")||t.includes("revelacao")){try{o.j.hum=Math.min(99,(o.j.hum||50)+8);if(o.c.id===S.meu)o.j.mor=Math.min(100,moralJ(o.j)+10)}catch(e){}}
  });
  const f=(o,t)=>o?{nome:o.j.nome,clube:o.c.nome,pos:o.j.pos,tipos:[t]}:null;
  return{meusPremiados,resumo:{melhor:f(melhor,"melhor"),goleiro:f(goleiro,"goleiro"),revelacao:f(revel,"revelacao"),art:f(art,"art"),time:time.length},timeDoAno:time.map(o=>({nome:o.j.nome,pos:o.j.pos,clube:o.c.nome,meu:o.c.id===S.meu}))};
}

function premiosIndividuaisHTML(){
  const H=S.premiosHist||[];
  if(!H.length)return `<div class="card"><div class="tag" style="margin-bottom:6px">🏅 Prêmios individuais</div><small class="mu">Os prêmios individuais saem no fim de cada temporada, em todas as ligas do mundo: melhor jogador, melhor goleiro, revelação, artilheiro e Time do Ano. Premiados com até 28 anos ganham um impulso de força.</small></div>`;
  const ultimo=H[H.length-1],temps=H.map(x=>x.temp).reverse();
  const sel=S.premTemp!=null&&H.find(x=>x.temp===S.premTemp)?H.find(x=>x.temp===S.premTemp):ultimo;
  const chaves=Object.keys(sel.ligas);

// OBJETIVOS DA DIRETORIA: no começo da temporada a diretoria define 1 meta principal conforme o prestígio e a força do clube na liga.
// Bateu a meta no fim do ano: confiança da diretoria +15, torcida +8 e um bônus em dinheiro; ficou muito abaixo: confiança −15.
function geraObjetivo(){
  const eu=meuReal();if(!eu)return;
  const n=S.clubes.length,esperado=[...S.clubes].sort((a,b)=>b.forca-a.forca).findIndex(c=>c.id===eu.id)+1;
  let alvo=Math.max(1,Math.round(esperado-1)),txt;
  if(esperado<=2){alvo=1;txt="Ser campeão da liga"}
  else if(esperado<=Math.round(n*.3)){alvo=Math.max(3,Math.round(n*.2));txt="Terminar entre os "+alvo+" primeiros (vaga continental)"}
  else if(esperado<=Math.round(n*.6)){alvo=Math.round(n*.5);txt="Terminar na metade de cima da tabela (até "+alvo+"º)"}
  else {alvo=n-4;txt="Evitar o rebaixamento (ficar acima do "+(n-3)+"º)"}
  S.objetivo={temp:S.temp,alvo,txt,bonus:Math.round(((6e6*(ECON_PAIS[S.pais]||.6))*[1,.22,.06][S.div||0])*.18/1e4)*1e4,resultado:null};
}
function fechaObjetivo(posFinal){
  const O=S.objetivo;if(!O||O.temp!==S.temp||O.resultado)return null;
  const eu=meuReal();
  if(posFinal<=O.alvo){
    O.resultado="ok";S.dir=Math.min(100,(S.dir==null?70:S.dir)+15);S.tor=Math.min(100,(S.tor==null?70:S.tor)+8);
    if(O.bonus){eu.caixa+=O.bonus;finRec("Bônus de objetivo da diretoria",O.bonus)}

  }
  const longe=posFinal-O.alvo;
  O.resultado=longe>=4?"mal":"quase";
  if(longe>=4){S.dir=Math.max(5,(S.dir==null?70:S.dir)-15);S.tor=Math.max(5,(S.tor==null?70:S.tor)-8)}

// ===== TIME DA RODADA (v59) =====
// A cada rodada da SUA liga os 11 melhores (pelo índice nota + gols) entram no Time da Rodada. Quem mais aparece ganha "seleções da rodada"
// e isso conta no Time do Ano. Guardado só a última rodada, para o save não crescer.
function registraTimeDaRodada(){
  try{
    const L=S.live;if(!L||!L.jogos)return;
    const todos=[];
    S.clubes.forEach(c=>c.elenco.forEach(j=>{
      const noJogo=L.jogos.some(g=>S.clubes[g.a]===c||S.clubes[g.b]===c);if(!noJogo)return;
      const jogou=j.tit||j.jogou_ultimo;if(!jogou)return;
      const gols=L.jogos.reduce((q,g)=>q+g.ev.filter(e=>e.t==="g"&&e.jid===j.id).length,0);
      // nota do meu time vem do S.pos; dos outros usa força relativa + gols + sorteio
      let nota=6+(j.f-(c.forca||50))/18+(R()-.5)*1.2+gols*1.1;
      if(S.pos&&c.id===S.meu){const lado=S.pos.a===S.meu?S.pos.A:S.pos.B;const o=lado&&lado.lista&&lado.lista.find(x=>x.id===j.id);if(o)nota=o.nota}
      todos.push({j,c,idx:nota+gols*.4});
    }));
    const time=[];const usados=new Set();
    TIME_DO_ANO.forEach(([pos,n])=>{todos.filter(o=>o.j.pos===pos&&!usados.has(o.j.id)).sort((a,b)=>b.idx-a.idx).slice(0,n).forEach(o=>{usados.add(o.j.id);time.push(o)})});
    time.forEach(o=>{o.j.selRodada=(o.j.selRodada||0)+1});
    S.timeRodada={rodada:S.rodada+1,temp:S.temp,jogadores:time.map(o=>({id:o.j.id,nome:o.j.nome,pos:o.j.pos,clube:o.c.nome,nota:Math.round(o.idx*10)/10,meu:o.c.id===S.meu}))};
  }catch(e){}
}
function timeRodadaHTML(){
  const T=S.timeRodada;if(!T||!T.jogadores||!T.jogadores.length)return "";
  const meus=T.jogadores.filter(x=>x.meu).length;
  return `<div class="card" style="margin:8px 0"><div class="tag" style="margin-bottom:6px">⭐ Time da ${T.rodada}ª rodada${meus?` · ${meus} seu${meus>1?'s':''}`:''}</div>

}


// ===== ASSISTÊNCIAS (v60) =====
// ~68% dos gols de jogada têm assistente (nunca o próprio autor). Peso por posição: meia e ponta criam mais; zagueiro e goleiro quase nunca.
// Habilidades de criação aumentam a chance. Pênalti e falta direta NÃO têm assistente; no escanteio o cobrador é o assistente.
const PESO_ASSIST={GOL:.05,ZAG:.35,LD:1.4,LE:1.4,VOL:1.1,MEI:3.2,PE:3.0,ATA:1.8};
function sorteiaAssistente(tit,autor){
  if(R()>=.68)return null;
  const cand=tit.filter(x=>x.id!==autor.id&&!x.expulso);if(!cand.length)return null;
  const w=cand.map(x=>{
    const h=x.hab||[];let p=(PESO_ASSIST[x.pos]||1)*(0.6+x.f/70);
    if(h.includes("Passe"))p*=1.45;if(h.includes("Criação"))p*=1.5;if(h.includes("Cruzamento"))p*=1.35;if(h.includes("Drible"))p*=1.15;if(h.includes("Visão"))p*=1.4;
    return p});
  let tot=w.reduce((q,x)=>q+x,0),r=R()*tot,k=0;while(k<w.length-1&&r>w[k]){r-=w[k];k++}
  return cand[k];
}
function registraAssistencia(jogo,evento,ass,emCopa){
  if(!ass)return;
  ass.assist=(ass.assist||0)+1;if(!emCopa)ass.assistLiga=(ass.assistLiga||0)+1;
  evento.ass=ass.nome;evento.assId=ass.id;
}

// ===== ARTILHARIA E ASSISTÊNCIAS DE TODAS AS LIGAS — FORMATO COMPACTO (v61) =====
// Em memória: L.gols["Clube#slot"] = n e L.ass["Clube#slot"] = n (como sempre, o resto do código não muda).
// No SAVE: cada liga grava dois textos de 1 caractere por jogador (22 por clube, na ordem de L.nomes), em base 36 (0–35).
// 59 ligas × (440+440) caracteres ≈ 51 KB — menos que os 273 KB do formato antigo, e agora com as assistências de TODOS os jogadores.
const B36="0123456789abcdefghijklmnopqrstuvwxyz";
function mapaParaTexto(mapa,nomes){
  let t="";
  nomes.forEach(n=>{for(let s=0;s<22;s++){const v=(mapa&&mapa[n+"#"+s])||0;t+=B36[Math.min(35,v)]}});
  return t;
}
function textoParaMapa(txt,nomes){
  const m={};if(!txt)return m;
  nomes.forEach((n,i)=>{for(let s=0;s<22;s++){const c=txt.charCodeAt(i*22+s);if(isNaN(c))continue;
    const v=c>=97?c-87:c-48;if(v>0)m[n+"#"+s]=v}});
  return m;
}
function ligasParaSave(ligas){
  const nl={};
  Object.keys(ligas||{}).forEach(k=>{
    const L=ligas[k];
    nl[k]={k:L.k,R:L.R,nomes:L.nomes,tab:L.tab,gt:mapaParaTexto(L.gols,L.nomes),at:mapaParaTexto(L.ass,L.nomes),ultimos:L.ultimos,temp:L.temp};
  });
  return nl;
}
function ligasDoSave(ligas){                    // aceita o formato novo (gt/at) e o antigo (gols como mapa)
  Object.keys(ligas||{}).forEach(k=>{
    const L=ligas[k];if(!L)return;
    if(typeof L.gt==="string"){L.gols=textoParaMapa(L.gt,L.nomes);L.ass=textoParaMapa(L.at,L.nomes);delete L.gt;delete L.at}
    if(!L.gols)L.gols={};if(!L.ass)L.ass={};
  });
}

function pesosDeAssist(pais,div,nome){
  const ch=chaveFixa(pais,nome);if(!ch)return POS22.map(p=>PESO_ASSIST[p]);
  const k=chaveClube(pais,ch.div,ch.idx),est=S.mundo&&S.mundo[k];
  return POS22.map((pos,i)=>{const f=est?est.c[i][1]/10:50;return(PESO_ASSIST[pos]||1)*(0.6+f/70)});
}

  const tot={};A.forEach(x=>{const k=x.nome+"|"+x.clube;tot[k]=tot[k]||{nome:x.nome,clube:x.clube,pais:x.pais,t:0,g:0};tot[k].t++;tot[k].g+=x.gols});
  const rank=Object.values(tot).sort((a,b)=>b.t-a.t||b.g-a.g).slice(0,6);
  if(rank.length&&rank[0].t>1)h+=`<div class="card"><div class="tag" style="margin-bottom:6px">👑 Mais artilharias (todas as ligas)</div>${rank.filter(x=>x.t>1).map(x=>`<div class="upL"><div><b>${x.nome}</b><small>${x.clube} · ${x.pais}</small></div><b>${x.t}× · ${x.g} gols</b></div>`).join("")}</div>`;

// ===== JOGADOR PEDE PARA SAIR (v63) =====
// A cada rodada o jogo mede a "pressão" de cada jogador do SEU time: moral baixa, reserva sem jogar (a partir do 3º jogo), salário abaixo do justo
// para o nível dele, clube na parte de baixo da tabela. Titular reclama menos (×0,6) e os mais jovens têm paciência.
// Com pressão ≥ 55 por 2 rodadas seguidas ele PEDE PARA SAIR. Você escolhe: ✅ Liberar (clube vende pelo valor, sem rescisão) ·
// 🤝 Convencer (promete minutos e/ou aumento: chance de ficar) · 🚫 Ignorar (moral −8 e ele volta a reclamar em 6 rodadas).
function pressaoSaida(j,eu,posRel){
  const moral=moralJ(j),sem=j.semJogar||0,salJusto=Math.max(1,salarioDe(j.f,j.mk)),sal=j.sal/salJusto;
  let p=0;
  if(moral<55)p+=(55-moral)*1.2;
  p+=Math.min(45,Math.max(0,sem-2)*6);
  if(sal<.85)p+=(0.85-sal)*70;
  if(posRel>.7)p+=12;
  if(j.idade<=22)p-=12;else if(j.idade<=25)p-=5;
  if(j.tit)p*=.6;
  return Math.max(0,p);
}
function verificaPedidosSaida(){
  try{
    const eu=meuReal();if(!eu)return;
    const t=tabela(),posRel=(t.findIndex(c=>c.id===S.meu))/Math.max(1,t.length-1);
    if(!S.pedidosSaida)S.pedidosSaida=[];
    S.pedidosSaida=S.pedidosSaida.filter(x=>eu.elenco.find(j=>j.id===x.jid));
    eu.elenco.forEach(j=>{
      if(j.emprestado)return;
      j.semJogar=j.jogou_ultimo?0:(j.semJogar||0)+1;
      if(j.promessaMin&&(j.semJogar||0)>=3){j.mor=Math.max(15,moralJ(j)-10);j.promessaMin=null;j.pedidoEspera=0}   // promessa quebrada
      if(j.pedidoEspera>0){j.pedidoEspera--;return}
      const p=pressaoSaida(j,eu,posRel);
      j.pressSaida=p>=55?(j.pressSaida||0)+1:0;
      if(j.pressSaida>=2&&!S.pedidosSaida.find(x=>x.jid===j.id)&&S.pedidosSaida.length<3){
        const motivo=moralJ(j)<40?"Está descontente com o ambiente do grupo":(j.semJogar||0)>=5?"Quer jogar mais: está há "+(j.semJogar||0)+" jogos sem atuar":(j.sal/Math.max(1,salarioDe(j.f,j.mk))<.85)?"Acha que ganha abaixo do que merece":"Quer mudar de ares";
        S.pedidosSaida.push({jid:j.id,nome:j.nome,motivo,temp:S.temp});
        j.pressSaida=0;
      }
    });
    if(S.pedidosSaida.length)S._avisoSaida=true;
  }catch(e){}
}

    const j=eu.elenco.find(x=>x.id===p.jid);if(!j)return"";

      <div class="row" style="gap:6px"><button class="sm" onclick="liberaSaida(${i})">✅ Liberar</button><button class="sm s" onclick="convenceSaida(${i})">🤝 Convencer</button><button class="sm s" onclick="ignoraSaida(${i})">🚫 Ignorar</button></div></div>`}).join("")}</div>`;
}
function liberaSaida(i){
  const eu=meuReal(),p=(S.pedidosSaida||[])[i];if(!p)return;const j=eu.elenco.find(x=>x.id===p.jid);if(!j)return;

function convenceSaida(i){

    <button class="big" style="margin:4px 0" onclick="fechaDlg();tentaConvencer(${i},'ambos')">⚽💰 Minutos e aumento</button>
    <button class="s" style="width:100%;margin-top:6px" onclick="fechaDlg()">Cancelar</button>`);

function tentaConvencer(i,oferta){
  const eu=meuReal(),p=(S.pedidosSaida||[])[i];if(!p)return;const j=eu.elenco.find(x=>x.id===p.jid);if(!j)return;
  let ch=.25;
  if(oferta==="minutos"||oferta==="ambos")ch+=(j.semJogar||0)>=3?.35:.12;
  if(oferta==="aumento"||oferta==="ambos")ch+=(j.sal/Math.max(1,salarioDe(j.f,j.mk))<.85)?.35:.15;
  ch+=Math.max(0,(moralJ(j)-30)/200);ch=Math.min(.9,ch);
  if(R()<ch){
    if(oferta==="aumento"||oferta==="ambos"){j.sal=Math.round(j.sal*1.15*10)/10}
    j.mor=Math.min(100,moralJ(j)+15);j.semJogar=0;j.pedidoEspera=12;j.promessaMin=(oferta==="minutos"||oferta==="ambos")?S.temp:null;
    S.pedidosSaida.splice(i,1);save();render();aviso(`${j.nome} aceitou ficar!`+(oferta!=="aumento"?"\nVocê prometeu mais minutos: escale-o nos próximos jogos ou ele volta a reclamar.":""));
  }else{
    j.mor=Math.max(15,moralJ(j)-4);save();render();aviso(`${j.nome} não se convenceu.\nVocê ainda pode liberá-lo ou ignorar o pedido.`);
  }
}
function ignoraSaida(i){
  const eu=meuReal(),p=(S.pedidosSaida||[])[i];if(!p)return;const j=eu.elenco.find(x=>x.id===p.jid);if(!j)return;
  j.mor=Math.max(15,moralJ(j)-8);j.pedidoEspera=6;S.pedidosSaida.splice(i,1);save();render();
}


// ===== CLIMA E GRAMADO (v63) =====
// CLIMA (por jogo, sorteado conforme o MÊS da data e o hemisfério do país do mandante): ☀️ sol · ☁️ nublado · 🌧 chuva · ⛈ tempestade · 🔥 calor · ❄️ frio.
//   🌧 chuva −8% nos chutes certos e +10% de cartões · ⛈ tempestade −14% e +15% de cartões · 🔥 calor: o time cansa 18% mais rápido · ❄️ frio: lesões +12%.
// GRAMADO (0–100, por estádio; o do SEU estádio vem de S.gramado e melhora com obras): ≥85 ótimo · 60–84 bom · 35–59 ruim · <35 péssimo.
//   Chuva derruba o gramado do jogo em 15 pontos. Gramado ruim: lesões +20%; péssimo: +40% e −5% nos chutes certos. Time do gramado ótimo joga melhor em casa.
const CLIMAS={
  sol:{ic:"☀️",n:"Sol",noGol:1,cart:1,cansa:1,les:1,grama:0},
  nublado:{ic:"☁️",n:"Nublado",noGol:1,cart:1,cansa:1,les:1,grama:0},
  chuva:{ic:"🌧",n:"Chuva",noGol:.92,cart:1.10,cansa:1,les:1.05,grama:-15},
  tempestade:{ic:"⛈",n:"Tempestade",noGol:.86,cart:1.15,cansa:1.05,les:1.10,grama:-25},
  calor:{ic:"🔥",n:"Calor forte",noGol:.98,cart:1,cansa:1.18,les:1,grama:-3},
  frio:{ic:"❄️",n:"Frio",noGol:1,cart:1,cansa:.97,les:1.12,grama:0}
};
const PAISES_SUL=["Brasil","Argentina","Chile","Uruguai"],PAISES_UMIDOS=["Inglaterra","Escócia","Holanda","Bélgica","Alemanha"];
function sorteiaClima(pais,mes){
  if(pais==="Colômbia"){const r=R();return r<.45?"sol":r<.75?"nublado":r<.95?"chuva":"tempestade"}
  const sul=PAISES_SUL.includes(pais);
  const inverno=sul?(mes>=5&&mes<=8):(mes===11||mes<=2),verao=sul?(mes===11||mes<=2):(mes>=5&&mes<=8);
  const chuva=PAISES_UMIDOS.includes(pais)?.28:.18;
  const p={sol:.35+(verao?.12:0)-(inverno?.08:0),nublado:.25,chuva,tempestade:.05,calor:verao?.18:0,frio:inverno?.20:0};
  let tot=0;Object.keys(p).forEach(k=>{p[k]=Math.max(0,p[k]);tot+=p[k]});
  let r=R()*tot;for(const k of Object.keys(p)){r-=p[k];if(r<=0)return k}
  return "sol";
}
function gramadoDe(clube){                          // 0–100: clubes da IA derivam do nível do estádio e da fama (determinístico)
  if(clube.id===S.meu||clube===meuReal()){if(S.gramado==null)S.gramado=62;return S.gramado}
  let h=0;const n=clube.nome;for(let i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))>>>0;
  const base=45+(h%30)+(clube.forca>55?8:clube.forca>45?3:-3);
  return Math.max(25,Math.min(95,base));
}
function rotuloGramado(g){return g>=85?"Ótimo":g>=60?"Bom":g>=35?"Ruim":"Péssimo"}
function fatorGramadoNoGol(g){return g<35?.95:g<60?.98:1}
function fatorGramadoLesao(g){return g<35?1.4:g<60?1.2:1}
function preparaClimaJogo(jogo,mandante){            // chamado no criaLive: guarda o clima e o gramado efetivo no jogo
  let mes=0;try{mes=(S.agenda&&S.agenda[S.dia]&&S.agenda[S.dia].mes!=null)?S.agenda[S.dia].mes:new Date().getMonth()}catch(e){}
  let pais=S.pais;try{if(mandante.pais)pais=mandante.pais}catch(e){}
  const clima=sorteiaClima(pais,mes),C=CLIMAS[clima];
  const gBase=gramadoDe(mandante),gEf=Math.max(5,Math.min(100,gBase+C.grama));
  jogo.clima=clima;jogo.gramado=Math.round(gEf);jogo.gramBase=Math.round(gBase);
}
function previsaoClima(){                                // previsão para o próximo jogo em casa: a mais provável do mês (só informativo; o real é sorteado no jogo)
  try{const mes=(S.agenda&&S.agenda[S.dia]&&S.agenda[S.dia].mes!=null)?S.agenda[S.dia].mes:0;
    const cont={};for(let i=0;i<60;i++){const c=sorteiaClima(S.pais,mes);cont[c]=(cont[c]||0)+1}
    const top=Object.entries(cont).sort((a,b)=>b[1]-a[1]).slice(0,2);
    return top.map(([k,v])=>`${CLIMAS[k].ic} ${CLIMAS[k].n} (${Math.round(v*100/60)}%)`).join(" · ");
  }catch(e){return ""}
}
function climaJogoHTML(j){
  if(!j||!j.clima)return "";
  const C=CLIMAS[j.clima];
  return `<span class="tag" title="Clima e gramado">${C.ic} ${C.n} · 🌱 ${rotuloGramado(j.gramado)} (${j.gramado})</span>`;
}
function gramadoMelhora(){                           // obra de gramado: +12 pontos, custo cresce com o nível do gramado
  const eu=meuReal();if(S.gramado==null)S.gramado=62;

}
function desgasteGramado(){                          // o gramado do SEU estádio estraga com o uso e com a chuva; recupera um pouco com o tempo
  if(S.gramado==null)S.gramado=62;

}
function gramadoRecupera(){if(S.gramado==null)S.gramado=62;S.gramado=Math.min(S.gramadoMax||95,S.gramado+.5)}

// ===== MARCAÇÃO (v48) =====
// Leve:  poucos cartões (×0,6), dá espaço ao adversário (+22% de chances dele), não cansa.
// Normal: equilíbrio.
// Forte: muitos cartões (×1,8), fecha o adversário (−20% de chances dele) e rouba a posse (+10%), mas cansa mais o time.
const MARCACAO={Leve:{cartao:.6,espaco:1.22,pressao:.93,cansa:.85},Normal:{cartao:1,espaco:1,pressao:1,cansa:1},Forte:{cartao:1.8,espaco:.8,pressao:1.10,cansa:1.3}};
const marcDe=(meu,T)=>MARCACAO[(meu?(T||TTc(S.clubes[S.meu])).marc:"Normal")]||MARCACAO.Normal;

function tick(){
  S._soTick=true;
  const L=S.live;if(!L||L.pausado||L.pausaTec||L.janela||L.janelaVer||document.getElementById("modalsub")||document.getElementById("dlg"))return;
  // fim do 1º tempo: apito, tempo para e a escalação abre (só para quem tem treinador humano)
  if(L.min===45&&!L.intervaloFeito){L.intervaloFeito=true;L.segundoTempo=true;if(!L.pulando)somIntervalo();S._soTick=false;
    const jm=L.jogos.find(g=>souTecReal(g.a)||souTecReal(g.b));
    if(jm&&!L.pulando){abreJanelaEscala('intervalo');return}
  }
  L.min++;tickOutras();
  if(L.min%10===0)S.clubes.forEach((cc,ci)=>{const jm=L.jogos.find(g=>g.a===S.meu||g.b===S.meu),fcl=(jm&&jm.clima&&(ci===jm.a||ci===jm.b))?(CLIMAS[jm.clima].cansa):1;const fc=(ehHc(cc)?marcDe(true,TTc(cc)).cansa:1)*fcl;cc.elenco.forEach(j=>{if(j.tit){const res=(j.hab||[]).includes("Resistência")?.8:1;j.en=Math.max(10,(j.en==null?100:j.en)-2*poupaEnergia(j)*res*fc)}})});
  L.jogos.forEach(j=>{
    const A=S.clubes[j.a],B=S.clubes[j.b];
    const mA=ehHc(A),mB=ehHc(B),TA=TTc(A),TB=TTc(B);
    const fa=forcaTime(A,mA?TA.tatica:"Equilibrada")+3,fb=forcaTime(B,mB?TB.tatica:"Equilibrada");
    const k=t=>({"Ofensiva":1.2,"Defensiva":.8,"Contra-ataque":.9,"Equilibrada":1})[t]||1;
    // ENERGIA média dos titulares em campo (cansaço reduz o domínio) e jogadores a menos (expulsões)
    const enM=c=>{const t=c.elenco.filter(x=>x.tit&&!x.expulso);return t.length?t.reduce((q,x)=>q+(x.en==null?100:x.en),0)/t.length/100:1};
    const nA=A.elenco.filter(x=>x.tit&&!x.expulso).length||11,nB=B.elenco.filter(x=>x.tit&&!x.expulso).length||11;
    const fAe=fa*(.6+.4*enM(A))*Math.pow(Math.min(11,nA)/11,1.6),fBe=fb*(.6+.4*enM(B))*Math.pow(Math.min(11,nB)/11,1.6);
    const mom=1-.04*(j.ga-j.gb);                      // quem perde pressiona um pouco mais
    const pa=Math.max(.18,Math.min(.82,.5+(fAe*mom-fBe/mom)/90*.7));          // v54: diferença de força pesa 70% (a posse agora rende mais chutes, então o favorito não pode passar do ponto)
    const ef=(m,T)=>m?{att:k(T.tatica)*(T.conc==="Pelas pontas"?1.03:1),def:({"Leve":1,"Normal":1.06,"Forte":1.12})[T.marc],card:({"Leve":1,"Normal":1.4,"Forte":2})[T.marc]}:{att:1,def:1,card:1};
    const eA=ef(mA,TA),eB=ef(mB,TB);
    const mcA=marcDe(mA,TA),mcB=marcDe(mB,TB);
    const tA=pa*eA.att*mcA.pressao,tB=(1-pa)*eB.att*mcB.pressao;
    const dono=R()<tA/(tA+tB)?"a":"b";
    // POSSE REAL = minutos com a bola / minutos jogados (a bola muda de dono a cada minuto conforme o domínio)
    if(j.st.pm==null)j.st.pm=Math.round((j.st.pa||50)/100*Math.max(0,L.min-1));
    if(dono==="a")j.st.pm++;
    j.st.pa=Math.round(j.st.pm/Math.max(1,L.min)*100);
    // quem domina a bola cria mais chances; quem não tem a bola quase não finaliza (contra-ataque ocasional)
    const posA=j.st.pm/Math.max(1,L.min),posD=dono==="a"?posA:1-posA;
    const chance=Math.max(.06,Math.min(.40,(.23+.15*(posD-.5)*2)*(dono==="a"?mcB.espaco:mcA.espaco)));     // v54: quem tem a bola finaliza MUITO mais (70% de posse ≈ 14–15 chutes contra 5–6)   // 0,188: já desconta pênalti/escanteio/falta; × espaço dado pela marcação de quem defende
    const rf=R();
    let lanceEspecial=false;
    // PÊNALTI: ~0,27 por jogo; acontece no lugar de uma finalização e favorece quem tem mais a bola
    if(rf<.003*(1+.4*(posD-.5)*2)&&!L.penReq&&!S.expulsaoPendente){
      const sAp=dono==="a",meuJogo=(j.a===S.meu||j.b===S.meu),souCobrador=meuJogo&&((sAp&&j.a===S.meu)||(!sAp&&j.b===S.meu));
      if(souCobrador&&!L.pulando){L.penReq={jogoIdx:L.jogos.indexOf(j),sA:sAp}}      // escolher o cobrador: a janela abre no fim do tick
      else{
        if(meuJogo&&!L.pulando)somPenalti();                                          // pênalti CONTRA você: o árbitro marca (seu áudio)
        resolvePenalti(j,sAp,null);                                                   // time da IA, jogo contra o meu ou jogo pulado: resolve na hora
      }
      lanceEspecial=true;                                                             // o pênalti ocupa o lugar da finalização deste minuto
    }
    if(!lanceEspecial&&rf>=.003*(1+.4*(posD-.5)*2)&&rf<.003*(1+.4*(posD-.5)*2)+.055*(1+.5*(posD-.5)*2)){   // ESCANTEIO (~5 por jogo): ocupa o lugar de uma finalização

function confianca(){ // diretoria e torcida: posição REAL comparada ao que se esperava do clube (v49)
  const t=tabela(),N=t.length,pos=t.findIndex(c=>c.id===S.meu)+1,eu=S.clubes[S.meu];
  if(S.dir==null){S.dir=70;S.tor=70}
  const esperado=[...S.clubes].sort((a,b)=>b.forca-a.forca).findIndex(c=>c.id===S.meu)+1;
  const base=100-(pos-1)*3.5;
  const sobra=(esperado-pos)*2.2;                                       // superar (ou decepcionar) a expectativa
  const zona=pos>N-4?-14*(esperado<=N-6?1:.35):0;                       // rebaixamento pesa mais para quem não era esperado lá
  const alvoD=Math.max(5,Math.min(100,base+sobra+zona+(eu.caixa<0?-15:0)));
  const alvoT=Math.max(5,Math.min(100,base+sobra+zona+5));
  S.dir=Math.round(S.dir*.8+alvoD*.2);S.tor=Math.round(S.tor*.8+alvoT*.2);
}

/* ---------- 1) ESCUDOS ---------------------------------------------------
   Ordem de busca de cada escudo:
   1. escudo escolhido à mão no Editor (c.escudo)
   2. escudo importado da galeria (guardado no aparelho)
   3. arquivo na pasta  escudos/<nome-do-clube>.png  (junto do index.html)
   4. escudo desenhado padrão (cores do clube)                             */
const ESC={base:(function(){try{return localStorage.getItem('escBase')||'escudos/'}catch(e){return'escudos/'}})(),exts:['png','svg','webp','jpg'],falha:{},local:{}};
function escSlug(n){return String(n||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}
const _escudoOrig=escudo;
escudo=function(c,sz){
  sz=sz||18;
  if(!c||c.escudo)return _escudoOrig(c,sz);
  const slug=escSlug(c.nome);
  if(!slug)return _escudoOrig(c,sz);
  if(ESC.local[slug])return`<img src="${ESC.local[slug]}" style="width:${sz}px;height:${sz}px;object-fit:contain;vertical-align:middle">`;
  const k=ESC.falha[slug];
  if(k===undefined||k<ESC.exts.length){
    const i=k===undefined?0:k;
    return`<img src="${ESC.base}${slug}.${ESC.exts[i]}" data-s="${slug}" data-i="${i}" data-a="${c.cor||'#444'}" data-b="${c.cor2||'#fff'}" data-z="${sz}" onerror="escErro(this)" style="width:${sz}px;height:${sz}px;object-fit:contain;vertical-align:middle">`;
  }
  return _escudoOrig(c,sz);
};
function escErro(img){
  const s=img.dataset.s,i=(+img.dataset.i)+1;ESC.falha[s]=i;
  if(i<ESC.exts.length){img.dataset.i=i;img.src=ESC.base+s+'.'+ESC.exts[i];return}
  img.onerror=null;img.outerHTML=_escudoOrig({cor:img.dataset.a,cor2:img.dataset.b},+img.dataset.z);
}
/* guarda os escudos importados da galeria no IndexedDB (sobrevive a fechar o app) */
function escDB(fn){try{const rq=indexedDB.open('manager_escudos',1);rq.onupgradeneeded=()=>rq.result.createObjectStore('e');rq.onsuccess=()=>{try{fn(rq.result)}catch(e){}};rq.onerror=()=>{}}catch(e){}}
function escCarregaLocais(){escDB(db=>{const r=db.transaction('e').objectStore('e').openCursor();r.onsuccess=()=>{const c=r.result;if(c){ESC.local[c.key]=c.value;c.continue()}else{try{render()}catch(e){}}}})}
function escTodosClubes(){const o=[];try{Object.keys(LIGAS).forEach(p=>LIGAS[p].forEach((d,di)=>d.forEach(c=>o.push({nome:c[0],pais:p,div:di}))))}catch(e){}return o}
function escImportar(inp){
  const fs=[...inp.files];if(!fs.length)return;let ok=0,sem=[];const nomes={};escTodosClubes().forEach(c=>nomes[escSlug(c.nome)]=c.nome);
  let falta=fs.length;
  const fim=()=>{if(--falta>0)return;try{render()}catch(e){}aviso(`✅ ${ok} escudo(s) importado(s).`+(sem.length?`\n\n⚠️ ${sem.length} arquivo(s) não bateram com nenhum clube (o nome do arquivo precisa ser o nome do clube):\n`+sem.slice(0,12).join(', ')+(sem.length>12?'…':''):''))};
  fs.forEach(f=>{
    const slug=escSlug(f.name.replace(/\.[^.]+$/,''));
    if(!nomes[slug]){sem.push(f.name);return fim()}
    const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
      const cv=document.createElement('canvas');cv.width=cv.height=96;const x=cv.getContext('2d');const k=Math.min(96/im.width,96/im.height);
      x.drawImage(im,(96-im.width*k)/2,(96-im.height*k)/2,im.width*k,im.height*k);
      const url=cv.toDataURL('image/png');ESC.local[slug]=url;ok++;escDB(db=>db.transaction('e','readwrite').objectStore('e').put(url,slug));fim()};
      im.onerror=()=>{sem.push(f.name);fim()};im.src=r.result};
    r.onerror=()=>{sem.push(f.name);fim()};r.readAsDataURL(f);
  });
}

/* ---------- 2) VÁRIOS TÉCNICOS HUMANOS ----------------------------------
   Cada clube controlado por humano tem  c.hum = {nome, uid?, tt:{...}}
   O técnico "ativo" (quem está com a tela) é sempre S.meu; trocar de técnico
   guarda a tática do atual dentro do clube dele e carrega a do outro.      */
const TT_PAD={form:null,tatica:'Equilibrada',marc:'Normal',conc:'Pelo meio',cap:null,cob:null,cobPen:null,esc:null,padrao:false,subs:0};
function ttAtivo(){return{tatica:S.tatica||'Equilibrada',marc:S.marc||'Normal',conc:S.conc||'Pelo meio'}}
function ehHc(c){return!!c&&(c===S.clubes[S.meu]||!!c.hum)}
function TTc(c){
  if(!c)return{tatica:'Equilibrada',marc:'Normal',conc:'Pelo meio'};
  if(c===S.clubes[S.meu])return ttAtivo();
  if(c.hum){const t=c.hum.tt||(c.hum.tt=Object.assign({},TT_PAD));return{tatica:t.tatica||'Equilibrada',marc:t.marc||'Normal',conc:t.conc||'Pelo meio'}}
  return{tatica:'Equilibrada',marc:'Normal',conc:'Pelo meio'};
}
function humInit(){const c=S.clubes[S.meu];if(c&&!c.hum)c.hum={nome:S.treinador||'Técnico',tt:{}}}
function guardaTT(){const c=S.clubes[S.meu];if(!c)return;if(!c.hum)c.hum={nome:S.treinador||'Técnico'};c.hum.tt={form:S.form,tatica:S.tatica,marc:S.marc,conc:S.conc,cap:S.cap,cob:S.cob,cobPen:S.cobPen,esc:S.esc,padrao:S.padrao,subs:S.subs||0}}
function carregaTT(c){
  const t=Object.assign({},TT_PAD,c.hum&&c.hum.tt||{});
  S.form=t.form||c.form||S.form;c.form=S.form;S.tatica=t.tatica;S.marc=t.marc;S.conc=t.conc;S.cap=t.cap;S.cob=t.cob;S.cobPen=t.cobPen;S.esc=t.esc;S.padrao=t.padrao;
  S.subs=S.live?(t.subs||0):0;if(c.hum&&c.hum.nome)S.treinador=c.hum.nome;
}
function humLista(){if(!S._clbak)humInit();const base=S._clbak?S._clbak.clubes:S.clubes;return base.filter(c=>c.hum)}
function humCount(){if(!S||!S.clubes||!S.clubes[S.meu])return 0;return humLista().length}
function humPreparaOutros(){ /* chamado no início de cada jogo: completa o time dos outros humanos (suspensos/lesionados) */
  S.clubes.forEach(c=>{
    if(!c.hum||c.id===S.meu)return;
    try{
      if(c.hum.tt)c.hum.tt.subs=0;
      if(c.elenco.some(x=>x.tit&&(x.suspenso>0||x.lesao>0))){c.elenco.forEach(x=>{if((x.suspenso>0||x.lesao>0)&&x.tit)x.tit=false});auto(c,true)}
      garante11(c,true);
    }catch(e){}
  });
}
function trocaTecnico(ci,irTatica){
  if(!S||ci===S.meu)return false;
  const alvo=S.clubes[ci];if(!alvo||!alvo.hum)return false;
  if(S._clbak)return aviso('Termine esta partida de copa antes de trocar de técnico.'),false;
  if(S.live&&S.live.janela)return aviso('Feche a janela de escalação antes de trocar de técnico.'),false;
  humInit();guardaTT();S.meu=ci;carregaTT(alvo);S.selId=null;
  if(S.live){const i=S.live.jogos.findIndex(j=>j.a===ci||j.b===ci);if(i>=0)S.live.ver=i}
  if(!S.live)S.aba=irTatica?'tat':S.aba;
  save();render();toast('👤 Agora controlando: '+alvo.hum.nome+' ('+alvo.nome+')');return true;
}

const _comecaRodada=comecaRodada;
comecaRodada=function(){
  if(!S)return;
  let liga=false;try{if(!S.agenda||S.dia==null)agendaMonta();const d=S.agenda&&S.agenda[S.dia];liga=!!(d&&d.comp==='liga')}catch(e){}
  if(!S.live&&ONL.on&&ONL.papel==='guest'){return onlGuestPronto()}
  if(!S.live&&liga&&!S._humOk){
    const precisa=humCount()>1||(ONL.on&&ONL.papel==='host'&&onlConvidados().length);
    if(precisa&&!(ONL.on&&ONL.papel==='host'&&onlTodosProntos()&&humCount()<=1+onlConvidados().length)){return humDlgRodada()}
  }
  const tinhaLive=!!S.live;
  try{
    if(!tinhaLive&&ONL.on&&ONL.papel==='host')onlAntesRodada();
    _comecaRodada.apply(this,arguments);
  }finally{S._humOk=false;ONL.forcar=false}
  if(!tinhaLive&&!S.live&&ONL.on&&ONL.papel==='host')onlPosRodada();
};

  return sw+_abaLive.apply(this,arguments);
};

/* ---------- 3) ONLINE (Firebase Realtime Database) ----------------------
   Modelo: o anfitrião roda a simulação e guarda o savegame na sala.
   Cada amigo entra com o código, escolhe um clube livre e monta o time no
   próprio celular; ao tocar em "Jogar" manda a escalação (pronto). Quando
   todos estiverem prontos o anfitrião inicia a rodada e todos acompanham ao vivo. */
const ONL={on:false,papel:null,codigo:null,uid:null,nome:null,db:null,jog:{},ver:0,fase:'prep',live:null,forcar:false,offs:[],merged:{},msg:'',ocupado:false,timerLive:null,timerPatch:null};
const ONL_SDK='10.12.2';
const FIREBASE_CONFIG=null; // opcional: cole aqui o objeto firebaseConfig. Hospedando no Firebase Hosting isso não é necessário.
function onlConvidados(){return Object.keys(ONL.jog).filter(u=>u!==ONL.uid)}
function onlTodosProntos(){const c=onlConvidados();return c.every(u=>ONL.jog[u]&&ONL.jog[u].pronto&&ONL.merged[u]===ONL.ver)}
function onlScript(src){return new Promise((ok,er)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=()=>er(new Error('Não consegui carregar '+src.split('/').pop()+' (sem internet?)'));document.head.appendChild(s)})}
async function onlConfig(){
  try{const m=localStorage.getItem('fbcfg');if(m)return JSON.parse(m)}catch(e){}
  if(FIREBASE_CONFIG)return FIREBASE_CONFIG;
  try{const r=await fetch('/__/firebase/init.json');if(r.ok){const j=await r.json();if(j&&j.apiKey)return j}}catch(e){}
  return null;
}
async function onlInicia(){
  if(ONL.db&&ONL.uid)return;
  if(!(window.firebase&&firebase.database)){for(const n of['app','auth','database'])await onlScript('https://www.gstatic.com/firebasejs/'+ONL_SDK+'/firebase-'+n+'-compat.js')}
  const cfg=await onlConfig();
  if(!cfg)throw new Error('SEM_CONFIG');
  if(!cfg.databaseURL)throw new Error('Falta o "databaseURL" no config. Crie o Realtime Database no console do Firebase.');
  if(!firebase.apps.length)firebase.initializeApp(cfg);
  const cr=await firebase.auth().signInAnonymously();
  ONL.uid=(cr.user||firebase.auth().currentUser).uid;ONL.db=firebase.database();
}
function onlConfigDlg(){
  modal(`<b>🔧 Configurar Firebase</b><div class="mu" style="font-size:12px;margin:6px 0">Se o jogo estiver hospedado no Firebase Hosting isso é automático. Senão, cole aqui o objeto <i>firebaseConfig</i> (Console → Configurações do projeto → Seus apps → Config), incluindo o <b>databaseURL</b>.</div>
  <textarea id="fbcfg" style="width:100%;height:150px;background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px" placeholder='{"apiKey":"...","authDomain":"...","databaseURL":"https://SEU-PROJETO-default-rtdb.firebaseio.com","projectId":"..."}'></textarea>
  <div class="row" style="margin-top:10px"><button class="s" onclick="fechaDlg()">Cancelar</button><button onclick="onlSalvaConfig()">Salvar</button></div>`);
}
function onlSalvaConfig(){
  let t=document.getElementById('fbcfg').value.trim();
  try{t=t.replace(/^[^{]*/,'').replace(/;?\s*$/,'');let o;try{o=JSON.parse(t)}catch(e){o=(new Function('return('+t+')'))()}
    if(!o||!o.apiKey)throw 0;localStorage.setItem('fbcfg',JSON.stringify(o));fechaDlg();toast('Configuração salva');render()}catch(e){aviso('Não entendi esse texto. Cole o objeto firebaseConfig inteiro (começando em { e terminando em }).')}
}
function onlErro(e){
  if(e&&e.message==='SEM_CONFIG'){aviso('O Firebase ainda não foi configurado neste jogo.',()=>onlConfigDlg());return}
  const m=(e&&e.code||'')+' '+(e&&e.message||e);
  if(/admin-restricted|operation-not-allowed/.test(m))return aviso('Ative o login Anônimo no Firebase:\nConsole → Authentication → Método de login → Anônimo → Ativar.');
  if(/PERMISSION_DENIED|permission_denied/.test(m))return aviso('O Firebase recusou o acesso. Confira se as regras do Realtime Database foram publicadas (arquivo database.rules.json).');
  aviso('Erro online:\n'+m);
}
const ONL_CH=250000;
async function onlGz(txt){
  if(typeof CompressionStream==='undefined')return'P'+txt;
  const cs=new CompressionStream('gzip'),w=cs.writable.getWriter();w.write(new TextEncoder().encode(txt));w.close();
  const buf=new Uint8Array(await new Response(cs.readable).arrayBuffer());let bin='';
  for(let i=0;i<buf.length;i+=0x8000)bin+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));
  return'G'+btoa(bin);
}
async function onlUngz(s){
  if(s[0]==='P')return s.slice(1);
  const bin=atob(s.slice(1)),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  const ds=new DecompressionStream('gzip'),w=ds.writable.getWriter();w.write(u);w.close();return await new Response(ds.readable).text();
}
function onlRef(p){return ONL.db.ref('salas/'+ONL.codigo+(p?'/'+p:''))}
async function onlPut(path,txt,extra){ // grava texto comprimido em pedaços
  const g=await onlGz(txt),o=Object.assign({n:Math.ceil(g.length/ONL_CH)},extra||{});
  for(let i=0;i<o.n;i++)o['c'+i]=g.slice(i*ONL_CH,(i+1)*ONL_CH);
  await onlRef(path).set(o);return g.length;
}
async function onlGet(path){
  const s=await onlRef(path).get(),o=s.val();if(!o)return null;
  let g='';for(let i=0;i<o.n;i++)g+=o['c'+i]||'';return{txt:await onlUngz(g),meta:o};
}
function onlCodigo(){const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let c='';for(let i=0;i<5;i++)c+=a[Math.floor(Math.random()*a.length)];return c}
function onlLimpaOuvintes(){ONL.offs.forEach(f=>{try{f()}catch(e){}});ONL.offs=[];clearInterval(ONL.timerLive);ONL.timerLive=null}
function onlOuve(path,cb){const r=onlRef(path),f=r.on('value',s=>{try{cb(s.val())}catch(e){console.log(e)}});ONL.offs.push(()=>r.off('value',f))}
function onlAtualizaTela(){try{if(S&&(S.aba==='onl'||document.getElementById('dlg')))render()}catch(e){}}

/* ---- anfitrião ---- */
async function onlCriarSala(retomar){
  if(!S||S.live)return aviso('Abra o jogo (e termine a partida em andamento) antes de criar a sala.');
  if(ONL.ocupado)return;ONL.ocupado=true;ONL.msg='Conectando…';render();
  try{
    await onlInicia();humInit();
    let cod=retomar&&S.sala?S.sala.codigo:null;
    if(!cod){for(let i=0;i<8;i++){const c=onlCodigo(),sn=await ONL.db.ref('salas/'+c+'/meta').get();if(!sn.exists()){cod=c;break}}}
    if(!cod)throw new Error('Não consegui gerar um código livre. Tente de novo.');
    ONL.codigo=cod;ONL.papel='host';ONL.on=true;ONL.merged={};
    const sn=await onlRef('meta').get();
    if(sn.exists()&&sn.val().host!==ONL.uid)throw new Error('Essa sala pertence a outro anfitrião.');
    ONL.ver=sn.exists()?(sn.val().ver||0):0;
    S.sala={codigo:cod};
    await onlRef('meta').update({host:ONL.uid,anfitriao:S.treinador,clube:S.clubes[S.meu].nome,criada:firebase.database.ServerValue.TIMESTAMP,fase:'prep'});
    await onlRef('jogadores/'+ONL.uid).set({nome:S.treinador,clube:S.clubes[S.meu].nome,pronto:true,host:true});
    await onlPushEstado();
    onlOuve('jogadores',onlJogadoresMudou);
    ONL.msg='';save();
  }catch(e){ONL.on=false;ONL.papel=null;ONL.msg='';onlErro(e)}
  ONL.ocupado=false;render();
}
async function onlPushEstado(){
  const ver=ONL.ver+1,txt=serializaJogo();
  const bytes=await onlPut('estado/v'+ver,txt,{rodada:S.rodada,temp:S.temp});
  await onlRef('meta').update({ver,fase:'prep',rodada:S.rodada,temp:S.temp,kb:Math.round(bytes/1024),t:firebase.database.ServerValue.TIMESTAMP});
  if(ver>2)onlRef('estado/v'+(ver-2)).remove().catch(()=>{});
  ONL.ver=ver;ONL.merged={};
  const u={};Object.keys(ONL.jog).forEach(k=>{if(k!==ONL.uid)u[k+'/pronto']=false});
  if(Object.keys(u).length)await onlRef('jogadores').update(u);
}
function onlJogadoresMudou(v){
  ONL.jog=v||{};
  if(ONL.papel==='host'&&S){
    let mudou=false;
    Object.keys(ONL.jog).forEach(u=>{
      const j=ONL.jog[u];if(u===ONL.uid||!j.clube)return;
      const c=S.clubes.find(x=>x.nome===j.clube);
      if(c&&!c.hum){c.hum={nome:j.nome,uid:u,tt:Object.assign({},TT_PAD,{form:c.form})};mudou=true;toast('🌐 '+j.nome+' entrou com o '+c.nome)}
      if(c&&c.hum&&!c.hum.uid&&c.id!==S.meu){c.hum.uid=u;c.hum.nome=j.nome;mudou=true}
      if(j.pronto&&ONL.merged[u]!==ONL.ver&&!S.live)onlMesclaPatch(u);
    });
    if(mudou)save();
  }
  onlAtualizaTela();
}
async function onlMesclaPatch(uid){
  if(ONL.merged[uid]==='...'+ONL.ver)return;ONL.merged[uid]='...'+ONL.ver;
  try{
    const r=await onlGet('patch/'+uid);if(!r){ONL.merged[uid]=null;return}
    if(r.meta.base!==ONL.ver){ONL.merged[uid]=null;return}
    const p=JSON.parse(r.txt),c=S.clubes.find(x=>x.nome===p.c.nome);if(!c||!c.hum||c.hum.uid!==uid){ONL.merged[uid]=null;return}
    const manter={};['id','pts','j','v','e','d','gp','gc'].forEach(k=>manter[k]=c[k]);
    const hum=Object.assign({},c.hum,{tt:p.c.hum&&p.c.hum.tt||c.hum.tt});
    Object.assign(c,p.c,manter);c.hum=hum;c.hum.uid=uid;
    ONL.merged[uid]=ONL.ver;save();onlAtualizaTela();
  }catch(e){ONL.merged[uid]=null;console.log('patch',e)}
}
function onlAntesRodada(){
  onlRef('meta').update({fase:'jogando'}).catch(()=>{});
  onlRef('ao_vivo').remove().catch(()=>{});
  clearInterval(ONL.timerLive);ONL.timerLive=setInterval(onlTransmite,1800);setTimeout(onlTransmite,300);
}
function onlSnapLive(){
  const L=S.live;if(!L)return null;
  const lance=g=>{const e=g.ev.filter(x=>x.t==='g'||x.t==='c').slice(-1)[0];if(!e)return'';let n='';try{n=(nj2(g,e)||e.n||'')}catch(x){n=e.n||''}return(e.t==='g'?'⚽':(e.verm?'🟥':'🟨'))+' '+n.split(' ').slice(-1)[0]+' '+e.m+"' - "+(e.m<=45?'1º':'2º')};
  const nomesH=new Set(humLista().map(c=>c.id));
  return{t:Date.now(),min:L.min,tit:(()=>{try{return tituloAoVivo()}catch(e){return''}})(),
    jogos:L.jogos.map(g=>{const A=S.clubes[g.a],B=S.clubes[g.b],h=nomesH.has(g.a)||nomesH.has(g.b);
      return{a:A.nome,b:B.nome,ca:A.cor,cb:B.cor,cc:A.cor2||'#fff',cd:B.cor2||'#fff',ga:g.ga,gb:g.gb,est:g.est||'',pub:g.pub||0,lance:lance(g),h:h?1:0,
        ev:h?g.ev.filter(x=>x.t==='g'||x.t==='c').slice(-10).map(e=>{let n='';try{n=nj2(g,e)||e.n||''}catch(x){n=e.n||''}return{m:e.m,k:e.t==='g'?'g':(e.verm?'v':'a'),n,l:e.lado}}):null}})};
}
function onlTransmite(){
  if(!ONL.on||ONL.papel!=='host')return;

/* ---------- 6) EQUILÍBRIO: elencos reais na escala interna de cada liga ----------
   Os 9 elencos reais (JOG_REAL) usavam a nota crua (75–90) enquanto o resto do mundo
   usa a escala interna (Brasil ≈ 34–43, Inglaterra ≈ 49–57). Aqui a nota real é
   convertida: a média dos clubes reais de um país fica um pouco abaixo do pico da liga
   (PICO_LIGA) e a diferença entre eles e entre jogadores é preservada pela metade.      */
const BAL={esc:0.5,folga:2};
function balPais(nome){try{for(const p of Object.keys(LIGAS)){if(LIGAS[p][0].some(c=>c[0]===nome))return p}}catch(e){}return null}
function balTopMedia(arr){const f=arr.map(r=>r[4]).sort((a,b)=>b-a).slice(0,11);return f.reduce((a,b)=>a+b,0)/Math.max(1,f.length)}
function balRef(pais){const m=Object.keys(JOG_REAL).filter(n=>balPais(n)===pais).map(n=>balTopMedia(JOG_REAL[n]));return m.length?m.reduce((a,b)=>a+b,0)/m.length:null}
function balNota(f,pais){const ref=balRef(pais);if(ref==null)return f;const T=picoDe(pais,0)-BAL.folga;return Math.max(20,Math.min(95,Math.round((T+(f-ref)*BAL.esc)*10)/10))}
function balReescala(c,soSeCru){
  if(!c||!JOG_REAL[c.nome])return false;
  const pais=balPais(c.nome);if(!pais)return false;
  const reais=c.elenco.filter(j=>j.real);if(!reais.length)return false;
  const top=c.elenco.map(j=>j.f).sort((a,b)=>b-a).slice(0,11),M=top.reduce((a,b)=>a+b,0)/Math.max(1,top.length);
  if(soSeCru&&M<=picoDe(pais,0)+8)return false;           // já está na escala interna (save novo ou já migrado)
  const mk=mkDaChave((S?S.pais:'Brasil')+'|'+(S?S.div:0)+'|0');
  reais.forEach(j=>{const p0=j.pot==null?j.f:j.pot;j.f=balNota(j.f,pais);j.pot=Math.max(j.f,balNota(p0,pais));j.val=valorDe(j.f,j.idade,j.pot,mk);j.sal=salarioDe(j.f,mk)});
  c.forca=forcaMedia(c);return true;
}

/* Pool de candidatos de um país = jogadores da liga do país + estrangeiros reais + legionários */
function selPoolDe(p){
  if(SELV.pool[p])return SELV.pool[p];
  const out=[],vistos={};
  const add=(j,c,dom)=>{if(!j||vistos[j.id])return;vistos[j.id]=1;out.push({id:j.id,j,c,pais:p,dom})};
  if(LIGAS[p]){
    for(let i=0;i<LIGAS[p][0].length;i++){let c;try{c=clubeMundo(p,0,i)}catch(e){continue}
      if(c)c.elenco.forEach(j=>{if((j.nac||p)===p)add(j,c,true)})}
  }
  // estrangeiros reais e jogadores de clubes do meu campeonato
  try{S.clubes.forEach(c=>c.elenco.forEach(j=>{if(j.nac===p)add(j,c,true)}))}catch(e){}
  (S.sel.vp[p]||[]).forEach(j=>add(j,null,false));
  // reaplica a marca de convocado (jogadores gerados na hora não guardam a marca)
  const cv=S.sel.conv[p];
  if(cv&&cv.conf&&cv.ids){const set=new Set(cv.ids);out.forEach(r=>{if(set.has(r.id)&&r.c&&!r.j.conv)selMarca(r.j,p,cv.w)})}
  SELV.pool[p]=out;SELV.map[p]={};out.forEach(r=>SELV.map[p][r.id]=r);
  return out;
}

  const idadeAj=j.idade<=22?(Math.min(j.pot||j.f,j.f+8)-j.f)*.25:(j.idade>=34?-(j.idade-33)*.7:0);
  return j.f+forma+minutos*.4+idadeAj+((j.pot||j.f)-j.f)*.05;
}
