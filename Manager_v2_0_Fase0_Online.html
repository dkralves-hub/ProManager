/* Convocação automática (IA e botão "Completar" do usuário) */
function selAutoLista(p,max,jaIds){
  const quota=Object.assign({},selQuota(max)),pool=selPoolDe(p).filter(r=>selDisponivel(r)||(S.sel.conv[p]&&S.sel.conv[p].ids&&S.sel.conv[p].ids.includes(r.id)));
  const lista=(jaIds||[]).slice(),porPos={};pool.forEach(r=>(porPos[r.j.pos]=porPos[r.j.pos]||[]).push(r));
  const have={};lista.forEach(id=>{const r=SELV.map[p][id];if(r)have[r.j.pos]=(have[r.j.pos]||0)+1});
  Object.keys(quota).forEach(pos=>{
    const c=(porPos[pos]||[]).filter(r=>!lista.includes(r.id)).sort((a,b)=>selScore(b)-selScore(a));
    while((have[pos]||0)<quota[pos]&&c.length&&lista.length<max){const r=c.shift();lista.push(r.id);have[pos]=(have[pos]||0)+1}
  });
  // sobras: melhores restantes
  const resto=pool.filter(r=>!lista.includes(r.id)).sort((a,b)=>selScore(b)-selScore(a));
  while(lista.length<max&&resto.length)lista.push(resto.shift().id);
  return lista;
}
/* Aplica a convocação: marca os jogadores dos clubes e guarda a lista */
function selConfirma(p,ids,w,comp){
  const s=S.sel;selLiberaPais(p);
  selPoolDe(p);
  const okIds=ids.filter(id=>SELV.map[p][id]);
  s.conv[p]={ids:okIds,conf:true,w:w,comp:comp};
  okIds.forEach(id=>{const r=SELV.map[p][id];if(r.c)selMarca(r.j,p,w);selStat(r.j,p,'c')});
  return okIds;
}
function selLiberaPais(p){
  const cv=S.sel.conv[p];if(!cv||!cv.ids)return;
  selPoolDe(p);cv.ids.forEach(id=>{const r=SELV.map[p]&&SELV.map[p][id];if(r)selDesmarca(r.j)});
  cv.conf=false;
}
function selLiberaTodas(){
  const s=S.sel;Object.keys(s.conv).forEach(p=>selLiberaPais(p));
  // também limpa marcas órfãs nos clubes do meu campeonato (segurança contra saves interrompidos)
  try{S.clubes.forEach(c=>c.elenco.forEach(j=>{if(j.conv&&!(s.conv[j.conv.p]&&s.conv[j.conv.p].conf))selDesmarca(j)}))}catch(e){}
  Object.keys(S.ext||{}).forEach(k=>{try{S.ext[k].elenco.forEach(j=>{if(j.conv&&!(s.conv[j.conv.p]&&s.conv[j.conv.p].conf))selDesmarca(j)})}catch(e){}});
  selLimpaCache();
}
/* estatísticas pela seleção, guardadas por id do jogador */
function selStat(j,p,k,v){
  const js=S.sel.js,o=js[j.id]||(js[j.id]={p:p});
  if(k==='tit'){(o.t=o.t||[]).push(v);return o}
  o[k]=(o[k]||0)+(v==null?1:v);
  if(k==='j'&&!o.e)o.e=S.temp+'/'+(v||'ami');
  return o;
}
/* XI da seleção: melhores dos convocados em um 4-3-3 */
function selXI(p){
  const cv=S.sel.conv[p];selPoolDe(p);
  let refs=(cv&&cv.ids?cv.ids:[]).map(id=>SELV.map[p][id]).filter(Boolean);
  if(refs.length<14){refs=selAutoLista(p,23,[]).map(id=>SELV.map[p][id]).filter(Boolean)}
  const slots=[['GOL',1],['ZAG',2],['LD',1],['LE',1],['VOL',1],['MEI',2],['PE',2],['ATA',1]],xi=[],usados=new Set();
  slots.forEach(([pos,n])=>{
    const c=refs.filter(r=>r.j.pos===pos&&!usados.has(r.id)).sort((a,b)=>b.j.f-a.j.f).slice(0,n);
    c.forEach(r=>{xi.push(r);usados.add(r.id)});
  });
  const resto=refs.filter(r=>!usados.has(r.id)&&r.j.pos!=='GOL').sort((a,b)=>b.j.f-a.j.f);
  while(xi.length<11&&resto.length){const r=resto.shift();xi.push(r);usados.add(r.id)}
  const f=xi.reduce((q,r)=>q+r.j.f,0)/Math.max(1,xi.length);
  return{xi,f,refs};
}
function selForcaRapida(p){ // força sem depender de convocação (para sorteio, ranking e IA de convites)
  const info=SEL_INFO[p];return info?info.base:40;
}


/* ---------- partidas entre seleções ---------- */
function selPoisson(l,rg){let L=Math.exp(-l),k=0,p=1;do{k++;p*=rg()}while(p>L&&k<12);return k-1}
function selEscolhe(xi,pesos,rg,exceto){
  const arr=xi.map(r=>({r,w:(pesos[r.j.pos]||0)*Math.pow(Math.max(1,r.j.f)/40,2)*(exceto&&exceto.id===r.id?0:1)})),t=arr.reduce((q,x)=>q+x.w,0);
  if(t<=0)return null;let x=rg()*t;for(const a of arr){x-=a.w;if(x<=0)return a.r}return arr[arr.length-1].r;
}
const SEL_PGOL={GOL:0,ZAG:.5,LD:.9,LE:.9,VOL:.8,MEI:2.4,PE:3,ATA:5},SEL_PAST={GOL:.1,ZAG:.3,LD:1.4,LE:1.4,VOL:1,MEI:3.2,PE:3,ATA:1.8};
let SEL_SEQ=0;
/* Joga uma partida. opts: {ko, comp, md, neutro}. Devolve o relatório. */
function selJoga(a,b,opts){
  opts=opts||{};const s=S.sel;
  if(s.espiao){ // modo espião: só descobre qual é o jogo do usuário, sem efeitos
    if(a===s.meu||b===s.meu)s.espiao.jogo={a,b,opts:{comp:opts.comp,fase:opts.fase,ko:opts.ko,neutro:opts.neutro,md:opts.md}};
    return{a,b,ga:0,gb:0,pen:opts.ko?[1,0]:null,ev:[],comp:opts.comp||'ami',md:opts.md,fase:opts.fase||'',temp:S.temp,melhor:''};
  }
  const pre=s.liveRes;
  if(pre&&pre.a===a&&pre.b===b){ // partida do usuário jogada ao vivo: usa o resultado real
    s.liveRes=null;const xiA={xi:pre._xiA},xiB={xi:pre._xiB};delete pre._xiA;delete pre._xiB;
    Object.assign(pre,{comp:opts.comp||'ami',md:opts.md,fase:opts.fase||'',temp:S.temp});
    selAplicaResultado(pre,xiA,xiB,opts);return pre;
  }
  const rg=selRng('jogo|'+(++SEL_SEQ)+'|'+(S.temp||1)+'|'+a+'|'+b+'|'+Math.random());
  const A=selXI(a),B=selXI(b),fa=A.f,fb=B.f,dif=(fa-fb)/12;
  const casa=opts.neutro?0:.12;
  const la=Math.max(.25,Math.min(4.2,1.28+dif+casa)),lb=Math.max(.2,Math.min(4.2,1.12-dif-casa));
  let ga=selPoisson(la,rg),gb=selPoisson(lb,rg),pen=null;
  const evs=[];
  const gera=(X,n,lado)=>{for(let i=0;i<n;i++){
      const m=1+Math.floor(rg()*90),art=selEscolhe(X.xi,SEL_PGOL,rg);if(!art)continue;
      const as=rg()<.72?selEscolhe(X.xi,SEL_PAST,rg,art):null;evs.push({t:'g',m,lado,r:art,as})}};
  gera(A,ga,'a');gera(B,gb,'b');
  const cart=(X,lado)=>{const n=selPoisson(1.5,rg);for(let i=0;i<n;i++){const r=X.xi[Math.floor(rg()*X.xi.length)];if(r)evs.push({t:'am',m:1+Math.floor(rg()*90),lado,r})}
    if(rg()<.07){const r=X.xi[1+Math.floor(rg()*(X.xi.length-1))];if(r)evs.push({t:'vm',m:1+Math.floor(rg()*90),lado,r})}};
  cart(A,'a');cart(B,'b');
  if(opts.ko&&ga===gb){ // prorrogação/pênaltis resumidos
    const pa=3+Math.floor(rg()*3)+(rg()<.5+dif*.2?1:0),pb=3+Math.floor(rg()*3)+(rg()<.5-dif*.2?1:0);
    pen=pa===pb?(rg()<.5?[pa+1,pb]:[pa,pb+1]):[pa,pb];
  }
  evs.sort((x,y)=>x.m-y.m);
  const rel={a,b,ga,gb,pen,comp:opts.comp||'ami',md:opts.md,fase:opts.fase||'',temp:S.temp,ev:evs.map(e=>({t:e.t,m:e.m,lado:e.lado,id:e.r.id,n:e.r.j.nome,as:e.as?e.as.j.nome:null,aid:e.as?e.as.id:null})),
    melhor:null};
  // melhor da partida: o autor com mais gols ou o maior f do vencedor
  const venc=ga>gb?A:gb>ga?B:(pen&&pen[0]>pen[1]?A:B),golsPor={};
  evs.filter(e=>e.t==='g').forEach(e=>{golsPor[e.r.id]=(golsPor[e.r.id]||0)+1});
  const top=Object.keys(golsPor).sort((x,y)=>golsPor[y]-golsPor[x])[0];
  rel.melhor=top?(A.xi.concat(B.xi).find(r=>r.id===top).j.nome):venc.xi.slice().sort((x,y)=>y.j.f-x.j.f)[0].j.nome;
  selAplicaResultado(rel,A,B,opts);
  return rel;
}
function selAplicaResultado(rel,A,B,opts){
  const s=S.sel,a=rel.a,b=rel.b;
  // jogadores
  [[A,a],[B,b]].forEach(([X,p])=>X.xi.forEach(r=>{selStat(r.j,p,'j',rel.comp)}));
  rel.ev.forEach(e=>{
    const p=e.lado==='a'?a:b;
    if(e.t==='g'){const o=selStat({id:e.id},p,'g');o.r=Math.max(o.r||0,rel.ev.filter(x=>x.t==='g'&&x.id===e.id).length);if(e.aid)selStat({id:e.aid},p,'a')}
    if(e.t==='am')selStat({id:e.id},p,'am');
    if(e.t==='vm')selStat({id:e.id},p,'vm');
  });
  // ranking (Elo) — mata-mata e torneios valem mais
  const k=rel.comp==='ami'?20:(rel.comp==='copa'?60:40),ra=s.rank[a],rb=s.rank[b];
  const esp=1/(1+Math.pow(10,(rb-ra)/400)),res=rel.ga>rel.gb?1:rel.ga<rel.gb?0:(rel.pen?(rel.pen[0]>rel.pen[1]?.75:.25):.5);
  const delta=Math.round(k*(res-esp));s.rank[a]=ra+delta;s.rank[b]=rb-delta;
  // técnico do usuário
  [[a,rel.ga,rel.gb,1],[b,rel.gb,rel.ga,0]].forEach(([p,gp,gc])=>{
    const t=s.tec[p];if(!t||!t.user)return;
    const ts=s.tecst;ts.j++;ts.gp+=gp;ts.gc+=gc;
    if(gp>gc){ts.v++;ts.inv++}else if(gp===gc){ts.e++;ts.inv++}else{ts.d++;ts.inv=0}
    ts.maxInv=Math.max(ts.maxInv,ts.inv);
  });
  s.ult.unshift(rel);if(s.ult.length>30)s.ult.length=30;
  // artilharia/assistências da competição
  const c=opts&&opts.compObj;
  if(c){rel.ev.forEach(e=>{if(e.t==='g'){const o=c.art[e.id]||(c.art[e.id]={n:e.n,p:e.lado==='a'?a:b,g:0,a:0});o.g++}
      if(e.t==='g'&&e.aid){const o=c.art[e.aid]||(c.art[e.aid]={n:e.as,p:e.lado==='a'?a:b,g:0,a:0});o.a++}})}
}
function selRankPos(p){const s=S.sel;return SEL_PAISES.slice().sort((x,y)=>s.rank[y]-s.rank[x]).indexOf(p)+1}
function selAtualizaRkMax(){const s=S.sel,m=s.meu;if(!m)return;const r=selRankPos(m);if(s.tecst.rkMax==null||r<s.tecst.rkMax)s.tecst.rkMax=r}

/* ---------- competições ---------- */
function selRR(times){ // método do círculo: devolve rodadas [[a,b],...]
  const t=times.slice();if(t.length%2)t.push(null);const n=t.length,rod=[];
  for(let r=0;r<n-1;r++){const ps=[];for(let i=0;i<n/2;i++){const x=t[i],y=t[n-1-i];if(x&&y)ps.push(r%2?[y,x]:[x,y])}rod.push(ps);t.splice(1,0,t.pop())}
  return rod;
}
function selTab0(times){const o={};times.forEach(p=>o[p]={pts:0,j:0,v:0,e:0,d:0,gp:0,gc:0});return o}
function selTabAplica(tab,r){
  const A=tab[r.a],B=tab[r.b];if(!A||!B)return;A.j++;B.j++;A.gp+=r.ga;A.gc+=r.gb;B.gp+=r.gb;B.gc+=r.ga;
  if(r.ga>r.gb){A.v++;A.pts+=3;B.d++}else if(r.ga<r.gb){B.v++;B.pts+=3;A.d++}else{A.e++;B.e++;A.pts++;B.pts++}
}
function selOrdena(tab,times){return times.slice().sort((x,y)=>tab[y].pts-tab[x].pts||(tab[y].gp-tab[y].gc)-(tab[x].gp-tab[x].gc)||tab[y].gp-tab[x].gp||S.sel.rank[y]-S.sel.rank[x])}
function selSnake(times,G){const ord=times.slice().sort((x,y)=>S.sel.rank[y]-S.sel.rank[x]),gs=Array.from({length:G},()=>[]);ord.forEach((p,i)=>{const r=Math.floor(i/G),g=r%2?G-1-(i%G):i%G;gs[g].push(p)});return gs}
function selNovaComp(tipo,times,cfg){
  const s=S.sel,id=tipo+'_'+S.temp,c=Object.assign({id,tipo,temp:S.temp,times:times.slice(),fase:'grupos',grupos:[],ko:[],art:{},camp:null,vice:null,stage:0,jogos:[]},cfg||{});
  c.tab=selTab0(times);s.comps[id]=c;return c;
}
function selMontaGrupos(c,G,duplo){
  c.grupos=selSnake(c.times,G).map((ts,i)=>({n:'Grupo '+String.fromCharCode(65+i),times:ts,rod:(function(){const r=selRR(ts);return duplo?r.concat(r.map(x=>x.map(([p,q])=>[q,p]))):r})()}));
}
function selJogaRodadaGrupos(c,k,md){
  const out=[];
  c.grupos.forEach(g=>{(g.rod[k]||[]).forEach(([a,b])=>{const r=selJoga(a,b,{comp:c.tipo,md,fase:g.n,compObj:c,neutro:c.neutro});selTabAplica(c.tab,r);out.push(r)})});
  return out;
}
function selClassifGrupo(c,g){return selOrdena(c.tab,g.times)}
function selFaseKO(c,n){ // n = times vivos; monta confrontos por semeadura (1×último)
  let vivos=c.vivos;const jogos=[];
  for(let i=0;i<vivos.length/2;i++)jogos.push([vivos[i],vivos[vivos.length-1-i]]);
  return jogos;
}
function selJogaKO(c,md){
  const nome={16:'Oitavas',8:'Quartas',4:'Semifinal',2:'Final'}[c.vivos.length]||('Fase de '+c.vivos.length);
  const jogos=selFaseKO(c),out=[],prox=[];
  jogos.forEach(([a,b])=>{
    const r=selJoga(a,b,{comp:c.tipo,md,fase:nome,ko:true,compObj:c,neutro:true});out.push(r);
    const venc=r.ga>r.gb?a:r.ga<r.gb?b:(r.pen[0]>r.pen[1]?a:b);prox.push(venc);
    if(c.vivos.length===2){c.camp=venc;c.vice=venc===a?b:a}
  });
  c.ko.push({n:nome,r:out});
  // vencedores na ordem do chaveamento: mantém a semeadura (melhor vs pior)
  c.vivos=prox.sort((x,y)=>c.seed[x]-c.seed[y]);
  if(c.vivos.length<=1){c.fase='fim'}
  return out;
}
/* inicia o mata-mata a partir dos grupos */
function selIniciaKO(c,quantos){
  const q=[];const porGrupo=c.grupos.map(g=>selClassifGrupo(c,g));
  const nPor=Math.floor(quantos/c.grupos.length);let extras=quantos-nPor*c.grupos.length;
  porGrupo.forEach(l=>l.slice(0,nPor).forEach((p,i)=>q.push({p,pos:i})));
  if(extras>0){const terc=porGrupo.map(l=>l[nPor]).filter(Boolean).sort((x,y)=>c.tab[y].pts-c.tab[x].pts||(c.tab[y].gp-c.tab[y].gc)-(c.tab[x].gp-c.tab[x].gc)||c.tab[y].gp-c.tab[x].gp);terc.slice(0,extras).forEach(p=>q.push({p,pos:nPor}))}
  q.sort((x,y)=>x.pos-y.pos||c.tab[y.p].pts-c.tab[x.p].pts||(c.tab[y.p].gp-c.tab[y.p].gc)-(c.tab[x.p].gp-c.tab[x.p].gc)||c.tab[y.p].gp-c.tab[x.p].gp);
  c.vivos=q.map(x=>x.p);c.seed={};c.vivos.forEach((p,i)=>c.seed[p]=i);c.fase='ko';
}
function selFinalizaComp(c){

  const info=SEL_COMPS[c.tipo];
  const art=Object.keys(c.art).map(k=>Object.assign({id:k},c.art[k])).sort((x,y)=>y.g-x.g||y.a-x.a)[0];
  const ass=Object.keys(c.art).map(k=>Object.assign({id:k},c.art[k])).sort((x,y)=>y.a-x.a||y.g-x.g)[0];
  s.hist.unshift({temp:c.temp,tipo:c.tipo,nome:info.n,ic:info.ic,camp:c.camp,vice:c.vice,art:art?{n:art.n,p:art.p,g:art.g}:null,ass:ass?{n:ass.n,p:ass.p,a:ass.a}:null});
  // títulos dos jogadores do campeão
  if(c.camp&&s.conv[c.camp]&&s.conv[c.camp].ids){s.conv[c.camp].ids.forEach(id=>{const o=s.js[id];if(o)(o.t=o.t||[]).push(info.n+' '+(2026+c.temp))})}

    try{if(info.premio){S.clubes[S.meu].caixa+=info.premio;if(typeof lancaPremio==='function')lancaPremio(info.premio,'🏅 Premiação da federação: '+info.n)}}catch(e){}}
  s.recentes=s.recentes||[];s.recentes.unshift({t:c.camp,n:info.n,temp:S.temp});if(s.recentes.length>6)s.recentes.length=6;

/* qualificados da Copa a partir das eliminatórias */
function selApuraCopa(){
  const s=S.sel,el=s.comps['elim_'+(S.temp-1)]||Object.values(s.comps).filter(c=>c.tipo==='elim').sort((x,y)=>y.temp-x.temp)[0];
  const cota={UEFA:10,CONMEBOL:5,CAF:6,AFC:4,CONCACAF:3},q=[],resto=[];
  SEL_CONFS.forEach(cf=>{
    const times=SEL_PAISES.filter(p=>SEL_INFO[p].conf===cf),tab=el&&el.tabs?el.tabs[cf]:null;
    const ord=tab?selOrdena(tab,times):times.slice().sort((x,y)=>s.rank[y]-s.rank[x]);
    ord.slice(0,cota[cf]).forEach(p=>q.push(p));ord.slice(cota[cf]).forEach(p=>resto.push({p,pts:tab?tab[p].pts/Math.max(1,tab[p].j):0,rk:s.rank[p]}));
  });
  resto.sort((x,y)=>y.pts-x.pts||y.rk-x.rk);
  while(q.length<32&&resto.length)q.push(resto.shift().p);
  return q;
}
/* ---------- planejamento da temporada ---------- */
function selCiclo(){return ((S.temp-1)%4)+1}
/* cria as competições de TEMPORADA (janelas) e de VERÃO (torneios) */
function selPlanejaTemporada(){
  const s=S.sel;selIni();
  const ciclo=selCiclo(),porConf=cf=>SEL_PAISES.filter(p=>SEL_INFO[p].conf===cf);
  s.plano={ciclo,md:[],verao:[],temp:S.temp};
  s.mdAtual=0;
  // 1) competições que ocupam as 8 datas da temporada
  if(ciclo===1){ // UEFA Nations League (fase de liga: 4 grupos duplos = 6 datas)
    const c=selNovaComp('nl',porConf('UEFA'),{});selMontaGrupos(c,4,true);c.mdBase=0;c.verao=false;
  }
  if(ciclo===2||ciclo===3){ // eliminatórias: 16 datas em 2 temporadas
    let el=Object.values(s.comps).find(c=>c.tipo==='elim'&&c.ciclo===(ciclo===2?2:2)&&!c.fim);
    if(ciclo===2){
      el=selNovaComp('elim',SEL_PAISES,{ciclo:2,tabs:{},sched:{},jogou:0});el.id='elim_'+S.temp;
      SEL_CONFS.forEach(cf=>{
        const ts=porConf(cf).sort((x,y)=>s.rank[y]-s.rank[x]);el.tabs[cf]=selTab0(ts);
        let rod=selRR(ts);const dup=rod.length*2<=16;if(dup)rod=rod.concat(selRR(ts).map(r=>r.map(([a,b])=>[b,a])));
        el.sched[cf]=rod;
      });
    }
    if(el)s.plano.elim=el.id;
  }
  // 2) torneios de VERÃO desta temporada
  const V=s.plano.verao;
  const mk=(tipo,times,G,quantosKO,nome,cfg)=>{const c=selNovaComp(tipo,times,Object.assign({verao:true},cfg||{}));selMontaGrupos(c,G,false);c.quantosKO=quantosKO;V.push(c.id);return c};
  if(ciclo===1){mk('ouro',porConf('CONCACAF'),2,4);mk('asia',porConf('AFC'),2,4);mk('can',porConf('CAF'),2,4)}
  if(ciclo===2){mk('euro',porConf('UEFA'),4,8);
    const conv=porConf('CONCACAF').sort((x,y)=>s.rank[y]-s.rank[x]).slice(0,4);mk('ca',porConf('CONMEBOL').concat(conv),3,8)}
  if(ciclo===3){mk('ouro',porConf('CONCACAF'),2,4);mk('can',porConf('CAF'),2,4)}
  if(ciclo===4){mk('copa',selApuraCopa(),8,16,'',{neutro:true})}
}


/* ---------- calendário: Datas FIFA dentro da temporada + torneios de verão ---------- */
COMP_INFO.sel={n:'Seleções',ic:'🌐'};
const SEL_MESES_JANELA=[8,9,10,2];           // set, out, nov, mar
function selNovaEntrada(ref,extra){return Object.assign({comp:'sel',idx:0,mes:ref.mes,dia:ref.dia,ano:ref.ano,dow:ref.dow,res:null,adv:null,casa:null},extra)}
function selInsereJanelas(){
  const s=S.sel,ag=S.agenda;if(!ag||s.janTemp===S.temp)return;
  if(ag.some(d=>d.comp==='sel'))return;
  const pos=[];
  SEL_MESES_JANELA.forEach(m=>{
    const i=ag.findIndex((d,k)=>k>S.dia&&d.comp==='liga'&&d.mes===m&&d.dia>=8);
    if(i>=0)pos.push(i);
  });
  let w=pos.length;
  pos.slice().sort((x,y)=>y-x).forEach(i=>{
    w--;const ref=ag[i];
    ag.splice(i+1,0,selNovaEntrada(ref,{win:w,md:w*2+1,last:true}));
    ag.splice(i,0,selNovaEntrada(ref,{win:w,md:w*2,first:true}));
  });
  s.janTemp=S.temp;
}
function selIdxSel(){let n=0;(S.agenda||[]).forEach(d=>{if(d.comp==='sel')d.idx=n++})}
function selPreparaVerao(){
  const s=S.sel,ag=S.agenda;if(!s.plano||s.plano.temp!==S.temp)selPlanejaTemporada();
  if(s.plano.veraoOk)return false;s.plano.veraoOk=true;
  let ids=s.plano.verao.slice();
  if(selCiclo()===1){const nl=Object.values(s.comps).find(c=>c.tipo==='nl'&&c.temp===S.temp);if(nl){nl.koSo=true;ids.push(nl.id)}}
  const comps=ids.map(i=>s.comps[i]).filter(Boolean);if(!comps.length)return false;
  const dias=Math.max(...comps.map(c=>c.koSo?2:Math.max(...c.grupos.map(g=>g.rod.length))+Math.log2(c.quantosKO||4)));
  const ult=ag[ag.length-1],base=new Date(ult.ano,ult.mes,ult.dia);
  for(let i=0;i<dias;i++){const dt=new Date(base.getFullYear(),base.getMonth(),base.getDate()+12+i*4);
    ag.push({comp:'sel',idx:0,mes:dt.getMonth(),dia:dt.getDate(),ano:dt.getFullYear(),dow:dt.getDay(),res:null,adv:null,casa:null,verao:true,vi:i,first:i===0,last:i===dias-1})}
  selIdxSel();s.plano.veraoIds=ids;return true;
}

/* ---------- execução de uma data de seleções ---------- */
function selTimesDaData(d){
  const s=S.sel;if(d.verao)return (s.plano.veraoIds||[]).map(i=>s.comps[i]).filter(Boolean).flatMap(c=>c.times);
  return SEL_PAISES;
}
function selPrecisaConvocar(d){ // true se o usuário ainda precisa confirmar a convocação desta janela
  const s=S.sel;if(!s.meu||!d.first)return false;
  const cv=s.conv[s.meu],id=d.verao?'v'+S.temp:'j'+S.temp+'_'+d.win;
  if(cv&&cv.conf&&cv.w===id)return false;
  if(d.verao&&!selTimesDaData(d).includes(s.meu))return false;
  return true;
}
function selJanelaId(d){return d.verao?'v'+S.temp:'j'+S.temp+'_'+d.win}
function selConvocaIA(d){
  const s=S.sel,w=selJanelaId(d),verao=!!d.verao;
  const times=selTimesDaData(d);selLimpaCache();
  times.forEach(p=>{
    if(p===s.meu)return;
    const c=verao?(s.plano.veraoIds||[]).map(i=>s.comps[i]).find(x=>x&&x.times.includes(p)):null;
    const max=c?SEL_COMPS[c.tipo].max:23;
    selConfirma(p,selAutoLista(p,max,[]),w,c?c.tipo:'janela');
  });
}
function selMdMeuJogo(rels){const m=S.sel.meu;return m?rels.filter(r=>r.a===m||r.b===m):[]}
function selJogaData(d){
  const s=S.sel,rels=[];
  if(!d.verao){
    const md=d.md,ocup=new Set(),mdIn=md;
    // Nations League (fase de liga)
    Object.values(s.comps).filter(c=>c.tipo==='nl'&&c.temp===S.temp&&c.mdBase!=null&&!c.koSo).forEach(c=>{
      if(mdIn<6){selJogaRodadaGrupos(c,mdIn,mdIn).forEach(r=>{rels.push(r);ocup.add(r.a);ocup.add(r.b)})}
    });
    // Eliminatórias
    const pl=s.plano,el=pl&&pl.elim?s.comps[pl.elim]:null;
    if(el){
      const k=(pl.ciclo===2?0:8)+mdIn;
      SEL_CONFS.forEach(cf=>{(el.sched[cf][k]||[]).forEach(([a,b])=>{
        const r=selJoga(a,b,{comp:'elim',md:mdIn,fase:cf});selTabAplica(el.tabs[cf],r);selTabAplica(el.tab,r);rels.push(r);ocup.add(a);ocup.add(b)})});
      if(pl.ciclo===3&&mdIn===7){el.fim=true;el.fase='fim'}
    }
    // amistosos para quem ficou livre
    const livres=SEL_PAISES.filter(p=>!ocup.has(p)),rg=selRng('ami|'+S.temp+'|'+d.md),ruido={};
    livres.forEach(p=>ruido[p]=rg());
    livres.sort((x,y)=>(s.rank[y]+ruido[y]*350)-(s.rank[x]+ruido[x]*350));   // pareia vizinhos do ranking (com ruído, sempre igual para a mesma data)
    for(let i=0;i+1<livres.length;i+=2){rels.push(selJoga(livres[i],livres[i+1],{comp:'ami',md:d.md,fase:'Amistoso'}))}
  }else{
    const vi=d.vi;
    (s.plano.veraoIds||[]).map(i=>s.comps[i]).filter(Boolean).forEach(c=>{
      if(c.fase==='fim')return;
      if(c.koSo){ // Nations League: final four
        if(vi===0&&c.fase==='grupos')selIniciaKO(c,4);
        if(c.fase==='ko')selJogaKO(c,vi).forEach(r=>rels.push(r));
        if(c.fase==='fim'||c.vivos.length<=1)selFinalizaComp(c);
        return;
      }
      const R=Math.max(...c.grupos.map(g=>g.rod.length));
      if(vi<R){selJogaRodadaGrupos(c,vi,vi).forEach(r=>rels.push(r))}
      else{if(c.fase==='grupos')selIniciaKO(c,c.quantosKO);selJogaKO(c,vi).forEach(r=>rels.push(r))}
      if(c.fase==='fim'||(c.vivos&&c.vivos.length<=1&&c.fase==='ko'))selFinalizaComp(c);
    });
  }
  rels.forEach(r=>{const t=S.sel.tstat||(S.sel.tstat={});[[r.a,r.ga,r.gb],[r.b,r.gb,r.ga]].forEach(([p,gp,gc])=>{const o=t[p]||(t[p]={j:0,v:0,e:0,d:0,gp:0,gc:0});o.j++;o.gp+=gp;o.gc+=gc;if(gp>gc)o.v++;else if(gp===gc)o.e++;else o.d++})});
  selAtualizaRkMax();
  return rels;
}

      <div style="font-size:18px;text-align:center;margin:6px 0">${fl(r.a)} ${r.a} <b>${r.ga} x ${r.gb}</b> ${r.b} ${fl(r.b)}${r.pen?`<br><small class="mu">pênaltis ${r.pen[0]} x ${r.pen[1]}</small>`:''}</div>

function selRodadaData(d){
  const s=S.sel;
  if(d.first){
    if(selPrecisaConvocar(d)){s.pend={w:selJanelaId(d),verao:!!d.verao,win:d.win};S.aba='sel';s.sub='cvc';render();toast('🌐 Faça a convocação da sua seleção');return false}

const SEL_ADJ={Brasil:'Brasileira',Argentina:'Argentina',Colômbia:'Colombiana',Uruguai:'Uruguaia',Equador:'Equatoriana',Chile:'Chilena',Paraguai:'Paraguaia',Peru:'Peruana',França:'Francesa',Espanha:'Espanhola',Inglaterra:'Inglesa',Alemanha:'Alemã',Portugal:'Portuguesa',Itália:'Italiana',Holanda:'Holandesa',Bélgica:'Belga',Croácia:'Croata',Suíça:'Suíça',Dinamarca:'Dinamarquesa',Turquia:'Turca',Polônia:'Polonesa',Áustria:'Austríaca',Rússia:'Russa',Escócia:'Escocesa',México:'Mexicana','Estados Unidos':'Norte-Americana',Canadá:'Canadense','Costa Rica':'Costarriquenha',Panamá:'Panamenha',Jamaica:'Jamaicana',Marrocos:'Marroquina',Senegal:'Senegalesa',Nigéria:'Nigeriana','Costa do Marfim':'Marfinense',Egito:'Egípcia',Argélia:'Argelina',Gana:'Ganesa',Camarões:'Camaronesa',Tunísia:'Tunisiana','África do Sul':'Sul-Africana',Japão:'Japonesa','Coreia do Sul':'Sul-Coreana',Irã:'Iraniana',Austrália:'Australiana','Arábia Saudita':'Saudita',Catar:'Catariana',Uzbequistão:'Uzbeque',Iraque:'Iraquiana'};
function selReputacao(){
  const eu=S.clubes[S.meu],h=S.hist||[],tit=h.filter(x=>x.meu===1).length,top3=h.filter(x=>x.meu<=3).length;
  const aprov=eu&&eu.j>0?eu.pts/(3*eu.j):.45,cf=eu?forcaMedia(eu):35,ult=h.length?h[h.length-1].meu:null;
  let R=22+7*Math.min(5,tit)+2*Math.min(6,top3)+30*(aprov-.4)+(cf-35)*.55+(ult!=null?(ult<=3?6:ult>=15?-5:0):0);
  const ts=S.sel.tecst;R+=Math.min(15,ts.tit*6)+(ts.j>5?(ts.v/ts.j-.4)*20:0);
  return Math.max(5,Math.min(98,Math.round(R*10)/10));
}
function selExigencia(p){return (SEL_INFO[p].base-20)*2.2-(p===S.pais?8:0)}
function selAvaliaConvites(forca){
  const s=S.sel;if(s.meu||s.props.length)return;
  s.propAval++;if(!forca&&s.propAval%5)return;
  if(S.temp===1&&S.dia<12)return;
  const R=selReputacao(),ok=SEL_PAISES.filter(p=>!s.tec[p].user&&(!s.recusas[p]||S.temp-s.recusas[p]>=2)&&R>=selExigencia(p));
  if(!ok.length)return;
  if(!forca&&Math.random()>.35)return;
  ok.sort((x,y)=>SEL_INFO[y].base-SEL_INFO[x].base);
  const p=ok[Math.min(ok.length-1,Math.floor(Math.random()*Math.min(3,ok.length)))];
  s.props.push({p,temp:S.temp,R});
  setTimeout(()=>{try{selPropostaDlg(0)}catch(e){}},400);
}
function selPropostaDlg(i){
  const pr=S.sel.props[i];if(!pr)return;
  modal(`<div style="text-align:center"><div style="font-size:42px">${fl(pr.p)}</div><b>Convite da Federação</b>
   <p style="margin:10px 0">A Federação ${SEL_ADJ[pr.p]||'de Futebol'} deseja oferecer o cargo de treinador da Seleção ${SEL_ADJ[pr.p]?'':'de '}${pr.p}.</p>
   <small class="mu">Você continua no seu clube e passa a comandar também a seleção. Ranking FIFA: ${selRankPos(pr.p)}º</small></div>

}

function selRecusa(i){const s=S.sel,pr=s.props[i];if(!pr)return;fechaDlg();s.recusas[pr.p]=S.temp;s.props=[];save();render();toast('Convite recusado. Outras seleções podem procurar você.')}

/* ---------- virada de temporada ---------- */
function selFimTemporada(){
  const s=S.sel;selIni();selLiberaTodas();
  SEL_PAISES.forEach(p=>{
    const rg=selRng('env|'+p+'|'+S.temp),lista=s.vp[p]||[],info=SEL_INFO[p];
    lista.forEach(j=>{j.idade++;if(j.idade<25)j.f=Math.min(j.pot||j.f,j.f+Math.floor(rg()*3));else if(j.idade>31)j.f=Math.max(15,j.f-Math.floor(rg()*3))});
    s.vp[p]=lista.filter(j=>j.idade<37);
    const falta=20-s.vp[p].length;
    if(falta>0){const molde=['GOL','ZAG','ZAG','LD','LE','VOL','MEI','MEI','PE','ATA','ATA','ZAG','VOL','PE','GOL','MEI','ATA','LD','LE','ZAG'];
      for(let i=0;i<falta;i++){const x=criaJogadorFixo(molde[i%molde.length],info.base+Math.floor(rg()*7)-3,rg,18+Math.floor(rg()*3),null,p);s.vp[p].push({id:x.id,nome:x.nome,pos:x.pos,f:x.f,pot:x.pot,idade:x.idade,vp:1})}}
    // técnico da IA: troca se o ranking ficou muito abaixo do esperado
    const t=s.tec[p];if(t&&!t.user){const esp=SEL_PAISES.slice().sort((x,y)=>SEL_INFO[y].base-SEL_INFO[x].base).indexOf(p),real=selRankPos(p);
      if(real-esp>10&&rg()<.45||S.temp-t.desde>=8&&rg()<.3){t.nome=pickRg(rg,SILABAS1)+pickRg(rg,SILABAS2)+' '+pickRg(rg,SOBRE);t.desde=S.temp;t.rep=Math.round(info.base+rg()*8)}}
  });
  s.tstat=s.tstat||{};
  // poda estatísticas de jogadores que já saíram de cena (mantém quem tem história)
  try{const vivos=new Set();SEL_PAISES.forEach(p=>selPoolDe(p).forEach(r=>vivos.add(r.id)));
    Object.keys(s.js).forEach(id=>{const o=s.js[id];if(!vivos.has(id)&&(o.j||0)<10&&!o.g&&!o.t)delete s.js[id]})}catch(e){}
  s.edit=null;s.verCmp=null;
}

const SEL_SUBS=[['conv','📨','Convites'],['cvc','📝','Convocação'],['lst','📋','Convocados'],['agd','📅','Agenda'],['rkg','📊','Ranking FIFA'],['cmp','🏆','Competições'],['hst','📜','Histórico'],['tec','👔','Meu histórico']];
