<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Manager</title>
<style>
:root{--bg:#0e1a14;--card:#16271f;--card2:#1d3329;--ac:#f5c542;--tx:#eef5f0;--mu:#8fa89a;--ok:#3ddc84;--er:#ff5d5d;--bd:#2a4538}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;font-size:15px;padding-bottom:70px}
h1,h2,h3{margin:0}
header{background:linear-gradient(135deg,#0b3d2a,#14573c);padding:14px 16px;position:sticky;top:0;z-index:5;border-bottom:2px solid var(--ac)}
header h2{font-size:17px}header small{color:#cfe6d8}
.wrap{padding:12px;max-width:1200px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
button{background:var(--ac);color:#1a1a1a;border:0;border-radius:10px;padding:12px 14px;font-weight:700;font-size:15px}
button.s{background:var(--card2);color:var(--tx);border:1px solid var(--bd)}
button.sm{padding:6px 10px;font-size:13px;border-radius:8px}
button.big{width:100%;margin-top:8px}
button:disabled{opacity:.4}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--mu);text-align:left;font-weight:600;padding:5px 3px}
td{padding:6px 3px;border-top:1px solid var(--bd)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0a130e;border-top:1px solid var(--bd);z-index:9}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:12px 2px;font-size:12px}
nav button.on{color:var(--ac);border-top:2px solid var(--ac)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:11px;padding:2px 6px;border-radius:6px;background:var(--card2);color:var(--mu)}
.g{color:var(--ok)}.r{color:var(--er)}.y{color:var(--ac)}
input,select{background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:10px;font-size:15px;width:100%}
.clube{display:flex;justify-content:space-between;padding:12px;border:1px solid var(--bd);border-radius:10px;margin-bottom:8px;background:var(--card2)}
.pill{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.bar{height:6px;background:var(--bd);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.sel{background:#245a3f!important}
.field{background:linear-gradient(#1c6b43,#165536);border-radius:12px;padding:10px;margin-bottom:10px}
.line{display:flex;justify-content:space-around;margin:8px 0}
.pj{background:rgba(0,0,0,.35);border-radius:8px;padding:5px 7px;font-size:12px;text-align:center;min-width:62px}

.rod{background:#0f3d24;border-radius:10px;padding:6px;font-size:12px}
.jg{display:grid;grid-template-columns:1fr 54px 1fr;align-items:center;padding:7px 4px;border-bottom:1px solid #1d5a38;gap:4px}
.jg.meu{background:#1e6b43;border-radius:6px}
.jg .t{display:flex;align-items:center;gap:5px;padding:4px 6px;border-radius:5px;font-weight:700;font-size:12px;overflow:hidden;white-space:nowrap}
.jg .pl{text-align:center;font-weight:800;font-size:14px}
.est{color:#9fd0b2;font-size:10px;grid-column:1/4;text-align:center;margin-top:-2px}
.ev{font-size:11px;color:#ffb347;grid-column:1/4;text-align:center}
.pb{height:8px;background:#0a2a19;border-radius:5px;overflow:hidden;flex:1}.pb i{display:block;height:100%;background:#4aa3ff;width:0}
.pt{background:linear-gradient(#1f7a4a,#17603a);border-radius:12px;position:relative;padding:6px 0;border:2px solid #e9f5ee33;margin-bottom:8px}
.pt .ln{display:flex;justify-content:space-around;padding:5px 2px}
.pj2{text-align:center;font-size:10px;line-height:1.15;max-width:70px}
.pj2 .c{width:26px;height:26px;border-radius:50% 50% 8px 8px;margin:0 auto 2px;border:2px solid #fff6}
.pj2.x{opacity:.45}
.sc{display:flex;justify-content:space-between;align-items:stretch;margin-bottom:8px;font-weight:800}
.sc div{flex:1;padding:10px;text-align:center}
.st{display:grid;grid-template-columns:1fr auto 1fr;text-align:center;padding:3px 0;font-size:13px}
.lv{max-height:150px;overflow:auto;font-size:13px;background:#0a1d13;border-radius:8px;padding:8px;margin:8px 0}

.hd{background:linear-gradient(#0f3d24,#0b2e1b);border:1px solid #1d5a38;border-radius:8px;padding:8px;margin-bottom:8px}
.hd .top{display:flex;justify-content:space-between;font-size:12px;color:#d9ecdf;margin-bottom:6px}
.hd .mid{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;text-align:center}
.hd .nm{padding:6px 4px;border-radius:4px;font-weight:700;font-size:13px;background:#fff;color:#111}
.hd .pl2{font-size:24px;font-weight:800;padding:0 6px}
.hd .stt{display:grid;grid-template-columns:1fr auto 1fr;font-size:12px;text-align:center;margin-top:8px;gap:2px 6px}
.hd .stt span.l{color:#9fd0b2}
.pbar{height:10px;background:#e8efe9;border-radius:2px;overflow:hidden;width:90px;display:inline-block;vertical-align:middle}.pbar i{display:block;height:100%;background:#2e7d32}
.lj{display:grid;grid-template-columns:90px 1fr 38px 38px 1fr 90px;align-items:center;font-size:11px;border-bottom:1px solid #12331f}
.lj .ed{color:#cfe6d8;text-align:right;padding-right:4px;overflow:hidden;white-space:nowrap}
.lj .cl{padding:4px 5px;font-weight:600;overflow:hidden;white-space:nowrap;font-size:12px;color:#fff}
.lj .gl{text-align:center;background:#1c5a38;padding:4px 0;font-weight:700}
.lj .lance{font-size:10px;padding-left:4px;overflow:hidden;white-space:nowrap}
.lj.meu{outline:1px solid var(--ac)}
.pg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pg .col{background:#0e2a3a;border-radius:6px;padding:6px;font-size:11px}
.pg .jr{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px solid #16394f}
.pg h4{margin:6px 0 4px;color:#9fc7e0;font-size:12px}
.nota{font-weight:700}.nota.b{color:#3ddc84}.nota.r{color:#ff6b6b}
.cx{background:#0a2330;border-radius:6px;padding:8px;margin:8px 0;font-size:12px}

.cb{border-radius:12px;padding:12px;margin-bottom:10px;color:#fff}
.cb .tt{display:flex;align-items:center;gap:10px}
.cb h2{font-size:20px}
.cb small{opacity:.85}
.conf{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.conf .lb{font-size:11px;opacity:.9;margin-bottom:3px}
.conf .vb{height:18px;background:#0005;border-radius:4px;overflow:hidden;position:relative}
.conf .vb i{display:block;height:100%}
.conf .vb b{position:absolute;inset:0;text-align:center;font-size:12px;line-height:18px}
.pj3{background:#0004;border-radius:10px;padding:10px;margin-top:10px}
.sl{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sl label{font-size:11px;opacity:.9;display:block;margin-bottom:2px}
.sl select{padding:8px;font-size:13px}
.bt{display:flex;gap:8px;margin-top:10px}
.bt>div{flex:1;background:#0004;border-radius:10px;padding:8px;font-size:12px}
.el{width:100%;font-size:12px;border-collapse:collapse}
.el th{font-size:10px;color:var(--mu);text-align:left;padding:4px 2px;position:sticky;top:0;background:var(--card)}
.el td{padding:5px 2px;border-top:1px solid var(--bd);white-space:nowrap}
.el tr.t td{background:#1d4a33}.el tr.sel td{background:#1f5fae}
.sc2{overflow-x:auto}

.tt2{display:grid;grid-template-columns:1fr 84px;gap:6px}
.cmp{position:relative;background:repeating-linear-gradient(#2f8a46 0 38px,#2a7d3f 38px 76px);border:2px solid #e9f5ee66;border-radius:8px;height:430px;overflow:hidden}
.cmp:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:2px solid #ffffff55}
.cmp:after{content:"";position:absolute;left:50%;top:50%;width:70px;height:70px;margin:-35px;border:2px solid #ffffff55;border-radius:50%}
.gl1,.gl2{position:absolute;left:25%;right:25%;height:56px;border:2px solid #ffffff55}
.gl1{top:0;border-top:0}.gl2{bottom:0;border-bottom:0}
.cj{position:absolute;transform:translate(-50%,-50%);text-align:center;font-size:10px;line-height:1.1;width:64px;color:#fff;text-shadow:0 1px 2px #000}
.cj .sh{width:30px;height:28px;margin:0 auto 1px;border-radius:6px 6px 10px 10px;border:2px solid #fff8;position:relative}
.cj.sel .sh{outline:3px solid #4aa3ff}
.cj .cap{position:absolute;right:-4px;top:-4px;background:#f5c542;color:#111;border-radius:50%;width:13px;height:13px;font-size:9px;font-weight:800;line-height:13px}
.bk{display:flex;flex-direction:column;gap:4px;max-height:430px;overflow:auto}
.bk .it{background:#c9b84a;color:#222;border-radius:6px;padding:4px 2px;text-align:center;font-size:10px;line-height:1.1}
.bk .it.sel{outline:3px solid #4aa3ff}.bk .it.lz{opacity:.45}
.tl{width:100%;font-size:12px;border-collapse:collapse}
.tl th{font-size:10px;color:var(--mu);text-align:left;padding:3px 2px}
.tl td{padding:5px 2px;border-top:1px solid var(--bd);white-space:nowrap}
.tl tr.sel td{background:#1f5fae}.tl tr.t td{background:#1d4a33}.tl tr.sel.t td{background:#1f5fae}
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tgrid label{font-size:11px;color:var(--mu);display:block;margin-bottom:2px}
.tgrid select{padding:8px;font-size:13px}
.ck{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px}.ck input{width:auto}

@media(min-width:760px){.home2{display:grid;grid-template-columns:340px 1fr;gap:12px;align-items:start}}
.ficha{background:#0004;border-radius:10px;padding:10px;margin-top:10px;font-size:13px}
.ficha .ln2{display:flex;justify-content:space-between;padding:2px 0}
.abas{display:flex;gap:4px;margin-top:10px}
.abas button{flex:1;padding:7px 2px;font-size:12px;background:#0005;color:#fff;border-radius:8px 8px 0 0}
.abas button.on{background:#fff;color:#111}
.acoes{display:flex;gap:6px;margin-top:8px}.acoes button{flex:1;padding:8px 2px;font-size:12px;background:#fff;color:#111;border:1px solid #888}
.ln2.row{padding:5px 0;border-bottom:1px solid var(--bd)}
.nav2{overflow-x:auto}

.cmp .cj{transition:left .25s,top .25s}
.cmp.mv{outline:2px dashed #4aa3ff}
.alvo{position:absolute;inset:0;z-index:3}
.hint{background:#1f5fae;color:#fff;border-radius:8px;padding:6px 8px;font-size:12px;margin:6px 0;text-align:center}
.outras{max-height:340px;overflow-y:auto;background:#0e2318;border-radius:8px;padding:4px;margin-top:8px}
.outras .dv{position:sticky;top:0;background:#14301f;font-size:11px;color:#9fd0b2;padding:3px 6px;font-weight:700}
.ol{display:grid;grid-template-columns:1fr 26px 26px 1fr;align-items:center;font-size:11px;border-bottom:1px solid #12331f;gap:2px}
.ol .n{padding:3px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ol .g{text-align:center;background:#1c5a38;font-weight:700;padding:3px 0}
.ol.gol{animation:pisca 1s 2}
@keyframes pisca{50%{background:#5a4a12}}
.vtela{display:flex;gap:6px;margin:8px 0}

/* ===== CAMPO ARRASTÁVEL ===== */
.pitch{position:relative;width:100%;aspect-ratio:3/4.1;border-radius:10px;overflow:hidden;border:3px solid #cfe8d6;touch-action:none;user-select:none;-webkit-user-select:none;
 background:repeating-linear-gradient(0deg,#2c7a2f 0 7.1%,#348a37 7.1% 14.2%)}
.pitch svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.pl{position:absolute;transform:translate(-50%,-50%);width:74px;text-align:center;color:#fff;font-size:10.5px;line-height:1.12;font-weight:700;text-shadow:0 1px 2px #000,0 0 3px #000;touch-action:none;cursor:grab;z-index:4}
.pl svg{width:40px;height:40px;display:block;margin:0 auto 1px;filter:drop-shadow(0 2px 2px #0008)}
.pl small{display:block;font-weight:600;font-size:9.5px;opacity:.95}
.pl.drag{z-index:30;cursor:grabbing;transform:translate(-50%,-50%) scale(1.15);filter:brightness(1.15)}
.pl.alvo2{outline:2px solid #4aa3ff;border-radius:8px}
.pl .cpt{position:absolute;right:8px;top:-2px;background:#f5c542;color:#111;border-radius:50%;width:14px;height:14px;font-size:9px;line-height:14px;font-weight:800;text-shadow:none}
.ghost{position:absolute;transform:translate(-50%,-50%);width:58px;text-align:center;color:#fff;font-size:9px;font-weight:700;pointer-events:none;z-index:2;opacity:.45}
.ghost svg{width:34px;height:34px;display:block;margin:0 auto;opacity:.8}
.ghost.perto{opacity:.95}
.ghost.perto svg{filter:drop-shadow(0 0 6px #fff)}
.ghost .ring{position:absolute;left:50%;top:17px;width:44px;height:44px;margin:-22px 0 0 -22px;border:2px dashed #ffffffaa;border-radius:50%}
.ghost.perto .ring{border-color:#ffe36a;border-style:solid}
.escola{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:10px;align-items:start}
@media(max-width:620px){.escola{grid-template-columns:1fr}}
.painelD{background:#0f2a1a;border:1px solid var(--bd);border-radius:12px;padding:10px}
.advbar{display:flex;justify-content:space-between;align-items:center;background:#16301f;border-radius:8px;padding:8px 10px;margin-bottom:8px;font-size:13px}
.bancoF{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:6px;margin:6px 0 10px}
.bj{text-align:center;font-size:10px;line-height:1.1;font-weight:700;padding:4px 2px;border-radius:8px;background:#0b2014;touch-action:none;cursor:grab;position:relative}
.bj svg{width:34px;height:34px;display:block;margin:0 auto 2px}
.bj small{display:block;font-weight:600;color:#9fc4ad;font-size:9px}
.bj.lz{opacity:.4}
.bj.drag{opacity:.5}
.drop{outline:2px dashed #4aa3ff}
.ctl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.ctl label{font-size:11px;color:var(--mu);display:block;margin-bottom:2px}
.ctl select{padding:8px;font-size:13px}
.dragclone{position:fixed;z-index:999;pointer-events:none;width:64px;text-align:center;color:#fff;font-size:10px;font-weight:700;transform:translate(-50%,-60%);text-shadow:0 1px 2px #000}
.dragclone svg{width:44px;height:44px}
.tq{outline:3px solid #4aa3ff;border-radius:10px;background:#1f5fae55}

/* ===== TEMA VISUAL v15 ===== */
:root{--bg:#0a1310;--card:#12211a;--card2:#1a2f25;--ac:#ffc83d;--ac2:#ff9f1c;--tx:#f1f7f3;--mu:#90aa9b;--ok:#34d98b;--er:#ff5d6c;--bd:#27423459}
body{background:radial-gradient(1200px 600px at 80% -10%,#133a2a 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,#0f2c3a 0%,transparent 55%),var(--bg);background-attachment:fixed;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.1px}
h1,h2,h3{font-weight:800;letter-spacing:-.2px}
header{background:linear-gradient(180deg,#0e3b29ee,#0b2a1fdd);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid #ffc83d55;box-shadow:0 6px 24px #0008}
header h2{display:flex;align-items:center;gap:8px;font-size:18px}
.card{background:linear-gradient(180deg,#15271f,#101e17);border:1px solid #2a45385c;border-radius:16px;box-shadow:0 8px 24px #0006,inset 0 1px 0 #ffffff0d;padding:14px}
button{background:linear-gradient(180deg,#ffd45e,#ffb81f);color:#1b1402;border:0;border-radius:12px;padding:12px 16px;font-weight:800;box-shadow:0 3px 0 #b07a00,0 8px 16px #0005;transition:transform .08s,filter .15s}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #b07a00}
button.s{background:linear-gradient(180deg,#223a2f,#1a2f25);color:var(--tx);border:1px solid #2f4d3d;box-shadow:0 3px 0 #0b1812,0 8px 16px #0004}
button.sm{padding:7px 11px;border-radius:9px;font-size:13px}
nav{background:linear-gradient(180deg,#0b1712ee,#07100c);backdrop-filter:blur(12px);border-top:1px solid #2a4538;padding-bottom:max(2px,env(safe-area-inset-bottom))}
nav button{background:none;box-shadow:none;color:#7f9a8b;font-weight:700;border-radius:0;position:relative;transition:color .15s}
nav button.on{color:var(--ac);border-top:0}
nav button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 4px 4px;background:var(--ac);box-shadow:0 0 12px var(--ac)}
nav button span.ic{display:block;font-size:19px}
.clube{border-radius:14px;background:linear-gradient(180deg,#1a2f25,#15271f);border:1px solid #2a4538;transition:transform .12s,border-color .12s;padding:13px}
.clube:active{transform:scale(.985);border-color:var(--ac)}
.tag{border-radius:999px;padding:3px 9px;font-size:11px;font-weight:700;letter-spacing:.3px}
table{font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:99px;background:#0a1612}.bar i{border-radius:99px}
input,select{border-radius:12px;background:#0f1d16;border:1px solid #2c4739;color:var(--tx)}
input:focus,select:focus{outline:2px solid #ffc83d88}
.cb{border-radius:20px;box-shadow:0 14px 34px #0009,inset 0 1px 0 #ffffff22;position:relative;overflow:hidden}
.cb::after{content:"";position:absolute;inset:0;background:radial-gradient(500px 220px at 90% -20%,#ffffff22,transparent 60%);pointer-events:none}
.pj3{border-radius:14px;background:#0006;border:1px solid #ffffff14}
.vb{height:20px;border-radius:99px}.vb i{border-radius:99px}
.hd{background:linear-gradient(180deg,#123b29,#0b2a1d);border:1px solid #ffc83d33;border-radius:16px;box-shadow:0 10px 26px #0007}
.hd .pl2{font-size:30px;text-shadow:0 2px 10px #000a}
.rod,.outras{border-radius:14px;border:1px solid #1d5a38;background:#0b2217}
.lj{transition:background .2s}.lj:active{background:#1d5a38}
.pitch{border-radius:16px;box-shadow:0 14px 34px #000a,inset 0 0 40px #0006}
.hint{background:linear-gradient(90deg,#1f5fae,#2a73d1);border-radius:12px;font-weight:600}
.painelD{border-radius:16px;background:linear-gradient(180deg,#112a1c,#0d2016);box-shadow:0 10px 26px #0007}
.bj{border:1px solid #ffffff14;background:linear-gradient(180deg,#12281c,#0b1c13)}
.pl small{background:#0009;border-radius:6px;padding:0 4px;display:inline-block;margin-top:1px}
@keyframes gol{0%{transform:scale(.6);opacity:0}25%{transform:scale(1.15);opacity:1}100%{transform:scale(1);opacity:0}}
.golfx{position:fixed;left:0;right:0;top:34%;text-align:center;font-size:64px;font-weight:900;color:#ffd45e;text-shadow:0 4px 0 #b07a00,0 0 40px #ffd45e;z-index:999;pointer-events:none;animation:gol 2.2s ease-out forwards}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:#0b1712f2;border:1px solid var(--ac);color:var(--tx);padding:9px 16px;border-radius:999px;font-weight:700;font-size:13px;z-index:998;box-shadow:0 10px 30px #000a;animation:toastIn .25s}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,10px)}to{opacity:1;transform:translate(-50%,0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.fade{animation:fadeIn .25s ease-out}
@keyframes fadeIn{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.kpi{background:#0005;border:1px solid #ffffff14;border-radius:12px;padding:8px;text-align:center}
.kpi b{display:block;font-size:17px}.kpi small{font-size:10px;opacity:.8;text-transform:uppercase;letter-spacing:.5px}
.forma{display:flex;gap:4px;margin:6px 0 2px}
.forma i{width:20px;height:20px;border-radius:6px;font-style:normal;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;color:#06140d}
.forma .V{background:#34d98b}.forma .E{background:#ffc83d}.forma .D{background:#ff5d6c}
.menuG{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.menuG button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 2px;font-size:11px;background:linear-gradient(180deg,#1f3a2e,#172b22);color:var(--tx);border:1px solid #2f4d3d;box-shadow:0 3px 0 #0b1812}
.menuG button span{font-size:22px}

/* ===== PÓS-JOGO (formato clássico) ===== */
.pj{display:grid;grid-template-columns:230px minmax(0,1fr);gap:10px;align-items:start}
@media(max-width:760px){.pj{grid-template-columns:1fr}}
.lat{background:#f2f2f2;border-radius:10px;overflow:hidden;color:#111;border:1px solid #cfcfcf;max-height:560px;display:flex;flex-direction:column}
.lat select{margin:6px;width:calc(100% - 12px);padding:7px;font-size:13px;background:#fff;color:#111;border:1px solid #999;border-radius:6px}
.lat .corpo{overflow-y:auto;flex:1}
.lat .dvh{background:#f6d9b8;color:#5a3300;font-weight:800;font-size:11px;padding:3px 8px;border-top:1px solid #d9b98f;border-bottom:1px solid #d9b98f}
.lat .rj{display:grid;grid-template-columns:1fr 38px 1fr;align-items:center;font-size:11.5px;border-bottom:1px solid #ddd;background:#fff}
.lat .rj:nth-child(odd){background:#f7f7f7}
.lat .rj .t{padding:3px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.lat .rj .t.b{justify-content:flex-start}
.lat .rj .p{text-align:center;font-weight:800;background:#e8eef4}
.lat .rj.meu{outline:2px solid #e0a800;background:#fff3c4}
.painelJ{background:#0d2d17;border-radius:12px;padding:8px;border:1px solid #1d5a38}
.pjh{background:linear-gradient(180deg,#1b1b1b,#000);border-radius:10px;border:1px solid #444;padding:8px 10px;text-align:center}
.pjh .tt{color:#f5c542;font-weight:700;font-size:13px}
.pjh .pl3{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;margin-top:4px}
.pjh .big3{font-size:34px;font-weight:900;color:#fff}
.pjc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.9fr) minmax(0,1fr);gap:6px;margin-top:8px}
@media(max-width:560px){.pjc{grid-template-columns:1fr}}
.tm{background:#7a8f7a22;border-radius:6px}
.tm .h{background:#2c4a33;color:#fff;font-weight:800;font-size:12px;padding:4px 6px;border-radius:6px 6px 0 0}
.tm .r{display:flex;justify-content:space-between;font-size:12px;padding:2px 6px;border-bottom:1px solid #ffffff10}
.nt{font-weight:800}.nt.o{color:#7dff9a}.nt.m{color:#e6e6e6}.nt.f{color:#ff8a8a}
.cen{background:#1e5a2b;border-radius:6px;padding:6px;font-size:12px}
.cen .box{background:#0006;border-radius:6px;padding:6px;margin-bottom:6px}
.cen h5{margin:0 0 4px;color:#ffd45e;font-size:12px}
.est2{display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;font-size:12px;text-align:center}
.est2 b{color:#fff}.est2 span{color:#ffd45e;font-weight:700}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{font-size:10px;text-align:center;color:var(--mu);padding:2px 0}
.cal .d{min-height:62px;background:#0e2318;border:1px solid #1d3a2b;border-radius:8px;padding:3px;font-size:10px;position:relative;overflow:hidden}
.cal .d.vz{background:transparent;border:0}
.cal .d .n{position:absolute;top:2px;right:4px;color:#7f9a8b;font-size:10px}
.cal .d.jg{background:#16301f;border-color:#2f6b45}
.cal .d.hoje{outline:2px solid var(--ac);background:#2a3a14}
.cal .d.feito{opacity:.85}
.cal .d .ic{font-size:14px;display:block}
.cal .d .tx{display:block;line-height:1.1;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal .d .rs{font-weight:800}
.calnav{display:flex;align-items:center;justify-content:space-between;margin:8px 0}
.leg{display:flex;flex-wrap:wrap;gap:6px;font-size:11px;margin:6px 0}.leg span{background:#0e2318;border-radius:999px;padding:2px 8px}

.hb{display:inline-block;font-size:10px;padding:1px 6px;border-radius:999px;margin-right:3px;font-weight:700}
.hb.ideal{background:#14532d;color:#86efac}.hb.bom{background:#1e3a5f;color:#93c5fd}.hb.fraco{background:#4a2020;color:#fca5a5}
.est1{color:#facc15}.est2{color:#ef4444}
.pot{font-size:10px;color:var(--mu)}

.barraTempo{position:sticky;top:64px;z-index:6;display:flex;gap:8px;justify-content:flex-end;padding:6px 2px;margin:-4px 0 6px;background:linear-gradient(#0a1310f2,#0a1310cc);backdrop-filter:blur(8px)}
.barraTempo button{flex:1;max-width:120px;padding:9px 6px}

.titulo{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 18px;background:radial-gradient(700px 400px at 50% -10%,#14573c88,transparent 60%)}
.titulo .logo{text-align:center;margin-bottom:26px}
.titulo .logo .bola{font-size:64px;filter:drop-shadow(0 8px 14px #000a)}
.titulo .logo h1{font-size:30px;margin:8px 0 2px;letter-spacing:-.5px}
.titulo .logo small{color:var(--mu)}
.titulo button.grande{width:100%;padding:16px;font-size:17px;margin-bottom:10px}
.passo{display:flex;gap:6px;justify-content:center;margin:0 0 12px}
.passo i{width:34px;height:5px;border-radius:99px;background:#27423a}.passo i.on{background:var(--ac)}
.slotc{display:flex;justify-content:space-between;align-items:center;gap:8px;background:linear-gradient(180deg,#1a2f25,#15271f);border:1px solid #2a4538;border-radius:14px;padding:12px;margin-bottom:8px}
.slotc.vazio{opacity:.55}
.disq{width:38px;height:38px;border-radius:10px;border:1px solid #ffffff22;background:#0004;padding:0;font-size:20px;box-shadow:none}

/* ===== ELENCO ESTILO GESTOR (v33) ===== */
.elTopo{border-radius:16px;padding:12px;margin-bottom:8px;box-shadow:0 10px 26px #0008,inset 0 1px 0 #ffffff22}
.elT1{display:flex;align-items:center;gap:10px}
.elNome{font-size:19px;font-weight:800;letter-spacing:.2px}
.elSub{font-size:11.5px;opacity:.85}
.elKp{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.elKp>div{background:#0000004d;border-radius:10px;padding:6px 4px;text-align:center}
.elKp b{display:block;font-size:15px}.elKp small{font-size:10px;opacity:.8}
.elOrd{display:flex;gap:5px;overflow-x:auto;padding:2px 0 8px}
.elOrd button{flex:0 0 auto;padding:6px 11px;font-size:12px;border-radius:99px;background:var(--card2);color:var(--mu);border:1px solid var(--bd)}
.elOrd button.on{background:var(--ac);color:#1a1300;border-color:var(--ac);font-weight:800}
.elTab{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
.elH,.elL{display:grid;grid-template-columns:38px 1fr 30px 38px 54px 26px;align-items:center;gap:5px;padding:0 8px}
.elH{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--mu);background:#0000003a;padding-top:6px;padding-bottom:6px}
.elH span:nth-child(n+3),.elL>span:nth-child(n+3){text-align:center}
.elL{min-height:48px;border-top:1px solid var(--bd);cursor:pointer;transition:background .15s}
.elL:active{background:#244637}
.elL.tit{background:linear-gradient(90deg,#1f5a3a55,transparent 70%)}
.elP{font-size:10px;font-weight:800;color:#10170f;border-radius:5px;padding:2px 0;text-align:center}
.elN{min-width:0;display:flex;flex-direction:column;line-height:1.2}
.elN b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.elN small{font-size:10px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk{font-style:normal;font-size:10px;margin-left:4px}.mk.t{color:var(--ok);font-size:9px}
.elF{font-weight:800;font-size:15px;color:var(--ac)}
.elNt{font-weight:800;font-size:13px}
.elE{position:relative;height:16px;background:#0006;border-radius:99px;overflow:hidden}
.elE i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;opacity:.9}
.elE b{position:absolute;inset:0;text-align:center;font-size:10px;line-height:16px;text-shadow:0 1px 2px #000}
.elC{font-size:12px;color:var(--mu)}.elC.r{color:var(--er);font-weight:800}
/* ficha do jogador */
.fcHead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-bottom:8px;border-bottom:1px solid var(--bd)}
.fcNome{font-size:18px;font-weight:800}.fcSub{font-size:12px;color:var(--mu)}
.fcF{font-size:34px;font-weight:900;color:var(--ac);text-align:center;line-height:1}.fcF small{display:block;font-size:10px;color:var(--mu);font-weight:600}
.fcGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.fcGrid>div,.fcNotaBox>div:not(.fcGraf){background:var(--card2);border-radius:9px;padding:6px;text-align:center}
.fcGrid small,.fcNotaBox small{display:block;font-size:10px;color:var(--mu)}.fcGrid b{font-size:13px}
.fcNotaBox{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
.fcNotaBox b{font-size:18px}
.fcGraf{grid-column:1/3;height:46px;display:flex;align-items:flex-end;gap:3px;background:#0004;border-radius:9px;padding:5px}
.fcGraf i{flex:1;border-radius:3px 3px 0 0;min-height:4px}
.hnH,.hnL{display:grid;grid-template-columns:44px 38px 40px 1fr 52px 34px;gap:4px;align-items:center;padding:4px 6px;font-size:11.5px}
.hnH{font-size:10px;text-transform:uppercase;color:var(--mu);border-bottom:1px solid var(--bd)}
.hnL{border-bottom:1px solid #ffffff0d}.hnL:nth-child(odd){background:#ffffff08}
.hnN{text-align:right;font-size:14px}.hnR{font-weight:700}.hnC{color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hnLista{max-height:230px;overflow-y:auto}
.fcAcoes{display:flex;gap:6px;margin-top:10px}
.fcAcoes button{flex:1;padding:10px 2px;font-size:13px;border-radius:10px;background:var(--card2);color:var(--tx);border:1px solid var(--bd)}
.fcAcoes button.v{background:#4a2020;border-color:#7a3030;color:#fca5a5}.fcAcoes button.x{background:transparent}

/* ===== AO VIVO MAIS SOFISTICADO (v33) ===== */
.hd .nmC{position:relative;padding:7px 8px;border-radius:10px;font-weight:800;font-size:14px;letter-spacing:.3px;text-align:center;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 4px 12px #0006,inset 0 1px 0 #ffffff33;overflow:hidden}
.hd .nmC span{position:relative;text-shadow:0 1px 3px #000c;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd .nmC::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 40%,#ffffff22 50%,transparent 60%)}
.rod .lj2{padding:6px 6px 7px;border-bottom:1px solid #12331f;transition:background .2s}
.rod .lj2:active{background:#1d5a38}
.rod .lj2.meu{background:linear-gradient(90deg,#f5c54222,transparent);outline:1px solid var(--ac);border-radius:8px;margin:2px 0}
.l2t{display:flex;justify-content:space-between;gap:8px;font-size:10px;color:#9fd0b2;margin-bottom:3px}
.l2e{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.l2l{white-space:nowrap;color:#ffd966}
.l2r{display:grid;grid-template-columns:1fr 30px 30px 1fr;gap:3px;align-items:stretch}
.l2c{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:7px;font-weight:700;font-size:12.5px;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));min-width:0;box-shadow:inset 0 1px 0 #ffffff25}
.l2c span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px #000b}
.l2c.d{justify-content:flex-end;text-align:right}
.l2g{display:flex;align-items:center;justify-content:center;background:#0b2e1b;border:1px solid #1d5a38;border-radius:7px;font-weight:900;font-size:16px}
.l2g.w{background:var(--ac);color:#1a1300;border-color:var(--ac)}

.cmTopo{display:flex;justify-content:space-between;align-items:center}
.cmT{font-size:16px;font-weight:800}.cmS{font-size:12px;color:var(--mu)}.cmTrof{font-size:34px}
.cmBar{height:8px;background:#0006;border-radius:99px;overflow:hidden;margin:10px 0}
.cmBar i{display:block;height:100%;background:linear-gradient(90deg,#f5c542,#ffdf7a);border-radius:99px}
.cmCamp{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#f5c54233,transparent);border:1px solid #f5c54255;border-radius:12px;padding:8px 10px}
.cmCamp small{display:block;font-size:10px;letter-spacing:1px;color:var(--ac)}.cmCamp b{font-size:17px}
.cmJ{display:grid;grid-template-columns:1fr 26px 26px 1fr;gap:3px;margin-bottom:3px}
.cmC{display:flex;align-items:center;gap:6px;padding:5px 7px;border-radius:7px;background:var(--card2);font-size:12px;min-width:0;opacity:.75}
.cmC.v{opacity:1;font-weight:800;background:#245a3f}.cmC.d{justify-content:flex-end}
.cmC span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cmP{display:flex;align-items:center;justify-content:center;background:#0b2e1b;border-radius:7px;font-weight:800}

.hmEl{background:#0004;border-radius:10px;overflow:hidden;margin-top:10px}
.hmH,.hmL{display:grid;grid-template-columns:34px 1fr 28px 34px 50px;align-items:center;gap:5px;padding:0 7px}
.hmH{font-size:10px;text-transform:uppercase;color:#ffffffaa;padding-top:5px;padding-bottom:5px;background:#0003}
.hmH span:nth-child(n+3),.hmL>span:nth-child(n+3){text-align:center}
.hmL{min-height:34px;border-top:1px solid #ffffff14;font-size:12.5px;cursor:pointer}
.hmL:active{background:#ffffff18}.hmL.tit{background:#ffffff10}
.hmP{font-size:9.5px;font-weight:800;color:#10170f;border-radius:4px;padding:2px 0;text-align:center}
.hmN{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.hmF{font-weight:800;color:#ffd45e;text-align:center}
.hmE{position:relative;height:14px;background:#0007;border-radius:99px;overflow:hidden}
.hmE i{position:absolute;left:0;top:0;bottom:0;opacity:.9}.hmE b{position:absolute;inset:0;text-align:center;font-size:9.5px;line-height:14px;text-shadow:0 1px 2px #000}

/* ===== ABAS REFORMADAS (v35) ===== */
.inL{display:flex;justify-content:space-between;align-items:center;padding:9px 2px;border-bottom:1px solid var(--bd);font-size:13.5px}
.inL:last-child{border-bottom:0}.inL span{color:var(--mu)}
.upL{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.upL:first-of-type{border-top:0}.upL small{display:block;color:var(--mu);font-size:11.5px;margin-top:2px}
.upL button{flex:0 0 auto;min-width:92px}
.chipL{display:flex;gap:6px;flex-wrap:wrap}
.chipL button{flex:1 1 70px;padding:10px 4px;border-radius:10px;background:var(--card2);color:var(--tx);border:1px solid var(--bd);font-weight:700;font-size:13px}
.tbL{margin-top:8px}.tbR{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--bd)}
.tbN{display:flex;align-items:center;gap:8px;min-width:0}.tbN>span{display:flex;flex-direction:column;min-width:0}
.tbN b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tbN small{font-size:11px;color:var(--mu)}

.elH.rk,.elL.rk{grid-template-columns:28px 1fr 28px 34px 38px}
.rkN{font-weight:800;color:var(--mu);text-align:center}
/* ===== tratamento global de tabelas e cartões (v35) ===== */
table{border-collapse:separate;border-spacing:0}
th{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--mu);font-weight:700;padding:6px 3px;text-align:left}
td{padding:8px 3px}
tr:nth-child(even) td{background:#ffffff06}
.card{border-radius:16px;box-shadow:0 6px 18px #0005;border-color:#2f4d3d}
.card h3{font-size:16px;margin-bottom:6px}
.hd .top b{font-size:14px;letter-spacing:.2px}
button.sm{min-height:34px}
.clube{border-radius:12px;transition:background .15s}.clube:active{background:#244637}
.row{gap:8px}
select{border-radius:10px}

/* ===== FUNÇÕES E HABILIDADES NA TÁTICA (v36) ===== */
.pl small.pf{background:#000a;font-size:8.5px;letter-spacing:.2px;margin-top:1px;color:#ffe9a8}
.bj small.pf{font-size:8px;color:#ffe9a8;margin-top:1px}
.hc{font-style:normal;display:inline-block;font-size:10px;font-weight:700;padding:1px 7px;border-radius:99px;margin:2px 3px 0 0}
.hc.ideal{background:#14532d;color:#86efac}.hc.bom{background:#1e3a5f;color:#93c5fd}.hc.fraco{background:#4a2020;color:#fca5a5}

.cal .d .tx.adv{font-weight:800;color:#ffe9a8;font-size:10px}.cal .d .tx.cp{opacity:.8;font-size:9px}
.calL{display:grid;grid-template-columns:104px 1fr;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--bd)}
.calL.hoje{background:linear-gradient(90deg,#f5c54222,transparent);border-radius:8px}
.calD b{display:block;font-size:14px}.calD small{font-size:10.5px;color:var(--mu)}
.calA{display:flex;align-items:center;gap:6px;font-size:13px;flex-wrap:wrap}.rsL{color:var(--ac);font-size:15px}

.nm{font-style:normal;display:inline-block;min-width:20px;text-align:center;font-size:10.5px;font-weight:800;color:#10170f;background:#e8eef0;border-radius:4px;padding:0 3px;margin-right:3px}

.mkL{display:grid;grid-template-columns:38px 1fr auto;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--bd)}
.mkL:first-of-type{border-top:0}.mkL.raro{background:linear-gradient(90deg,#f5c54222,transparent 70%);border-radius:10px;padding-left:4px}
.mkN{min-width:0;display:flex;flex-direction:column;line-height:1.25}.mkN b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mkN small{font-size:10.5px;color:var(--mu)}.mkN small.mkO{color:#9fd0b2}
.mkP{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:2px}.mkP b{font-size:15px;color:var(--ac)}.mkP small{font-size:10.5px;color:var(--mu)}
.mkP button{margin-top:2px;min-width:78px}

.ct{font-style:normal;font-size:10px;margin-left:4px;letter-spacing:-2px}.ct.sus{letter-spacing:0;color:#ff8a8a;font-weight:800}.ct.ag{color:#f5c542;letter-spacing:0}
.pl .ctc{position:absolute;left:4px;top:-4px;font-size:11px;background:#000b;border-radius:6px;padding:0 3px;letter-spacing:-1px;z-index:5}
.pl.susp svg{filter:grayscale(1) brightness(.65)}

.outras .dv{background:linear-gradient(90deg,#1d5a38,#14301f);color:#d9ecdf;font-size:11.5px;letter-spacing:.3px;text-transform:uppercase;border-radius:6px;padding:5px 8px;margin:4px 0 2px}

.bsG{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:8px}
.bsC{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--mu)}
.bsC input,.bsC select{padding:9px 10px;font-size:14px;background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;width:100%}

.posseB{display:flex;height:22px;border-radius:99px;overflow:hidden;border:1px solid #ffffff33;margin:4px 0 2px}
.posseB>div{display:flex;align-items:center;justify-content:center;min-width:34px;transition:width .3s}
.posseB b{font-size:11.5px;color:#fff;text-shadow:0 1px 2px #000}
.pbA b{text-align:left}.posseT{text-align:center;font-size:11px;color:var(--mu);margin:3px 0 8px}.posseT b{color:var(--ac)}

.pgR{display:flex;gap:5px;justify-content:center;flex-wrap:wrap;margin:10px 0 6px}
.pgR button{min-width:40px;padding:9px 6px;border-radius:10px;background:var(--card2);color:var(--tx);border:1px solid var(--bd);font-weight:700;font-size:14px}
.pgR button.on{background:var(--ac);color:#1a1300;border-color:var(--ac)}
.pgR button:disabled{opacity:.35}
.pgE{align-self:center;color:var(--mu);padding:0 2px}
.pgI{display:flex;gap:8px;align-items:center;justify-content:center;margin:4px 0 14px;font-size:12px;color:var(--mu)}
.pgI input{width:84px;padding:8px;font-size:14px;background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:10px}
.pgI button{padding:8px 14px;border-radius:10px}

.penCard{border:1px solid #ffc83d66;background:linear-gradient(180deg,#1b3a28,#0f2a1b)}
.penTit{font-size:15px;font-weight:900;color:#ffd45e;margin-bottom:4px}
.penL{display:grid;grid-template-columns:38px 1fr 50px;gap:8px;align-items:center;padding:8px 6px;border-radius:10px;border:1px solid transparent;cursor:pointer}
.penL+.penL{margin-top:3px}.penL:active{background:#244637}.penL.on{background:#f5c54222;border-color:var(--ac)}

// Um único ponto de aleatoriedade do jogo. Fora de uma simulação, R() é idêntico a
// Math.random() — o jogador não sente nenhuma diferença. Dentro de comSeed(), R() passa
// a ser um gerador SEMEADO: mesma semente = mesmo resultado, em qualquer máquina.
// É a base do multiplayer (todos os clientes chegam ao mesmo placar) e da verificação
// por hash na Fase 7. Nada aqui altera o comportamento single-player existente.
let RNG_CTX=null;                     // gerador ativo (null = aleatório real do navegador)

let RNG_USOS=0;                       // quantas chamadas R() ocorreram no contexto
function R(){RNG_USOS++;return RNG_CTX?RNG_CTX():Math.random()}
function comSeed(seedTxt,fn){         // executa fn com RNG semeado e restaura o estado anterior
  const ctxA=RNG_CTX,nomeA=RNG_NOME,usosA=RNG_USOS;
  const seed=(typeof seedTxt==="number")?seedTxt:semente(String(seedTxt==null?"":seedTxt));
  RNG_CTX=rngSeed(seed);RNG_NOME=String(seedTxt);RNG_USOS=0;
  try{return fn()}finally{RNG_CTX=ctxA;RNG_NOME=nomeA;RNG_USOS=usosA}
}
function Rembaralha(arr){             // Fisher-Yates determinístico (substitui sort(random-.5))
  const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));const t=a[i];a[i]=a[j];a[j]=t}
  return a;
}

function fixtures(nn,real){ // round robin (nn par; índices >= real são folga)
  real=real||nn;
  let t=[...Array(nn).keys()],R=[];
  for(let r=0;r<nn-1;r++){let m=[];for(let i=0;i<nn/2;i++){const a=t[i],b=t[nn-1-i];if(a<real&&b<real)m.push([a,b])}R.push(m);t.splice(1,0,t.pop())}
  return R.concat(R.map(r=>r.map(([a,b])=>[b,a])));
}
function auto(c,manterPos){ // escala automaticamente por slot da formação

  const antes={};c.elenco.forEach(j=>{if(j.tit&&j.px!=null)antes[j.id]=[j.px,j.py,j._g]});
  const form=c.form||"4-4-2";
  const slots=FORMSLOT[form]||FORMSLOT["4-4-2"];
  c.elenco.forEach(j=>{j.tit=false;j.px=null;j.py=null;j._g=null;j._slot=null});
  const nExp=c.elenco.filter(j=>j.expulso).length;
  const livres=()=>c.elenco.filter(j=>!j.tit&&j.lesao<=0&&!j.expulso&&!(j.suspenso>0));

  const ordem=slots.map((sl,i)=>i).sort((i,k)=>(slots[i][0]==="GOL"?-1:0)-(slots[k][0]==="GOL"?-1:0));
  ordem.forEach(i=>{

    const cand=livres().filter(j=>role==="GOL"?j.pos==="GOL":j.pos!=="GOL")
      .map(j=>({j,sc:af(j.pos,role)*100+fe(j)}))
      .filter(o=>role==="GOL"?true:af(o.j.pos,role)>0||true)
      .sort((p,q)=>q.sc-p.sc);
    if(c.elenco.filter(x=>x.tit).length>=11-nExp)return;      // expulsos não são repostos
    const m=cand[0];if(!m)return;

  });

function crestSVG(c,sz){ // escudo procedural (fallback quando não há imagem real)

function escudo(c,sz){sz=sz||18;

function arenaDe(c){ // nome e capacidade reais quando houver
  const r=ESTREAL[c.nome]||EST_EXTRA[c.nome];

  const n=c.nome.replace(/^(Club|FC|SC|AC|CD|CA)\s+/,"");

}

function capEst(c){const e=est(c);return Math.round(e.base*(1+e.nivel*0.18))}
function pubJogo(c,adversario){ // público de um jogo em casa
  const e=est(c),cap=capEst(c);
  const t=tabela(),pos=t.findIndex(x=>x.id===c.id)+1;
  const torc=(c.id===S.meu?(S.tor==null?70:S.tor):60)/100;
  const ff=fatorFamaPublico(c.nome);
  const n=S.clubes.length||20;
  const momento=pos<=3?.14:pos<=6?.08:pos<=n*.5?0:pos<=n*.75?-.08:-.16;      // time bem enche, time mal esvazia
  const base=(0.40+0.45*torc+momento)*ff;
  const grande=(adversario&&(nivelFama(adversario.nome)>=1||adversario.forca>72))?.06:0;
  const demanda=cap*Math.max(.12,base+grande)*(1+e.conforto*.04)*(1-(e.preco-40)/220);
  return Math.max(500,Math.min(cap,Math.round(demanda*rnd(92,108)/100)));
}

function taxa(){const d=S.dir==null?70:S.dir;return d>=60?.012:d>=35?.02:.035}
function pedeEmp(v){
  const eu=S.clubes[S.meu];if(!S.emp)S.emp=[];
  const div=S.emp.reduce((q,x)=>q+x.resta,0),lim=Math.max(5000000,Math.round(eu.forca*300000))-div;

function quitaEmp(i){const eu=S.clubes[S.meu],x=S.emp[i];

function cobraParcelas(){ // chamado a cada rodada
  if(!S.emp||!S.emp.length)return 0;const eu=S.clubes[S.meu];let tot=0;

  S.emp=S.emp.filter(x=>x.parc>0);
  if(eu.caixa<0&&S.dir!=null)S.dir=Math.max(5,S.dir-4);

}

function propoeClube(id){
  const c=S.clubes[id],eu=S.clubes[S.meu];
  const rep=reputacao();
  const dif=c.forca-eu.forca;
  const chance=Math.max(.03,Math.min(.9,.5+(rep-c.forca)/60-(dif>0?dif/40:0)));
  confirma(`Pedir para treinar ${c.nome}?\nChance estimada: ${Math.round(chance*100)}%\nVocê deixa o ${eu.nome}.`,()=>{
    if(R()>chance)return aviso(`${c.nome} recusou sua proposta.`);
    const velho=eu,hab=eu.tec.hab,tit=eu.tec.tit;const tecDoAlvo=c.tec?c.tec.nome:"—";velho.tec=geraTec(velho.forca);
    try{regTec("fim",S.treinador,velho.tec.nome,velho.nome,S.pais,"Você pediu para sair");regTec("fim",tecDoAlvo,S.treinador,c.nome,S.pais,"Você assumiu o clube")}catch(e){}
    S.meu=id;S.dir=70;S.tor=70;S.cap=null;S.selId=null;S.emp=[];S.homeAba="jogar";
    S.clubes[id].tec={id:"eu",nome:S.treinador,hab:hab,tit:tit,sal:0,idade:40,meu:true};
    garanteTec();save();aviso(`Você agora é o técnico do ${c.nome}!`,render);
  });
}

// ===== POSIÇÃO LIVRE NO CAMPO (restaurado) =====
function zonaY(y){return y>=84?"GOL":y>=60?"DEF":y>=32?"MEI":"ATA"}
function posPadrao(c){ // garante coordenadas para todos os titulares
  const tit=c.elenco.filter(j=>j.tit);
  if(tit.some(j=>j.px==null||j.py==null)){
    const slots=FORMSLOT[c.form||"4-4-2"]||FORMSLOT["4-4-2"];
    const sem=tit.filter(j=>j.px==null||j.py==null);
    const usados=new Set(tit.filter(j=>j.px!=null).map(j=>j._slot));
    sem.forEach(j=>{
      let melhor=-1,bs=-1;
      slots.forEach((sl,i)=>{if(usados.has(i))return;
        if((sl[0]==="GOL")!==(j.pos==="GOL"))return;
        const sc=af(j.pos,sl[0]);if(sc>bs){bs=sc;melhor=i}});
      if(melhor<0){j.px=50;j.py=50;return}
      usados.add(melhor);const sl=slots[melhor];j.px=sl[1];j.py=sl[2];j._slot=melhor;j._g=ROLE_GRUPO[sl[0]];
    });
  }
}
function resetPos(c){ // volta às posições da formação mantendo os titulares atuais
  const tit=c.elenco.filter(j=>j.tit);
  const slots=FORMSLOT[c.form||"4-4-2"]||FORMSLOT["4-4-2"];
  c.elenco.forEach(j=>{j.px=null;j.py=null;j._slot=null});
  const usados=new Set();
  // encaixe guloso: pares (jogador,slot) por maior afinidade
  const pares=[];
  tit.forEach(j=>slots.forEach((sl,i)=>{if((sl[0]==="GOL")===(j.pos==="GOL"))pares.push({j,i,sc:af(j.pos,sl[0])})}));
  pares.sort((a,b)=>b.sc-a.sc);
  const fei=new Set();
  pares.forEach(p=>{if(usados.has(p.i)||fei.has(p.j.id))return;usados.add(p.i);fei.add(p.j.id);
    const sl=slots[p.i];p.j.px=sl[1];p.j.py=sl[2];p.j._slot=p.i;p.j._g=ROLE_GRUPO[sl[0]]});
  posPadrao(c);
}
function efPos(j){ // rendimento conforme o encaixe no slot/zona
  if(j._slot!=null&&j._role){return Math.max(.8,0.8+0.2*(af(j.pos,j._role)/10))}
  if(j.py==null)return 1;
  const z=zonaY(j.py),nat=grupoPos(j);
  if(z===nat)return 1;
  if(nat==="GOL"||z==="GOL")return .6;
  const ordem={GOL:0,DEF:1,MEI:2,ATA:3};
  return Math.abs(ordem[z]-ordem[nat])===1?.94:.85;
}
function moverPara(id,x,y,live){
  const eu=S.clubes[S.meu],j=eu.elenco.find(a=>a.id===id);if(!j||!j.tit)return;
  const nx=Math.max(8,Math.min(92,x)),ny=Math.max(6,Math.min(95,y));
  // goleiro só no gol; ninguém mais no gol
  if(j.pos==="GOL"&&zonaY(ny)!=="GOL"){return aviso("O goleiro deve ficar no gol.")}
  if(j.pos!=="GOL"&&zonaY(ny)==="GOL"){return aviso("Só o goleiro pode jogar no gol.")}
  j.px=nx;j.py=ny;j._g=grupoPos(j);j._slot=null;j._role=null;
  S.selId=null;save();live?renderLive():render();
}
function subDireta(saiId,entraId){
  if(S.subs>=5)return aviso("Limite de 5 substituições.");
  const eu=S.clubes[S.meu];
  const a=eu.elenco.find(x=>x.id===saiId),b=eu.elenco.find(x=>x.id===entraId);
  if(!a||!b)return renderLive();
  if(!aptoParaJogar(b))return aviso(b.nome+" não pode jogar: "+motivoInapto(b)+".");
  b.px=a.px;b.py=a.py;b._g=grupoPos(b);b._slot=a._slot;b._role=a._role;a.tit=false;b.tit=true;S.subs++;
  if(S.cap===a.id)S.cap=b.id;
  const jg=S.live.jogos.find(x=>x.a===S.meu||x.b===S.meu);
  jg.ev.push({m:S.live.min,t:"s",lado:jg.a===S.meu?"a":"b",n:b.nome+" ↔ "+a.nome});
  jg.subs.push({m:S.live.min,lado:jg.a===S.meu?"a":"b",entra:b.id,sai:a.id,en:b.nome,sn:a.nome,ep:b.pos});
  renderLive();
}

// ===== SOM REALISTA (Web Audio, 100% gerado por código) =====
let AC=null,somOn=true,MASTER=null;
function audio(){
  try{
    if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();
      MASTER=AC.createGain();MASTER.gain.value=.9;
      const comp=AC.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=6;comp.attack.value=.01;comp.release.value=.25;
      MASTER.connect(comp);comp.connect(AC.destination)}
    if(AC.state==="suspended")AC.resume();return AC}catch(e){return null}
}
let _ruidoBuf=null;
function bufRuido(a){ // ruído "rosa" (mais grave que o branco): soa mais natural, como multidão
  if(_ruidoBuf)return _ruidoBuf;
  const n=a.sampleRate*4,buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);
  let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
  for(let i=0;i<n;i++){const w=Math.random()*2-1;
    b0=.99886*b0+w*.0555179;b1=.99332*b1+w*.0750759;b2=.969*b2+w*.153852;b3=.8665*b3+w*.3104856;b4=.55*b4+w*.5329522;b5=-.7616*b5-w*.016898;
    d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11;b6=w*.115926}
  _ruidoBuf=buf;return buf;
}
// Camada de multidão: ruído rosa filtrado em bandas de voz, com "ondas" de volume (a torcida sobe e desce)
function multidao(dur,pico,atq,t0){
  const a=audio();if(!a||!somOn)return;
  const vf=velSom();dur=Math.max(.35,dur*vf);atq=Math.max(.02,(atq||0)*vf);t0=(t0||0)*vf;if(vf<1)pico*=(vf<.6?.6:.8);
  const t=a.currentTime+t0;
  [[420,.9,.55],[900,1.2,1],[1700,1.5,.7],[3200,1.2,.3]].forEach(([fq,q,vol],k)=>{
    const src=a.createBufferSource();src.buffer=bufRuido(a);src.loop=true;
    src.playbackRate.value=.85+k*.07;
    const f=a.createBiquadFilter();f.type="bandpass";f.frequency.value=fq;f.Q.value=q;
    const g=a.createGain();
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(pico*vol,t+atq);
    // ondas lentas de intensidade (gritos que sobem e descem)
    const lfo=a.createOscillator(),lg=a.createGain();lfo.frequency.value=(.7+k*.35)/vf;lg.gain.value=pico*vol*.35;
    lfo.connect(lg);lg.connect(g.gain);lfo.start(t);lfo.stop(t+dur);
    g.gain.setTargetAtTime(.0001,t+dur*.55,dur*.22);
    src.connect(f);f.connect(g);g.connect(MASTER);src.start(t,Math.random()*2);src.stop(t+dur);
  });
}
// Voz de torcida: coro de "vogais" (formantes de /a/ e /o/) com vibrato e leve desafinação entre vozes
function coro(freqBase,dur,vol,t0,subida){
  const a=audio();if(!a||!somOn)return;
  const vf=velSom();dur=Math.max(.4,dur*vf);t0=(t0||0)*vf;if(vf<.6)vol*=.7;
  const t=a.currentTime+t0;
  for(let v=0;v<7;v++){
    const o=a.createOscillator();o.type="sawtooth";
    const fr=freqBase*(1+(Math.random()-.5)*.04)*(v%3===0?.5:v%3===1?1:1.5);
    o.frequency.setValueAtTime(fr*.88,t);
    o.frequency.linearRampToValueAtTime(fr*(subida||1.15),t+dur*.28);
    o.frequency.setTargetAtTime(fr*(subida||1.15)*.98,t+dur*.6,dur*.2);
    const vib=a.createOscillator(),vg=a.createGain();vib.frequency.value=(5+Math.random()*1.5)/vf;vg.gain.value=fr*.012;
    vib.connect(vg);vg.connect(o.frequency);vib.start(t);vib.stop(t+dur);
    // formantes de vogal "ó/ô" (≈ 500 e 900 Hz) e "a" (≈ 800 e 1200 Hz)
    const ganho=a.createGain();ganho.gain.setValueAtTime(.0001,t);ganho.gain.exponentialRampToValueAtTime(vol/7,t+dur*.18);
    ganho.gain.setTargetAtTime(.0001,t+dur*.6,dur*.2);
    [[500,6],[900,5]].forEach(([ff,q])=>{
      const bf=a.createBiquadFilter();bf.type="bandpass";bf.frequency.value=ff;bf.Q.value=q;
      o.connect(bf);bf.connect(ganho)});
    ganho.connect(MASTER);o.start(t);o.stop(t+dur);
  }
}
function palma(t0){ // palmas / explosão de torcida: estalos curtos de ruído
  const a=audio();if(!a||!somOn)return;
  const t=a.currentTime+(t0||0)*velSom();
  const src=a.createBufferSource();src.buffer=bufRuido(a);
  const f=a.createBiquadFilter();f.type="highpass";f.frequency.value=1800;
  const g=a.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.5,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+.09);
  src.connect(f);f.connect(g);g.connect(MASTER);src.start(t,Math.random()*2);src.stop(t+.12);
}
function somGol(){
  const a=audio();if(!a||!somOn)return;
  const temAudio=!!_audBuf.gol;
  if(temAudio){                                                     // SEU áudio manda; torcida baixa por baixo, sem coro de "gol" sintético
    tocaAudio('gol',1);
    multidao(3.5,.16,.15,.05);
    for(let i=0;i<8;i++)palma(.05+i*.09+Math.random()*.03);
    return;
  }
  // sem áudio pronto: o gol sintético completo
  multidao(5.5,.5,.12,0);
  coro(196,3.4,.55,.04,1.28);
  coro(294,3.0,.35,.12,1.18);
  for(let i=0;i<14;i++)palma(.02+i*.075+Math.random()*.03);
  [0,.42].forEach(dt=>{
    const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+dt*velSom();
    o.type="sine";o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(48,t+.22);
    g.gain.setValueAtTime(.7,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);
    o.connect(g);g.connect(MASTER);o.start(t);o.stop(t+.32);
  });
}

const AUDIO_NOMES={gol:"Gol",pen:"Pênalti",verm:"Expulsão",inter:"Intervalo",fim:"Fim de jogo"};
let _audEl={},_audBuf={},_audAtivo=null,_audLiberado=false,_audPreparando=false;
function audioArquivo(k){return _audBuf[k]||null}
// toca o áudio k. Retorna true se conseguiu tocar (assim quem chamou sabe que NÃO precisa do som sintético).
function velSom(){                                          // v54: o som acompanha a velocidade do jogo
  try{const v=S&&S.live?S.live.vel:(S&&S.velPref)||1;return v===3?.5:v===2?.72:1}catch(e){return 1}
}
function tocaAudio(k,vol){
  try{
    if(!somOn)return false;
    const a=audio();if(!a)return false;
    const buf=_audBuf[k];
    if(!buf){preparaAudios();return false}                       // ainda decodificando: o som sintético cobre esta vez
    if(_audAtivo){try{_audAtivo.stop()}catch(e){}_audAtivo=null}
    const src=a.createBufferSource();src.buffer=buf;
    const vf=velSom();src.playbackRate.value=Math.min(1.6,1/vf);  // 2x → 1,39× mais rápido · 3x → 1,6× (a voz acompanha o jogo)
    const g=a.createGain();g.gain.value=Math.max(0,Math.min(1,vol==null?1:vol))*1.6;     // áudios gravados vêm baixos: ganho extra, protegido pelo compressor
    src.connect(g);g.connect(MASTER);src.start();
    _audAtivo=src;src.onended=()=>{if(_audAtivo===src)_audAtivo=null};
    return true;
  }catch(e){return false}
}
// "libera" o áudio no primeiro toque do usuário (navegadores só deixam tocar depois de um toque)
function liberaAudios(){
  if(_audLiberado)return;_audLiberado=true;
  try{audio()}catch(e){}                                           // o toque do usuário libera o AudioContext
  preparaAudios();
}
// decodifica os MP3 embutidos (base64 → bytes → buffer do AudioContext). Roda uma vez, em segundo plano.
function preparaAudios(){
  if(_audPreparando)return;_audPreparando=true;
  const a=audio();if(!a){_audPreparando=false;return}
  Object.keys(AUDIOS_B64).forEach(k=>{
    if(_audBuf[k])return;
    try{
      const bin=atob(AUDIOS_B64[k]),n=bin.length,u8=new Uint8Array(n);
      for(let i=0;i<n;i++)u8[i]=bin.charCodeAt(i);
      const ab=u8.buffer;
      const ok=b=>{_audBuf[k]=b};
      const pr=a.decodeAudioData(ab,ok,()=>{});
      if(pr&&pr.then)pr.then(ok).catch(()=>{});
    }catch(e){}
  });
}
try{document.addEventListener("pointerdown",liberaAudios,{once:true});document.addEventListener("touchstart",liberaAudios,{once:true})}catch(e){}

try{if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=()=>{_narrVoz=null}}}catch(e){}
function escolheVozPt(){
  try{
    if(!("speechSynthesis" in window))return null;
    const vs=speechSynthesis.getVoices()||[];
    // prefere pt-BR (voz de rede/natural quando existir), depois qualquer pt
    return vs.find(v=>/pt[-_]BR/i.test(v.lang)&&/natural|online|neural|google/i.test(v.name))||vs.find(v=>/pt[-_]BR/i.test(v.lang))||vs.find(v=>/^pt/i.test(v.lang))||null;

function falaNarracao(texto,opc){

// monta e fala a narração do gol. meu=true quando o gol é do SEU time (mais emoção); contra=true quando você sofreu.
function narraGol(info){
  try{
    if(!somOn||(S.live&&S.live.pulando))return;
    if(info&&info.contra&&_audBuf.goladv)return;                                   // v53: gol sofrido com o seu áudio pronto: sem voz sintética por cima
    if(info&&info.meu&&_audBuf.gol)return;                                          // gol do SEU time com áudio pronto: somGol() já tocou; sem voz sintética por cima
    const agora=Date.now();if(agora-_narrUltimo<3500*velSom())return;_narrUltimo=agora;
    const est=NARR_ESTILOS[Math.floor(Math.random()*NARR_ESTILOS.length)];
    const pick=a=>a[Math.floor(Math.random()*a.length)];
    const sub=(t)=>t.replace(/\{n\}/g,info.autor).replace(/\{t\}/g,info.time);
    // situação do placar depois do gol (a=quem marcou, b=adversário)
    const d=info.golsA-info.golsB;
    let sit=null;
    if(info.golsA===1&&info.golsB===0)sit="abre";                 // 0x0 → 1x0
    else if(info.golsA===info.golsB)sit="empata";                 // estava atrás por 1 e igualou
    else if(d>=2)sit="amplia";                                    // já vencia e abre mais
    else if(d===1)sit="vantagem";                                 // estava igual e foi à frente (1x1 → 2x1)
    else if(d<0)sit="diminui";                                    // ainda perde, mas descontou
    let partes=[];
    // 1) o grito de gol (curto na torcida adversária, longo na sua)
    if(info.meu){partes.push(pick(est.gol),sub(pick(est.quem)))}
    else if(info.contra){partes.push(sub(pick(["Gol do {t}.","{n} marca para o {t}.","Sofremos o gol. {n}."])))}
    else{partes.push(pick(est.gol))}
    // 2) a situação do jogo
    if(sit&&Math.random()<.85)partes.push(sub(pick(NARR_SITUACAO[sit])));
    else if(Math.random()<.5)partes.push(pick(est.extra));
    // 3) o momento do jogo
    if(info.min>=85&&Math.random()<.8)partes.push(pick(NARR_SITUACAO.fim));
    else if(info.min<=8&&Math.random()<.7)partes.push(pick(NARR_SITUACAO.inicio));
    falaNarracao(partes.join(" "),{rate:info.meu?1.18:1.02,pitch:info.meu?1.12:.92});
  }catch(e){}
}

// Apito de árbitro real: dois tons ligeiramente diferentes batendo (efeito do bolinha) + trilo rápido
function apitoReal(dur,t0,vol){
  const a=audio();if(!a||!somOn)return;
  const vf=velSom();dur=Math.max(.18,dur*(vf<1?Math.max(vf,.55):1));t0=(t0||0)*vf;
  const t=a.currentTime+t0;vol=vol||.35;
  const sai=a.createGain();                                   // envelope geral: ataque rápido, sustentação com leve queda, soltura curta
  sai.gain.setValueAtTime(.0001,t);
  sai.gain.exponentialRampToValueAtTime(vol,t+.012);
  sai.gain.linearRampToValueAtTime(vol*.82,t+dur*.8);          // o fôlego do árbitro vai acabando
  sai.gain.exponentialRampToValueAtTime(.0001,t+dur+.06);
  // ressonância da câmara do apito (dois picos de frequência)
  const f1=a.createBiquadFilter();f1.type="bandpass";f1.frequency.value=3250;f1.Q.value=9;
  const f2=a.createBiquadFilter();f2.type="bandpass";f2.frequency.value=4300;f2.Q.value=6;
  const mix=a.createGain();mix.gain.value=1;
  // tom principal: dois osciladores levemente desafinados (batimento) + "trilo" da bolinha de cortiça (~38 Hz) modulando a frequência
  [[3180,1],[3236,.9]].forEach(([fq,amp],k)=>{
    const o=a.createOscillator();o.type="sawtooth";
    // leve subida de tom no ataque (o sopro "pega" a nota)
    o.frequency.setValueAtTime(fq*.965,t);o.frequency.exponentialRampToValueAtTime(fq,t+.05);
    const trilo=a.createOscillator(),tg=a.createGain();
    trilo.type="sine";trilo.frequency.value=37+k*4;tg.gain.value=fq*.02;       // profundidade do trilo
    trilo.connect(tg);tg.connect(o.frequency);trilo.start(t);trilo.stop(t+dur+.1);
    // o trilo também modula a amplitude (a bolinha corta o fluxo de ar)
    const am=a.createOscillator(),ag=a.createGain(),base=a.createGain();
    am.frequency.value=37+k*4;ag.gain.value=.28;base.gain.value=.72;
    const nivel=a.createGain();nivel.gain.value=0;ag.connect(nivel.gain);base.connect(nivel.gain);
    am.connect(ag);am.start(t);am.stop(t+dur+.1);
    const og=a.createGain();og.gain.value=.5*amp;o.connect(nivel);nivel.connect(og);og.connect(f1);og.connect(f2);
    o.start(t);o.stop(t+dur+.1);
  });
  f1.connect(mix);f2.connect(mix);
  // sopro: ruído filtrado em agudo, mais forte no ataque (o "psss" antes da nota) e fraco durante
  const src=a.createBufferSource();src.buffer=bufRuido(a);
  const sf=a.createBiquadFilter();sf.type="highpass";sf.frequency.value=2800;
  const sg=a.createGain();sg.gain.setValueAtTime(.0001,t);sg.gain.exponentialRampToValueAtTime(.38,t+.015);sg.gain.exponentialRampToValueAtTime(.07,t+.09);sg.gain.setValueAtTime(.07,t+dur*.8);sg.gain.exponentialRampToValueAtTime(.0001,t+dur+.04);
  src.connect(sf);sf.connect(sg);sg.connect(mix);src.start(t,Math.random()*2);src.stop(t+dur+.1);
  mix.connect(sai);sai.connect(MASTER);
}

      DR={id,j,el,titular:!!j.tit,x0:ev.clientX,y0:ev.clientY,moveu:false,live,pitch};
      try{el.setPointerCapture(ev.pointerId)}catch(e){}
    });
    el.addEventListener("pointermove",ev=>{
      if(!DR||DR.el!==el)return;
      const dx=ev.clientX-DR.x0,dy=ev.clientY-DR.y0;
      if(!DR.moveu&&Math.hypot(dx,dy)<6)return;
      if(!DR.moveu){DR.moveu=true;iniciaArraste(ev)}
      moveArraste(ev);
    });
    const fim=ev=>{
      if(!DR||DR.el!==el)return;
      const d=DR;DR=null;
      try{el.releasePointerCapture(ev.pointerId)}catch(e){}
      limpaArraste(d);
      if(d.moveu)soltaArraste(d,ev);else tocaJogador(d);
    };
    el.addEventListener("pointerup",fim);el.addEventListener("pointercancel",e=>{if(DR&&DR.el===el){const d=DR;DR=null;limpaArraste(d)}});
  });
}
function iniciaArraste(ev){

function moveArraste(ev){
  const d=DR;if(!d||!d.clone)return;
  d.clone.style.left=ev.clientX+"px";d.clone.style.top=ev.clientY+"px";
  const r=d.pitch.getBoundingClientRect();
  const x=(ev.clientX-r.left)/r.width*100,y=(ev.clientY-r.top)/r.height*100;
  d.ult={x,y};
  // destaca slot mais próximo
  let melhor=-1,md=1e9;
  d.slots.forEach((sl,i)=>{const dist=Math.hypot(sl.x-x,(sl.y-y)*1.3);if(dist<md){md=dist;melhor=i}});
  d.pitch.querySelectorAll(".ghost").forEach(g=>g.classList.toggle("perto",md<14&&+g.dataset.i===melhor));
  d.snap=md<14?d.slots[melhor]:null;
  // titular alvo sob o dedo (para troca/substituição)
  d.alvoId=null;
  d.pitch.querySelectorAll(".pl").forEach(p=>{
    if(p.dataset.id===d.id)return;
    const b=p.getBoundingClientRect();
    const dentro=ev.clientX>=b.left&&ev.clientX<=b.right&&ev.clientY>=b.top&&ev.clientY<=b.bottom;
    p.classList.toggle("alvo2",dentro||!d.titular&&true);
    if(dentro)d.alvoId=p.dataset.id;
  });
}
function limpaArraste(d){

function soltaArraste(d,ev){
  const eu=S.clubes[S.meu],j=d.j,live=d.live;
  const pr=d.pitch.getBoundingClientRect();
  const dentroCampo=ev.clientX>=pr.left&&ev.clientX<=pr.right&&ev.clientY>=pr.top&&ev.clientY<=pr.bottom;
  const banco=document.getElementById("bancoF");
  let sobreBanco=false;
  if(banco){const b=banco.getBoundingClientRect();sobreBanco=ev.clientX>=b.left&&ev.clientX<=b.right&&ev.clientY>=b.top&&ev.clientY<=b.bottom}
  const re=()=>live?renderLive():render();
  if(d.titular){
    if(sobreBanco||!dentroCampo){ // titular solto no banco => precisa de um reserva (escolhe o melhor da mesma posição)
      return aviso("Arraste um reserva para cima do titular para trocar.");
    }
    if(d.alvoId){ // troca de lugar entre titulares
      const o=eu.elenco.find(x=>x.id===d.alvoId);
      if(!o)return re();
      if((j.pos==="GOL")!==(o.pos==="GOL"))return aviso("Goleiro só troca com goleiro.");
      const px=j.px,py=j.py;j.px=o.px;j.py=o.py;o.px=px;o.py=py;j._g=grupoPos(j);o._g=grupoPos(o);
      save();return re();
    }
    const alvo=d.snap||{x:d.ult.x,y:d.ult.y};
    return moverPara(j.id,alvo.x,alvo.y,live);
  }
  // reserva arrastado
  if(!dentroCampo)return;
  if(d.alvoId){
    const sai=eu.elenco.find(x=>x.id===d.alvoId);
    if(!sai)return re();
    if((j.pos==="GOL")!==(sai.pos==="GOL"))return aviso("Goleiro só entra no lugar de goleiro.");
    if(live)return subDireta(sai.id,j.id);
    j.px=sai.px;j.py=sai.py;j._g=grupoPos(j);j.tit=true;sai.tit=false;
    if(S.cap===sai.id)S.cap=j.id;
    save();return re();
  }
  aviso("Solte o reserva em cima de um titular para trocar.");
}

function tocaJogador(d){
  const eu=S.clubes[S.meu],j=d.j,live=d.live,re=()=>live?renderLive():render();
  // vaga aberta por lesão: tocar em um reserva dá a vaga a ele (não gasta substituição)
  if(live&&!j.tit&&S.live&&S.live.janela==="lesao"){
    const vaga=vagasLesaoAbertas().find(v=>(v.pos==="GOL")===(j.pos==="GOL"))||vagasLesaoAbertas()[0];
    if(vaga){
      if(j.lesao>0||j.expulso||j.suspenso>0){marcaToque();return aviso(j.nome+" não pode jogar.")}
      if((vaga.pos==="GOL")!==(j.pos==="GOL")){marcaToque();return aviso("A vaga é de "+(vaga.pos==="GOL"?"goleiro":"linha")+": escolha um "+(vaga.pos==="GOL"?"goleiro":"jogador de linha")+".")}
      preencheVagaLesao(vaga,j);TOQ=null;return;
    }
  }
  if(!TOQ){TOQ=j.id;marcaToque();return}
  if(TOQ===j.id){TOQ=null;marcaToque();return}
  const a=eu.elenco.find(x=>x.id===TOQ),b=j;
  if(a.tit===b.tit){TOQ=j.id;marcaToque();return}
  const sai=a.tit?a:b,ent=a.tit?b:a;TOQ=null;
  if(!aptoParaJogar(ent)){marcaToque();return aviso(ent.nome+" não pode jogar: "+motivoInapto(ent)+".")}
  if((sai.pos==="GOL")!==(ent.pos==="GOL")){marcaToque();return aviso("Goleiro só troca com goleiro.")}
  if(live)return subDireta(sai.id,ent.id);
  ent.px=sai.px;ent.py=sai.py;ent._g=grupoPos(ent);ent._slot=sai._slot;ent._role=sai._role;ent.tit=true;sai.tit=false;
  if(S.cap===sai.id)S.cap=ent.id;
  save();re();
}

// Seleção automática: só troca jogadores, mantém posições
function autoMantendoPosicoes(){
  const eu=S.clubes[S.meu];
  const titulares=eu.elenco.filter(x=>x.tit);
  let trocas=0;
  titulares.forEach(t=>{
    const pool=eu.elenco.filter(x=>!x.tit&&x.lesao<=0&&x.pos===t.pos);
    // melhor da MESMA posição, por força efetiva (considera energia)
    const fe0=x=>x.f*(0.7+0.3*(x.en==null?100:x.en)/100);
    const atual=t.lesao>0?-1:fe0(t);
    const melhor=pool.sort((a,b)=>fe0(b)-fe0(a))[0];
    if(melhor&&fe0(melhor)>atual+0.001){
      melhor.px=t.px;melhor.py=t.py;melhor._g=grupoPos(melhor);melhor._slot=t._slot;melhor._role=t._role;melhor.tit=true;t.tit=false;
      if(S.cap===t.id)S.cap=melhor.id;trocas++;
    }
  });
  return trocas;
}

function golsPois(l){let L=Math.exp(-l),k=0,p=1;do{k++;p*=R()}while(p>L);return k-1}
function simRapido(fa,fb){
  const ma=Math.max(.25,(fa-fb)/22+1.35),mb=Math.max(.25,(fb-fa)/22+1.0);
  return [golsPois(ma),golsPois(mb)];
}
function resultadosPais(pais){ // resultados das 3 divisões de um país: usa os placares REAIS da última rodada jogada
  const out=[];
  (LIGAS[pais]||[]).forEach((divFixa,dv)=>{
    const div=(pais===S.pais&&S.divAtual)?clubesDaDivisao(pais,dv):divFixa;
    const L=S.ligas&&S.ligas[chaveLiga(pais,dv)];
    let jogos=[];
    if(L&&L.ultimos&&L.ultimos.length){
      jogos=L.ultimos.map(([ia,ib,ga,gb])=>{
        const na=L.nomes[ia],nb=L.nomes[ib];const ca=infoCor(pais,na),cb=infoCor(pais,nb);
        return{a:na,b:nb,ca:ca.cor,cb:cb.cor,c2a:ca.cor2,c2b:cb.cor2,ga,gb};
      });
    }else if(!(L)){                                  // minha divisão, ou antes da 1ª rodada: sorteio de reserva
      const idx=div.map((_,i)=>i).sort(()=>R()-.5),base=[70,60,52][dv]||50;
      for(let i=0;i+1<idx.length;i+=2){
        const a=div[idx[i]],b=div[idx[i+1]];
        const [ga,gb]=simRapido(base+rnd(-10,12),base+rnd(-10,12));
        jogos.push({a:a[0],b:b[0],ca:a[2],cb:b[2],c2a:a[3],c2b:b[3],ga,gb});
      }
    }
    out.push({div:dv,nome:LIGANOME[pais][dv],jogos});
  });
  return out;
}
function guardaResultados(){ // chamado no fim da partida; usa os jogos reais da minha liga
  const L=S.live;
  const minha=[];
  L.jogos.forEach(j=>{const a=S.clubes[j.a],b=S.clubes[j.b];minha.push({a:a.nome,b:b.nome,ca:a.cor,cb:b.cor,c2a:a.cor2,c2b:b.cor2,ga:j.ga,gb:j.gb,meu:(j.a===S.meu||j.b===S.meu)})});
  const outras={};
  Object.keys(LIGAS).forEach(pa=>{
    if(pa===S.pais){ // minha liga: usa os placares reais para a minha divisão e simula as demais
      const r=resultadosPais(pa);
      r[S.div]={div:S.div,nome:LIGANOME[pa][S.div],jogos:minha};
      outras[pa]=r;
    }else outras[pa]=resultadosPais(pa);
  });
  S.resultados={rodada:S.rodada+1,pais:S.pais,dados:outras};
  S.filtroPais=S.pais;
}

const CL_VAGAS={"Inglaterra": 5, "Espanha": 5, "Itália": 5, "Alemanha": 5, "França": 4, "Portugal": 3, "Holanda": 3, "Bélgica": 2, "Turquia": 1, "Escócia": 1, "Rússia": 2};
const CL_PAISES=Object.keys(CL_VAGAS);
function clCriaClube(nome,sig,cor,cor2,forca,pais,real,idLocal){
  return{k:pais+"|"+nome,nome,sig,cor,cor2,pais,forca,real:real,idLocal:idLocal,pts:0,j:0,v:0,e:0,d:0,gp:0,gc:0};
}
// monta os 36 participantes (os do meu país vêm da tabela real da minha liga)
function clParticipantes(){
  const lista=[];
  CL_PAISES.forEach(pa=>{
    const n=CL_VAGAS[pa];
    let ordem;
    if(pa===S.pais){
      const fonte=fontePrimeiraDiv();
      ordem=aplicaVagaCopa(fonte,n,VAGA_COPA[pa]==="cl"?campeaoCopaDe(pa):null);
    }else{
      const classif=classificacaoMundo(pa,0);
      ordem=aplicaVagaCopa(classif,n,VAGA_COPA[pa]==="cl"?campeaoCopaDe(pa):null);
    }
    ordem.forEach((c,i)=>{const fz=forcaPart(c,pa,0);const o=clCriaClube(c.nome,c.sig,c.cor,c.cor2,fz,pa,c.id!==null&&c.id!==undefined,c.id);o.div=0;o.idxMundo=c.idx;if(c.pelaCopa)o.pelaCopa=true;lista.push(o)});
  });
  return lista.slice(0,36);
}
function mdc(a,b){return b?mdc(b,a%b):a}
function clConstroiCalendario(n){ // n=36: 8 rodadas, 8 adversários distintos, 4 em casa e 4 fora por clube
  const perm=[...Array(n).keys()].sort(()=>R()-.5);
  const cand=[];for(let d=1;d<n/2;d++)if((n/mdc(n,d))%2===0)cand.push(d);
  const ds=cand.sort(()=>R()-.5).slice(0,4);
  const rod=[];
  ds.forEach(d=>{
    const g=mdc(n,d),L=n/g,m=[[],[]];
    for(let st=0;st<g;st++){let i=st;for(let k=0;k<L;k++){const b=(i+d)%n;m[k%2].push([perm[i],perm[b]]);i=b}}
    rod.push(m[0]);rod.push(m[1]);
  });
  return rod;
}
function clInicia(){
  const parts=clParticipantes();
  while(parts.length<36){const q=parts.length;parts.push(clCriaClube("Clube "+(q+1),"C"+(q+1),"#445566","#ffffff",66,"Europa",false,null))}
  // ordena por força para o sorteio ficar equilibrado, mas o calendário é aleatório
  S.cl={temp:S.temp,fase:"liga",rodada:0,parts,cal:clConstroiCalendario(parts.length),eliminatoria:null,campeao:null,meu:parts.findIndex(c=>ehMeuClube(c)),hist:[]};
  S.cl.jogouHoje=false;
}
function clSouParticipante(){return S.cl&&S.cl.meu>=0}
// calendário intercalado: a cada 4 rodadas da liga (a partir da 4ª) tem um jogo da Champions
function datasCopa(T,N,iniPct,fimPct){ // N datas estritamente crescentes entre iniPct e fimPct do campeonato (1..T-1)
  const ini=Math.max(1,Math.round(T*iniPct)),fim=Math.max(ini+N-1,Math.min(T-1,Math.round(T*(fimPct||1)))),d=[];
  for(let k=0;k<N;k++){let r=N>1?Math.round(ini+(fim-ini)*k/(N-1)):ini;if(k>0&&r<=d[k-1])r=d[k-1]+1;d.push(r)}
  for(let k=N-1;k>=0;k--){const lim=T-1-(N-1-k);if(d[k]>lim)d[k]=lim}
  for(let k=1;k<N;k++)if(d[k]<=d[k-1])d[k]=d[k-1]+1;
  return d;
}
function clDatas(){ // 8 da fase de liga + repescagem, oitavas, quartas, semi, final = 13 datas
  const d=datasCopa(S.fixt.length,13,.08,.98);
  return{liga:d.slice(0,8),ko:{repescagem:d[8],oitavas:d[9],quartas:d[10],semi:d[11],final:d[12]}};
}

function clMeusJogos(){ // jogos do meu clube nesta data

// simulação rápida de um confronto
function clSimula(ia,ib){
  const A=S.cl.parts[ia],B=S.cl.parts[ib];

}
function clAplica(ia,ib,ga,gb){
  const A=S.cl.parts[ia],B=S.cl.parts[ib];
  A.j++;B.j++;A.gp+=ga;A.gc+=gb;B.gp+=gb;B.gc+=ga;
  if(ga>gb){A.v++;B.d++;A.pts+=3}else if(ga<gb){B.v++;A.d++;B.pts+=3}else{A.e++;B.e++;A.pts++;B.pts++}
}
function clTabela(){
  return S.cl.parts.map((c,i)=>({...c,i})).sort((a,b)=>b.pts-a.pts||(b.gp-b.gc)-(a.gp-a.gc)||b.gp-a.gp);

function clJogaRodadaLiga(meuRes){ // meuRes: placar do meu jogo (ou null)
  const c=S.cl,jogos=c.cal[c.rodada]||[];
  const resultados=[];
  jogos.forEach(([a,b])=>{

      ga=a===c.meu?meuRes.g1:meuRes.g2;gb=a===c.meu?meuRes.g2:meuRes.g1;
    }else{const pre=(S._clPre||[]).find(x=>x[0]===a&&x[1]===b);if(pre){ga=pre[2];gb=pre[3]}else{const r=clSimula(a,b);ga=r.ga;gb=r.gb}}

function clFimLiga(){

function clJogaMataMata(meuRes){
  const c=S.cl,e=c.eliminatoria;if(!e)return[];
  const res=[],venc=[];
  e.jogos.forEach(([a,b])=>{
    let ga,gb;
    if(meuRes&&((a===c.meu&&b===meuRes.adv)||(b===c.meu&&a===meuRes.adv))){ga=a===c.meu?meuRes.g1:meuRes.g2;gb=a===c.meu?meuRes.g2:meuRes.g1}
    else{const pre=(S._clPre||[]).find(x=>x[0]===a&&x[1]===b);if(pre){ga=pre[2];gb=pre[3]}else{const r=clSimula(a,b);ga=r.ga;gb=r.gb}}
    let w=ga>gb?a:gb>ga?b:null,pen="";
    if(w===null){ // prorrogação/pênaltis
      const pa=S.cl.parts[a].forca/(S.cl.parts[a].forca+S.cl.parts[b].forca);
      w=R()<pa?a:b;pen=" (pên.)";
    }
    venc.push(w);res.push({a,b,ga,gb,w,pen,meu:(a===c.meu||b===c.meu)});
  });
  e.resultados=res;e.pendente=false;c.ultimosRes=res;

// planeja a próxima fase com base em quem ainda está vivo
function cnPlanejaProximaFase(){
  const c=S.cn,n=c.vivos.length;
  if(n===1){c.campeao=c.vivos[0];c.nomeFase="fim";c.eliminatoria=null;
    const cam=c.parts[c.campeao];S.cnHist=(S.cnHist||[]);S.cnHist.push({temp:S.temp,campeao:cam.nome,pais:S.pais});S.cnCampeaoUltimo={nome:cam.nome,sig:cam.sig,cor:cam.cor,cor2:cam.cor2,forca:cam.forca,div:cam.div,id:(cam.real&&cam.div===0&&S.div===0)?cam.idLocal:null,real:!!cam.real,pais:S.pais,temp:S.temp};return}
  const alvo=(()=>{let a=1;while(a*2<=n)a*=2;return a})();
  let pares=[],folga=[],nome="";
  if(n===alvo){ // fase já é potência de 2: todos jogam
    // sorteio: cruza fortes com fracos
    const ord=[...c.vivos].sort(()=>R()-.5);
    for(let k=0;k<ord.length;k+=2)pares.push([ord[k],ord[k+1]]);
    nome=({32:"32 avos de final",16:"Oitavas de final",8:"Quartas de final",4:"Semifinal",2:"Final"})[n]||(n+" clubes");
  }else{
    // preliminar: reduz até 'alvo'. Quem joga: os mais fracos entre as divisões 2 e 3
    const precisa=n-alvo;
    const el=c.vivos.filter(i=>c.parts[i].div>0).sort((a,b)=>(c.parts[b].div-c.parts[a].div)||(c.parts[a].forca-c.parts[b].forca));
    const jogos=Math.min(precisa,Math.floor(el.length/2));
    const sel=el.slice(0,jogos*2).sort(()=>R()-.5);
    for(let k=0;k<jogos;k++)pares.push([sel[2*k],sel[2*k+1]]);
    const jogam=new Set(sel);folga=c.vivos.filter(i=>!jogam.has(i));
    nome=((c.prelimJogadas||0)===0)?"1ª fase":"2ª fase";
  }
  c.eliminatoria={pares,folga,pendente:true};c.nomeFase=nome;
}

function cnJogaData(meuRes){
  const c=S.cn,e=c.eliminatoria,res=[],venc=[];
  e.pares.forEach(([a,b])=>{
    let ga,gb;
    if(meuRes&&((a===c.meu&&b===meuRes.adv)||(b===c.meu&&a===meuRes.adv))){ga=a===c.meu?meuRes.g1:meuRes.g2;gb=a===c.meu?meuRes.g2:meuRes.g1}
    else{const pr=(S._cnPre||[]).find(x=>x[0]===a&&x[1]===b);const r=pr?{ga:pr[2],gb:pr[3]}:cnSimula(a,b);ga=r.ga;gb=r.gb}
    let w=ga>gb?a:gb>ga?b:null,pen="";
    if(w===null){const fa=c.parts[a].forca,fb=c.parts[b].forca;w=R()<fa/(fa+fb)?a:b;pen=" (pên.)"}
    venc.push(w);res.push({a,b,ga,gb,w,pen,meu:(a===c.meu||b===c.meu)});
  });
  S._cnPre=null;c.ultimosRes=res;c.ultimaFase=c.nomeFase;
  // próximos vivos = folga + vencedores
  c.vivos=[...e.folga,...venc];
  const eraPrelim=(()=>{let a=1;while(a*2<=c.vivos.length+e.pares.length)a*=2;return(c.vivos.length+e.pares.length)!==a})();
  if(eraPrelim)c.prelimJogadas=(c.prelimJogadas||0)+1;
  c.fase++;c.preliminares=true;
  cnPlanejaProximaFase();
  return res;
}

const VAGA_COPA={Brasil:"lb",Argentina:"lb",Colômbia:"lb",Chile:"lb",Uruguai:"lb",
  Inglaterra:"cl",Espanha:"cl",Itália:"cl",Alemanha:"cl",França:"cl",Portugal:"cl",Holanda:"cl",Bélgica:"cl",Turquia:"cl",Escócia:"cl",Rússia:"cl"};
// O campeão da Copa do país ganha vaga no torneio continental. Se já estava entre os classificados pela liga, nada muda;
// se estava fora, ocupa a última vaga da liga (o total de vagas continua o mesmo).
function aplicaVagaCopa(ordem,n,campeao){
  const topo=ordem.slice(0,n);
  if(!campeao)return topo;
  if(topo.some(c=>c.nome===campeao.nome))return topo;
  return[...topo.slice(0,Math.max(0,n-1)),{nome:campeao.nome,sig:campeao.sig,cor:campeao.cor,cor2:campeao.cor2,forca:campeao.forca,id:campeao.id,pelaCopa:true}];
}
// campeão da Copa de um país (apenas o do meu país é conhecido; para os outros países, sorteia um clube da 1ª divisão)
function campeaoCopaDe(pais){
  if(pais===S.pais&&S.cnCampeaoUltimo&&S.cnCampeaoUltimo.pais===pais&&S.cnCampeaoUltimo.temp===S.temp-1){
    const c=S.cnCampeaoUltimo;return{nome:c.nome,sig:c.sig,cor:c.cor,cor2:c.cor2,forca:c.forca,id:c.id};
  }
  if(pais===S.pais)return null;                                    // primeira temporada: ainda não houve Copa
  const rec=S.campeoesCopa&&S.campeoesCopa[pais];                  // {temp,nome} guardado ao fim da temporada
  if(!rec||rec.temp!==S.temp-1)return null;
  const ch=chaveFixa(pais,rec.nome);if(!ch)return null;
  const info=LIGAS[pais][ch.div][ch.idx];
  return{nome:rec.nome,sig:info[1],cor:info[2],cor2:info[3],forca:Math.round(forcaParaLiga(pais,ch.div,rec.nome)),id:null,idx:ch.idx,div:ch.div};
}

// Vagas = posições seguintes às da Champions/Libertadores (n_cont+1 .. n_cont+n)
function vagasSeguintes(ordem,nCont,n,excluir){const ex=new Set((excluir||[]).map(c=>c.nome));return ordem.filter((c,i)=>i>=nCont&&!ex.has(c.nome)).slice(0,n)}

      const fonte=fontePrimeiraDiv();
      const naCL=aplicaVagaCopa(fonte,nc,VAGA_COPA[pa]==="cl"?campeaoCopaDe(pa):null);
      ordem=vagasSeguintes(fonte,nc,n,naCL);

      const base=classificacaoMundo(pa,0);
      const naCL=aplicaVagaCopa(base,nc,VAGA_COPA[pa]==="cl"?campeaoCopaDe(pa):null);
      ordem=vagasSeguintes(base,nc,n,naCL);
    }
    ordem.forEach((c,i)=>{const o=clCriaClube(c.nome,c.sig,c.cor,c.cor2,forcaPart(c,pa,0),pa,c.id!==null&&c.id!==undefined,c.id);o.div=0;o.idxMundo=c.idx;lista.push(o)});

function saParticipantes(){
  const L=[];

    const n=SA_VAGAS[pa],nc=LB_VAGAS[pa]||0;let ordem;

      ordem=vagasSeguintes(base,nc,n,naLB);

    ordem.forEach((c,i)=>{const o=clCriaClube(c.nome,c.sig,c.cor,c.cor2,forcaPart(c,pa,0),pa,c.id!==null&&c.id!==undefined,c.id);o.div=0;o.idxMundo=c.idx;L.push(o)});
