// ===== AGENDA DA TEMPORADA (uma competição por data) =====
const MESES=["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const DIAS_SEM=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const COMP_INFO={liga:{n:"Campeonato",ic:"⚽"},cn:{n:"Copa nacional",ic:"🏆"},cl:{n:"Champions League",ic:"⭐"},el:{n:"Liga Europa",ic:"🟧"},lb:{n:"Libertadores",ic:"🌎"},sa:{n:"Sul-Americana",ic:"🟩"},mund:{n:"Mundial de Clubes",ic:"🌍"}};
// Quais competições o meu país/divisão disputa nesta temporada
function agendaCompetidores(){
  const k=[];
  if(S.cn)k.push("cn");
  if(S.cl&&S.cl.meu>=0)k.push("cl");
  if(S.el&&S.el.meu>=0)k.push("el");
  if(S.lb&&S.lb.meu>=0)k.push("lb");
  if(S.sa&&S.sa.meu>=0)k.push("sa");
  return k;
}
// Nº de datas que cada competição precisa (para o MEU clube; as demais são simuladas em segundo plano nas mesmas datas)
function agendaCopasTodas(){
  // todas as competições existentes entram na linha do tempo (as em que não jogo são simuladas na hora)
  const k=[];
  if(S.cn)k.push("cn");if(S.cl)k.push("cl");if(S.el)k.push("el");if(S.lb)k.push("lb");if(S.sa)k.push("sa");
  return k;
}
function agendaMonta(){
  const T=S.fixt.length;
  const n={cn:S.cn?cnTotalFases():0,cl:S.cl?13:0,el:S.el?13:0,lb:S.lb?13:0,sa:S.sa?13:0};
  // só ocupam datas do usuário as competições em que o clube joga: as outras não precisam de data própria
  const meus=agendaCompetidores();
  const comps=meus.filter(k=>n[k]>0);
  const janela={cn:[.06,.66],sa:[.11,.86],lb:[.10,.82],el:[.09,.92],cl:[.08,.98]};
  const total=T+comps.reduce((q,k)=>q+n[k],0);
  const slots=new Array(total).fill(null);
  const alvos=[];
  comps.forEach(k=>{
    const N=n[k],a=janela[k][0],b=janela[k][1];
    const ini=Math.max(0,Math.round(total*a)),fim=Math.min(total-1,Math.round(total*b));
    for(let j=0;j<N;j++)alvos.push({pos:N>1?Math.round(ini+(fim-ini)*j/(N-1)):ini,k,j});
  });
  alvos.sort((x,y)=>x.pos-y.pos||x.j-y.j);
  alvos.forEach(a=>{
    let p=a.pos;while(p<total&&slots[p])p++;
    if(p>=total){p=a.pos;while(p>=0&&slots[p])p--}
    if(p>=0)slots[p]={comp:a.k,idx:a.j};
  });
  let lg=0;for(let i=0;i<total;i++)if(!slots[i])slots[i]={comp:"liga",idx:lg++};
  // garante ordem interna crescente de cada competição (idx)
  const cont={};slots.forEach(sl=>{cont[sl.comp]=cont[sl.comp]||0;sl.idx=cont[sl.comp]++});
  // calendário: temporada de 12 meses começando em 1º de agosto, 2 datas por semana (qua e dom) ao longo do ano
  S.agenda=slots.map((sl,i)=>{
    const diaAno=Math.floor(i*(300/Math.max(1,total-1)));       // distribui em ~300 dias (ago → mai)
    const dt=new Date(2026+(S.temp-1)+0,7,1+diaAno);
    return{comp:sl.comp,idx:sl.idx,mes:dt.getMonth(),dia:dt.getDate(),ano:dt.getFullYear(),dow:dt.getDay(),res:null,adv:null,casa:null};
  });
  S.dia=0;
}
function cnTotalFases(){ // quantas datas a Copa nacional ocupa para o meu clube nesta temporada
  if(!S.cn)return 0;
  const n=S.cn.parts.length;let alvo=1;while(alvo*2<=n)alvo*=2;
  let vivos=n,fracos=S.cn.parts.filter(p=>p.div>0).length,f=0;
  while(vivos>alvo){const j=Math.min(vivos-alvo,Math.floor(fracos/2));if(j<=0)break;vivos-=j;fracos-=j;f++}
  return f+Math.round(Math.log2(alvo));
}
function agendaAtual(){return S.agenda?S.agenda[S.dia]:null}
function agendaAvanca(){
  const mesAntes=(S.agenda&&S.agenda[S.dia])?S.agenda[S.dia].mes:null;
  if(S.agenda&&S.dia<S.agenda.length)S.dia++;
  try{
    const mesDepois=(S.agenda&&S.agenda[S.dia])?S.agenda[S.dia].mes:null;
    if(mesAntes!=null&&mesDepois!==mesAntes)cobraMes();                 // v52: virou o mês → paga a folha
    else if(mesAntes!=null&&mesDepois==null)cobraMes();                  // acabou o calendário: paga o último mês
  }catch(e){}
  try{gramadoRecupera()}catch(e){}
  try{ // o elenco real já recupera até a nova data (a tela de elenco mostra o valor certo antes do próximo jogo)
    const real=S._clbak?S._clbak.clubes[S._clbak.meu]:S.clubes[S.meu];
    if(real&&S.agenda&&S.dia<S.agenda.length)recuperaParaProximoJogo(real);
  }catch(e){}
}

// Competições em que o MEU clube não joga (ou já está eliminado) avançam sozinhas, na mesma cadência da agenda.
function agendaSimulaOutras(){
  // data de referência para as competições de fora: usa a posição relativa na temporada (0..1)
  if(!S.agenda)return;
  const prog=S.dia/S.agenda.length;
  try{copaMundoAvanca(prog)}catch(err){}
  const meus=new Set(agendaCompetidores());
  const tentativas=[["cl",S.cl,()=>clSimulaData(),.08,.98,13],["el",S.el,()=>elSimulaData(),.09,.92,13],["lb",S.lb,()=>lbSimulaData(),.10,.82,13],["sa",S.sa,()=>saSimulaData(),.11,.86,13]];
  tentativas.forEach(([k,e,sim,a,b,N])=>{
    if(!e||meus.has(k))return;                    // as minhas competições têm datas próprias na agenda
    const fim=e.fase==="fim";if(fim)return;
    const feitos=e._sim||0;
    const alvo=Math.min(N,Math.floor(N*Math.max(0,(prog-a))/(b-a))+ (prog>=b?N:0));
    if(feitos<alvo){e._sim=feitos+1;try{sim()}catch(err){}}
  });
}


function fechaDataCopa(ai,g1,g2){

  let nomeAdv="";
  try{nomeAdv=(ai.meuEhA?t.parts[ai.ib]:t.parts[ai.ia]).nome}catch(e){}
  agendaRegistra(g1+" x "+g2,nomeAdv,ai.meuEhA);
  agendaAvanca();
}

function proximoJogoInfo(){
  const d=agendaAtual();if(!d)return null;

  }

    if(g){const eu=nomeMeuClube(),o=g[0].nome===eu?g[1]:g[0];return{comp,adv:{nome:o.nome,cor:o.cor,cor2:o.cor2,escudo:null,forca:o.forca},casa:"Campo neutro",titulo:mundialTitulo(),folga:false}}
    return{comp,adv:null,casa:"",titulo:"Mundial de Clubes",folga:true};
  }
  const t={cn:S.cn,cl:S.cl,el:S.el,lb:S.lb,sa:S.sa}[comp];
  if(!t)return{comp,adv:null,casa:"",titulo:COMP_INFO[comp].n,folga:true};
  let g=null;
  try{
    if(comp==="cn")g=cnMeuJogo();
    else if(comp==="cl")g=clMeusJogos();
    else if(comp==="el")g=elMeuJogo();
    else if(comp==="lb")g=lbMeuJogo();
    else if(comp==="sa")g=saMeuJogo();
  }catch(e){g=null}
  const faseTxt=comp==="cn"?(t.nomeFase||""):comp==="cl"?clTituloFase().replace("Champions League · ",""):comp==="el"?elTituloFase().replace("Liga Europa · ",""):comp==="lb"?lbTituloFase().replace("Libertadores · ",""):saTituloFase().replace("Sul-Americana · ","");
  if(g){

  return{comp,adv,casa,titulo:`${COMP_INFO[comp].n} · ${faseTxt}`,folga:!adv};
}



// Adversário (e mando) de uma data da agenda: liga = calendário de rodadas; copas = só o adversário já conhecido
function adversarioDaData(d){
  if(!d)return null;
  if(d.res&&d.adv)return{nome:d.adv,casa:!!d.casa,res:d.res,fixo:true};
  if(d.comp==="liga"){
    const r=S.fixt&&S.fixt[d.idx];if(!r)return null;
    const par=r.find(([a,b])=>a===S.meu||b===S.meu);if(!par)return{nome:"Folga",casa:true,folga:true};
    const adv=S.clubes[par[0]===S.meu?par[1]:par[0]];
    return adv?{nome:adv.nome,sig:adv.sig,cor:adv.cor,cor2:adv.cor2,casa:par[0]===S.meu}:null;
  }
  if(d.comp==="mund"&&S.mundial&&S.mundial.temp===S.temp){const g=mundialMeuJogo();if(g&&d.idx===Math.min(S.mundial.etapa,6)){const eu=nomeMeuClube(),o=g[0].nome===eu?g[1]:g[0];return{nome:o.nome,sig:o.sig,cor:o.cor,cor2:o.cor2,casa:true}}}
  return null;
}

  }
  const mes=S.calMes,ano=S.calAno;
  const jogos=S.agenda.map((d,i)=>({...d,i})).filter(d=>d.mes===mes&&d.ano===ano);
  const porDia={};jogos.forEach(d=>{porDia[d.dia]=d});

  let h=topoAba("📅","Calendário da temporada "+S.temp,"Seus jogos, mês a mês",[[Math.min(S.dia,S.agenda.length),"Jogados"],[Math.max(0,S.agenda.length-S.dia),"Restantes"],[S.agenda.length,"Total"]]);

    h+=`<div class="d jg ${eh?'hoje':''} ${feito?'feito':''}" onclick="calDetalhe(${d.i})"><span class="n">${dia}</span><span class="ic">${COMP_INFO[d.comp].ic}</span>${meu}</div>`;
  }
  h+=`</div>`;
  // lista dos jogos do mês
  h+=`<div class="card" style="margin-top:10px"><h3>Jogos de ${MESES[mes]}</h3>`;
  h+=jogos.length?jogos.map(d=>{
    const eh=d.i===S.dia;
    const av=adversarioDaData(d);
    const meio=d.res?`<b class="rsL">${d.res}</b> <span>${d.casa?'vs':'@'} ${av&&av.cor?escudo(av,15)+' ':''}${d.adv}</span>`:(av&&!av.folga?`<span>${av.casa?'Em casa':'Fora'} · ${av.cor?escudo(av,15)+' ':''}<b>${av.nome}</b></span>`:`<span class="mu">${eh?'Hoje':'Adversário a definir'}</span>`);

  }).join(""):`<div class="mu">Nenhum jogo neste mês.</div>`;
  h+=`</div>`;
  return h;

function calMuda(dm){
  let m=S.calMes+dm,a=S.calAno;

}
function calDetalhe(i){
  const d=S.agenda[i];if(!d)return;
  const dt=`${d.dia}/${String(d.mes+1).padStart(2,'0')}/${d.ano}`;
  if(d.res)return aviso(`${dt}\n${COMP_INFO[d.comp].ic} ${COMP_INFO[d.comp].n}\n${d.res} ${d.casa?'contra':'fora, contra'} ${d.adv}`);

function semente(str){let h=2166136261>>>0;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return h>>>0}
function rngSeed(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296}}

// quão "intocável" é o jogador no clube dele (0 = reserva sem importância; 1 = craque do time)
function importancia(cl,j){
  const ord=[...cl.elenco].sort((a,b)=>b.f-a.f);
  const rank=ord.findIndex(x=>x.id===j.id);
  const r=1-rank/Math.max(1,ord.length-1);          // 1 = melhor do elenco
  const goleiroUnico=(j.pos==="GOL"&&cl.elenco.filter(x=>x.pos==="GOL").sort((a,b)=>b.f-a.f)[0].id===j.id)?.15:0;
  return Math.max(0,Math.min(1,r*0.85+goleiroUnico));
}
function precoPedido(cl,j){ // valor pedido pelo clube dono
  const imp=importancia(cl,j);
  return Math.round(j.val*(1.0+imp*0.7));            // craque custa até 70% a mais que o valor de mercado
}
function chanceCompra(cl,j,oferta){
  const pedido=precoPedido(cl,j);const ratio=oferta/pedido;
  let ch=ratio>=1.15?1:ratio>=1?.8:ratio>=.9?.45:ratio>=.8?.15:.02;
  // jogador com contrato longo e muito importante: o clube resiste mais
  ch*=1-importancia(cl,j)*0.35*Math.min(1,(j.ct||1)/4);
  return Math.max(.01,Math.min(1,ch));
}

// S.busca = {fMin,fMax,iMin,iMax,pMin,pMax,pos,pais,hab,ordem}; resultados guardados em S._resBusca (não salva)
const BUSCA_PADRAO={fMin:"",fMax:"",iMin:"",iMax:"",pMin:"",pMax:"",pos:"",pais:"",hab:"",ordem:"f"};

// Congela a identidade de todos os clubes do mundo (uma única vez por jogo). Em lotes para não travar o celular.
function congelaMundoEmLotes(onFim){
  if(!S.mundo)S.mundo={};
  if(S.mundoCongelado){if(onFim)onFim();return}
  const lista=[];
  Object.keys(LIGAS).forEach(pais=>LIGAS[pais].forEach((lst,dv)=>lst.forEach((c,idx)=>{
    if(pais===S.pais&&S.clubes.find(x=>x.nome===c[0]))return;
    lista.push({pais,dv,idx});
  })));
  let pos=0;const TOTAL=lista.length,LOTE=30;
  (function passo(){
    const fim=Math.min(TOTAL,pos+LOTE);
    for(;pos<fim;pos++){
      const {pais,dv,idx}=lista[pos];
      try{
        const k=chaveClube(pais,dv,idx);
        if(S.ext&&S.ext[k]&&S.ext[k].mexido)continue;
        if(!S.mundo[k])S.mundo[k]=criaEstadoMundo(k,picoClube(pais,dv,idx));
        else if(S.mundo[k].c.some(t=>t[7]==null)){            // save antigo: congela a identidade que o código gera agora
          const base=baseMundo(k,S.mundo[k].pico);
          S.mundo[k].c.forEach((t,i)=>{if(t[7]==null){const b=(t[5]||0)===0?base[i]:jogadorDeGeracao(k,i,t[5],S.mundo[k].pico);t[6]=idParaNum(b.id);t[7]=empacotaIdent(b)}});
        }
      }catch(e){}
    }
    S._prog={feito:pos,total:TOTAL,msg:"Preparando o mundo"};
    if(pos<TOTAL){atualizaProgBusca();setTimeout(passo,0);return}
    S.mundoCongelado=true;S._prog=null;
    try{save()}catch(e){}
    if(onFim)onFim();
  })();
}

function buscaJogadores(onFim){
  const B=Object.assign({},BUSCA_PADRAO,S.busca||{});
  const num=v=>v===""||v==null||isNaN(+v)?null:+v;
  const fMin=num(B.fMin),fMax=num(B.fMax),iMin=num(B.iMin),iMax=num(B.iMax);
  const pMin=num(B.pMin)!=null?num(B.pMin)*1e6:null,pMax=num(B.pMax)!=null?num(B.pMax)*1e6:null;
  const cand=[];
  Object.keys(LIGAS).forEach(pais=>{
    if(B.pais&&B.pais!==pais)return;
    LIGAS[pais].forEach((lst,dv)=>lst.forEach((c,idx)=>{
      if(pais===S.pais&&S.clubes.find(x=>x.nome===c[0]))return;
      const k=chaveClube(pais,dv,idx);
      let linhas;
      if(S.ext&&S.ext[k]&&S.ext[k].mexido)linhas=S.ext[k].elenco.map((j,slot)=>[j.idade,Math.round(j.f*10),j.pot,0,0,0,null,null,j.pos,j.id]);   // clube alterado
      else{const e=S.mundo&&S.mundo[k];if(!e)return;linhas=e.c.map((t,slot)=>[t[0],t[1],t[2],0,0,0,t[6],t[7],POS22[slot],null])}                   // só números
      const mk=fatorMercado(pais,dv);
      linhas.forEach((t,slot)=>{
        const idade=t[0],f=Math.round(t[1]/10),pot=t[2];
        if(fMin!=null&&f<fMin)return;if(fMax!=null&&f>fMax)return;
        if(iMin!=null&&idade<iMin)return;if(iMax!=null&&idade>iMax)return;
        if(B.pos&&t[8]!==B.pos)return;
        const preco=valorDe(f,idade,pot,mk);
        if(pMin!=null&&preco<pMin)return;if(pMax!=null&&preco>pMax)return;
        if(B.hab&&t[7]!=null){const d=desempacotaIdent(t[7]);if(!d.hab.includes(B.hab))return}
        cand.push({pais,dv,idx,slot,f,idade,preco});
      });
    }));
  });
  cand.forEach((x,i)=>{x.n=i});                                                   // posição original: desempate estável
  window._resBusca={cand,total:cand.length,pagina:0,ordem:B.ordem||"f",cache:{}};  // lista COMPLETA (números); fora do save
  ordenaBusca();
  if(onFim)onFim();
}

// ----- Empréstimo com opção de compra -----
function taxaEmprestimo(cl,j){return Math.round(j.val*(0.06+importancia(cl,j)*0.10))}   // 6% a 16% do valor
function precoOpcao(cl,j){return Math.round(precoPedido(cl,j)*0.9)}
function chanceEmprestimo(cl,j,taxa){
  const t0=taxaEmprestimo(cl,j),ratio=taxa/t0;
  let ch=ratio>=1.3?.95:ratio>=1?.7:ratio>=.8?.3:.05;
  ch*=1-importancia(cl,j)*0.55;                   // clube raramente empresta seu craque
  if(j.idade<=21)ch*=.7;                          // joia jovem: clube resiste
  return Math.max(.01,Math.min(.97,ch));
}
function negociaEmprestimoExt(pais,div,idx,id){

      S.merc={tela:'clubes',pais,div,idx};auto(eu,true);save();render();toast(j.nome+" chegou por empréstimo");

// ----- Emprestar jogador MEU para outro clube -----
function emprestaMeu(id){
  const eu=S.clubes[S.meu],j=eu.elenco.find(x=>x.id===id);if(!j)return;
  if(eu.elenco.length<=16)return aviso("Elenco mínimo: 16 jogadores.");
  // propõe 3 clubes da mesma liga com interesse (os que mais precisam da posição)
  const alvos=S.clubes.filter(c=>c.id!==S.meu).sort(()=>R()-.5).slice(0,3);
  const ofertas=alvos.map(c=>({c,taxa:Math.round(j.val*(0.05+R()*0.08)),compra:Math.round(j.val*(1.0+R()*0.3))}));
  window._ofs=ofertas;window._jid=id;
  modal(`<h3>Emprestar ${j.nome}</h3><div class="mu" style="font-size:12px;margin-bottom:8px">Clubes interessados (1 ano). Você recebe a taxa; o salário passa a ser deles.</div>`+
    ofertas.map((o,k)=>`<div class="clube" onclick="confirmaEmprestaMeu(${k})"><span>${escudo(o.c,18)} ${o.c.nome}</span><span class="tag">${R$(o.taxa)}</span></div>`).join("")+
    `<button class="s big" onclick="fechaDlg()">Cancelar</button>`);
}
function confirmaEmprestaMeu(k){
  fechaDlg();
  const o=window._ofs[k],eu=S.clubes[S.meu],j=eu.elenco.find(x=>x.id===window._jid);if(!j)return;
  confirma(`Emprestar ${j.nome} ao ${o.c.nome} por 1 ano?\nVocê recebe ${R$(o.taxa)}.\nOpção de compra deles: ${R$(o.compra)}.`,()=>{
    eu.caixa+=o.taxa;finRec('Empréstimo de jogadores',o.taxa);
    eu.elenco=eu.elenco.filter(x=>x.id!==j.id);
    const cp={...j,emprestado:true,donoNome:eu.nome,donoMeu:true,tit:false};delete cp.px;delete cp.py;delete cp._slot;delete cp._role;
    o.c.elenco.push(cp);
    if(!S.emprest)S.emprest=[];
    S.emprest.push({jid:j.id,nome:j.nome,sentido:"saida",clube:o.c.nome,clubeId:o.c.id,compra:o.compra,ate:"fim da temporada",temp:S.temp,jogador:{...j}});
    auto(eu,true);save();render();toast(j.nome+" foi emprestado");
  });
}
// ----- Fim da temporada: o empréstimo termina -----
function resolveEmprestimos(){
  if(!S.emprest||!S.emprest.length)return;
  const eu=S.clubes[S.meu],avisos=[];
  S.emprest.forEach(e=>{
    if(e.sentido==="entrada"){
      // jogador volta ao clube dono (se não foi comprado)
      const j=eu.elenco.find(x=>x.id===e.jid);
      if(j&&j.emprestado){
        eu.elenco=eu.elenco.filter(x=>x.id!==e.jid);
        const dono=(()=>{try{return elencoDe(e.pais,e.div,e.idx)}catch(err){return null}})();
        const volta={...j,emprestado:false,tit:false};["donoPais","donoDiv","donoIdx","donoNome"].forEach(k=>delete volta[k]);delete volta.px;delete volta.py;delete volta._slot;delete volta._role;
        if(dono){dono.elenco.push(volta);marcaAlterado(dono)}
        avisos.push(j.nome+" voltou ao "+e.clube);
      }
    }else{
      // jogador meu volta de um clube da minha liga (ou, se o clube foi extinto, recria)
      const cl=S.clubes.find(c=>c.id===e.clubeId||c.nome===e.clube);
      if(cl){
        const j=cl.elenco.find(x=>x.id===e.jid);
        if(j){cl.elenco=cl.elenco.filter(x=>x.id!==e.jid);}
      }
      const orig=e.jogador;
      if(orig&&!eu.elenco.find(x=>x.id===e.jid)){const v={...orig,emprestado:false,tit:false,ct:Math.max(1,(orig.ct||1))};delete v.px;delete v.py;delete v._slot;delete v._role;eu.elenco.push(v);avisos.push(orig.nome+" voltou do empréstimo no "+e.clube)}
    }
  });
  S.emprest=[];
  if(avisos.length)setTimeout(()=>aviso("🔁 Fim dos empréstimos:\n"+avisos.join("\n")),400);
}

// sorteio com 2 números do gerador (mesmo consumo do sistema anterior → o resto do elenco não muda)
function sorteiaHab(pos,rg){
  const a=rg(),b=rg();
  const ruins=PAPEIS_RUINS[pos]||PAPEIS_RUINS.MEI;
  if(a<.14){const p=ruins[Math.floor(b*ruins.length)];return{hab:p[1].slice(),cat:"fraco",papel:p[0]}}
  const lst=PAPEIS[pos]||PAPEIS.MEI;
  const tot=lst.reduce((q,x)=>q+x[2],0);
  const x=((a-.14)/.86)*tot;                       // reaproveita 'a' para escolher o papel
  let acc=0,p=lst[lst.length-1];
  for(const it of lst){acc+=it[2];if(x<=acc){p=it;break}}
  const ideal=b<.55;                               // 'b' decide ideal (55%) ou bom (45%)
  let hab=p[1].slice();
  if(!ideal){const ch=CHAVE_POS[pos]||[];const chave=p[1].slice().sort((x,y)=>(ch.indexOf(x)<0?9:ch.indexOf(x))-(ch.indexOf(y)<0?9:ch.indexOf(y)))[0];const pool=(COMPLEMENTO[pos]||[]).filter(h=>h!==chave).slice().sort();const u=(a*1e6)%1;hab=[chave,pool[Math.floor(u*pool.length)]]}
  return{hab,cat:ideal?"ideal":"bom",papel:p[0]};
}

// descobre o papel de um jogador que já tem habilidades (jogadores antigos, de reposição ou editados)
function papelDe(j){
  if(j.papel)return j.papel;
  const h=j.hab||[];
  const lst=(PAPEIS[j.pos]||[]).concat((PAPEIS_RUINS[j.pos]||[]).map(x=>[x[0],x[1],0]));
  let melhor=null,mp=0;
  lst.forEach(p=>{const m=p[1].filter(x=>h.includes(x)).length;if(m>mp){mp=m;melhor=p[0]}});
  return melhor||({GOL:"Goleiro",ZAG:"Zagueiro",LD:"Lateral",LE:"Lateral",VOL:"Volante",MEI:"Meia",PE:"Ponta",ATA:"Atacante"})[j.pos]||j.pos;
}

function criaJogadorFixo(pos,alvoF,rg,idadeFixa,anoNasc,nac){
  const pick2=a=>a[Math.floor(rg()*a.length)];
  const idade=idadeFixa||(anoNasc?Math.max(16,new Date().getFullYear()-anoNasc):(17+Math.floor(rg()*20)));
  const f=Math.max(15,Math.min(100,Math.round(alvoF)));
  // potencial: raros chegam a 100; maioria perto da força atual para a idade
  const r=rg();
  let pot;
  if(idade>=30)pot=f;
  else if(r<.004)pot=92+Math.floor(rg()*9);
  else if(r<.04)pot=Math.min(100,f+14+Math.floor(rg()*16));
  else if(r<.25)pot=Math.min(100,f+6+Math.floor(rg()*12));
  else pot=Math.min(100,f+Math.floor(rg()*7));
  if(idade>=26)pot=Math.min(pot,f+Math.max(0,Math.floor((30-idade)*1.2)));
  const hb=sorteiaHab(pos,rg);
  return{id:"j"+Math.floor(rg()*1e9).toString(36)+Math.floor(rg()*1e9).toString(36),nome:pick2(SILABAS1)+pick2(SILABAS2)+" "+pick2(SOBRE),pos,f,pot,idade,
    sal:salarioDe(f),val:valorDe(f,idade,pot),gols:0,art:0,lesao:0,tit:false,ct:1+Math.floor(rg()*4),hum:30+Math.floor(rg()*40),en:100,hab:hb.hab,habCat:hb.cat,papel:hb.papel,nac:nac||""};
}
// ===== PRECIFICAÇÃO (v38) =====
// Valor de mercado (R$) de um jogador de 26 anos de LIGA FORTE (Europa): F30 ≈ 0,6 mi · F40 ≈ 3,5 mi · F50 ≈ 12 mi · F60 ≈ 30 mi · F70 ≈ 70 mi · F80 ≈ 140 mi · F100 ≈ 350 mi.
// O mercado de cada liga multiplica o valor (fator de país × fator de divisão): o mesmo F50 custa 12 mi na Inglaterra, ~8 mi no Brasil e ~6,6 mi na Colômbia.
const VAL_PTS=[[15,.15e6],[25,.25e6],[30,.6e6],[35,1.5e6],[40,3.5e6],[45,7e6],[50,12e6],[55,20e6],[60,30e6],[65,45e6],[70,70e6],[80,140e6],[90,230e6],[100,350e6]];
function valorBase(f){
  f=Math.max(15,Math.min(100,f));
  for(let i=0;i<VAL_PTS.length-1;i++){const [a,va]=VAL_PTS[i],[b,vb]=VAL_PTS[i+1];if(f>=a&&f<=b)return Math.exp(Math.log(va)+(f-a)/(b-a)*(Math.log(vb)-Math.log(va)))}
  return VAL_PTS[VAL_PTS.length-1][1];
}
const MERCADO_PAIS={Inglaterra:1,Espanha:1,Itália:1,Alemanha:1,França:1,Portugal:.9,Holanda:.9,Bélgica:.85,Turquia:.85,Escócia:.8,Rússia:.85,Brasil:.7,Argentina:.7,Colômbia:.55,Chile:.55,Uruguai:.55,México:.6,"Estados Unidos":.6,Japão:.6,"Arábia Saudita":.7};
const MERCADO_DIV=[1,.6,.35];
function fatorMercado(pais,div){return(MERCADO_PAIS[pais]||.6)*(MERCADO_DIV[div]!=null?MERCADO_DIV[div]:.35)}

// fator de mercado do clube, lido da chave usada para gerar o elenco ("Brasil|0|3", "Inglaterra|1|7" ou "gen|Olimpia")
function mkDaChave(chave){
  const p=String(chave).split("|");
  if(p[0]==="gen")return .5;
  if(LIGAS[p[0]]&&p[1]!=null&&!isNaN(+p[1]))return fatorMercado(p[0],+p[1]);
  return .6;
}
function valorDe(f,idade,pot,mk){
  const ida=idade<=19?1.5:idade<=22?1.3:idade<=25?1.1:idade<=29?1:idade<=31?.75:idade<=33?.5:.3;
  const promessa=1+Math.min(.8,Math.max(0,(pot||f)-f)/40)*(idade<=26?1:.3);
  return Math.round(valorBase(f)*ida*promessa*(mk==null?1:mk)/10000)*10000;
}
// Salário em milhares de R$/mês: cerca de 2% do valor-base por mês, também ajustado pelo mercado da liga (mínimo R$ 8 mil).
function salarioDe(f,mk){return Math.max(8,Math.round(valorBase(f)*0.02*(mk==null?1:mk)/1000))}
const POS22=["GOL","GOL","ZAG","ZAG","ZAG","ZAG","LD","LE","VOL","VOL","MEI","MEI","MEI","ATA","ATA","ATA","PE","ZAG","MEI","ATA","LD","LE"];
// Elenco de um clube: craque no topo, titulares um pouco abaixo, reservas abaixo.
function geraElencoFixo(chave,pico){
  const rg=rngClube(chave);
  const el=POS22.map((pos,i)=>{
    let alvo;
    if(i<4)alvo=pico-Math.floor(rg()*5);                 // 4 jogadores de ponta
    else if(i<13)alvo=pico-4-Math.floor(rg()*8);
    else alvo=pico-8-Math.floor(rg()*9);
    // jovem de potencial raro aparece de vez em quando mais baixo (será o craque do futuro)
    const idadeBase=(i%7===0)?(17+Math.floor(rg()*4)):null;
    const jf=criaJogadorFixo(pos,alvo,rg,idadeBase);jf.num=NUM_SLOT[i];jf.mk=mkDaChave(chave);jf.val=valorDe(jf.f,jf.idade,jf.pot,jf.mk);jf.sal=salarioDe(jf.f,jf.mk);return jf;
  });
  return el;
}


function forcaMedia(c){const f=c.elenco.map(x=>x.f).sort((a,b)=>b-a).slice(0,11);return Math.round(f.reduce((q,x)=>q+x,0)/Math.max(1,f.length))}
// Elenco determinístico de QUALQUER clube do mundo (liga, divisão, posição). Cacheado em S.ext para sobreviver ao salvamento quando alterado.
function clubeMundo(pais,div,idx){
  if(pais===S.pais&&div===S.div&&S.clubes[idx]&&clubesDaDivisao(pais,div)[idx]&&S.clubes[idx].nome===clubesDaDivisao(pais,div)[idx][0])return S.clubes[idx];
  const info=LIGAS[pais][div][idx];
  const dono=(pais===S.pais)?S.clubes.find(c=>c.nome===info[0]):null;     // clube do meu país que está na minha divisão (pode ter mudado de posição)
  if(dono)return dono;
  if(!S.ext)S.ext={};
  const k=chaveClube(pais,div,idx);
  if(S.ext[k])return S.ext[k];                                            // clube ALTERADO (compra/empréstimo): elenco completo
  if(!S._mem)S._mem={};
  if(S._mem[k])return S._mem[k];                                          // já montado nesta sessão
  if(!S.mundo)S.mundo={};
  const pico=picoClube(pais,div,idx);
  if(!S.mundo[k])S.mundo[k]=criaEstadoMundo(k,pico);
  const c={ext:true,compacto:true,pais,div,idx,nome:info[0],sig:info[1],cor:info[2],cor2:info[3],forca:0,elenco:elencoDoMundo(k,pico,S.mundo[k])};
  c.forca=forcaMedia(c);
  c.form=c.form||"4-4-2";
  try{auto(c)}catch(e){}
  S._mem[k]=c;return c;
}


// Clube jogável de qualquer participante de copa: o MESMO elenco fixo sempre (mundo único e persistente)
function clubeParaJogo(pt){
  if(ehMeuClube(pt))return S.clubes[S.meu];
  { const dono=(pt.pais===S.pais)?S.clubes.find(c=>c.nome===pt.nome):null; if(dono)return dono; }
  // procura o clube nas ligas do jogo pelo nome (para usar o elenco fixo oficial dele)
  let achado=null;
  if(pt.pais&&LIGAS[pt.pais]){
    for(let dv=0;dv<LIGAS[pt.pais].length&&!achado;dv++){
      const i=LIGAS[pt.pais][dv].findIndex(c=>c[0]===pt.nome);
      if(i>=0)achado=clubeMundo(pt.pais,dv,i);
    }
  }
  if(!achado&&pt.div!=null&&pt.pais==null&&S.pais){ // participante da Copa nacional (liga do usuário)
    const i=LIGAS[S.pais][pt.div].findIndex(c=>c[0]===pt.nome);
    if(i>=0)achado=clubeMundo(S.pais,pt.div,i);
  }
  if(!achado){ // clubes gerados (Paraguai, Equador etc.): elenco fixo por nome
    const k="gen|"+pt.nome;
    if(!S.ext)S.ext={};
    if(!S.ext[k]){
      const pk=Math.max(30,(PICO_LIGA[pt.pais]||40)-Math.floor(rngClube(k+'|p')()*8));
      const c={ext:true,gen:true,pais:pt.pais||"",nome:pt.nome,sig:pt.sig,cor:pt.cor,cor2:pt.cor2,forca:0,elenco:geraElencoFixo(k,pk)};
      c.forca=forcaMedia(c);S.ext[k]=c;
    }
    achado=S.ext[k];
  }
  if(!achado.form)achado.form="4-4-2";
  if(!achado.elenco.some(x=>x.tit))auto(achado);
  achado.escudo=achado.escudo||null;achado.caixa=achado.caixa||0;
  if(achado.id==null)achado.id=1000+(achado.idx||0);
  return achado;
}


// ===== EVOLUÇÃO DE FORÇA (gradual, teto 100) E ARTILHEIRO DA LIGA =====
function crescimentoJog(j,rg,soMaturacao){
  const f=j.f,pot=j.pot||f,id=j.idade;
  if(id<=28){                                        // evolui até os 28
    const falta=Math.max(0,pot-f);
    const frac=fracAnualIdade(id);
    if(soMaturacao){                                  // v57: o grosso já veio jogando; aqui só a maturação + o treino de quem jogou pouco
      const treino=j.jogou?0:falta*frac*.45;
      const g=falta*frac*(1-EVO_PARTE_JOGOS)+(rg()*1.2-0.5)*.5+(j.jogou?0.15:0)+treino+Math.min(j._fama||0,falta)*.25;
      return Math.max(-.5,Math.min(falta,g));
    }
    const g=falta*frac+(rg()*1.2-0.5)+(j.jogou?0.25:0)+Math.min(j._fama||0,falta);
    return Math.max(-0.5,Math.min(falta,g));
  }
  return -(0.5+0.35*(id-29))+(rg()*0.8-0.4);         // aos 29 já só perde (−0,5 aos 29 … −3,5 aos 38)
}
function evoluiElenco(c,chave){
  const rg=rngClube("evo|"+chave+"|"+S.temp);
  const bf=bonusFamaEvolucao(c.nome);
  c.elenco.forEach(j=>{
    j.idade++;j._fama=bf;
    const g=crescimentoJog(j,rg,!!(S.clubes&&S.clubes.includes(c)));          // v57: clubes da MINHA liga (você e a IA) já evoluíram durante a temporada: aqui só a maturação. Clubes só do mundo-completo (elenco alterado) recebem o total
    j.fReal=(j.fReal!=null?j.fReal:j.f)+g;             // guarda a parte fracionária (ganho gradual)
    j.f=Math.max(15,Math.min(100,Math.round(j.fReal)));
    j.fReal=Math.max(15,Math.min(100,j.fReal));
    j.val=valorDe(j.f,j.idade,j.pot,j.mk);j.sal=salarioDe(j.f,j.mk);
    if(j.idade>=29&&j.pot>j.f)j.pot=j.f;                // v49: a partir dos 29 não há mais o que crescer
    j.en=100;j.gols=0;j.golsLiga=0;j.assistCarr=(j.assistCarr||0)+(j.assistLiga||0);j.assistLiga=0;j.jogou=false;j.ac=0;j.vm=0;
  });
  c.elenco=c.elenco.filter(j=>j.idade<39);
  c.forca=forcaMedia(c);
}
// Artilheiro da liga: o jogador com mais gols da temporada na MINHA divisão ganha +1 artilharia
function fechaArtilharia(){
  const todos=S.clubes.flatMap(c=>c.elenco.map(j=>({j,c}))).filter(o=>(o.j.golsLiga||0)>0).sort((a,b)=>(b.j.golsLiga||0)-(a.j.golsLiga||0));
  if(!todos.length)return null;
  const topo=todos[0];
  topo.j.art=(topo.j.art||0)+1;
  const antes=Math.max(0,(topo.j.art||1)-1),nivelAntes=antes>=5?2:antes>=3?1:0,nivelDepois=estrelaNivel(topo.j);
  const aviso_=nivelDepois>nivelAntes?(nivelDepois===2?`🔴★ ${topo.j.nome} (${topo.c.nome}) virou ESTRELA VERMELHA: 5 artilharias!`:`🟡★ ${topo.j.nome} (${topo.c.nome}) virou ESTRELA AMARELA: 3 artilharias!`):null;
  try{const asm=S.clubes.flatMap(c=>c.elenco.map(j=>({j,c}))).filter(o=>(o.j.assistLiga||0)>0).sort((a,b)=>(b.j.assistLiga||0)-(a.j.assistLiga||0))[0];
    if(asm){if(!S.astHist)S.astHist=[];S.astHist.push({temp:S.temp,pais:S.pais,div:S.div,nome:asm.j.nome,clube:asm.c.nome,a:asm.j.assistLiga||0});S.astHist=S.astHist.filter(x=>S.temp-x.temp<8)}}catch(e){}

  return aviso_;
}

function classificacaoMundo(pais,div){

  const fim=S.tabFinalMundo&&S.tabFinalMundo[pais];

    return{nome,sig:info[1],cor:info[2],cor2:info[3],id:null,idx:ch?ch.idx:null,div:ch?ch.div:0,pais,sc:1000-i};
  };
  if(div===0&&fim&&fim.length)return fim.map(mk);
  const lista=clubesNaDivisao(pais,div);
  const rg=rngClube("class|"+pais+"|"+div+"|"+S.temp);

}

function seedPartida(idPartida){
  return "P|"+String(idPartida==null?"":idPartida)+"|"+((S&&S.seed)!=null?S.seed:0)+"|"+((S&&S.temp)||1)+"|"+((S&&S.rodada)||0);
}
function hashResultado(r){
  const t=[r.ga,r.gb,(r.ea||[]).join(","),(r.eb||[]).join(",")].join("#");

  r.seed=sd;r.hash=hashResultado(r);

}

// ===== ACESSO E REBAIXAMENTO =====
// S.divAtual[nome do clube] = divisão atual (só para o país do jogador). Começa igual a LIGAS.
function divAtualDe(nome){return S.divAtual?S.divAtual[nome]:undefined}
function garanteDivAtual(){
  if(S.divAtual)return;
  S.divAtual={};
  (LIGAS[S.pais]||[]).forEach((lst,dv)=>lst.forEach(c=>{S.divAtual[c[0]]=dv}));
}
// lista [ [nome,sig,cor1,cor2], ... ] dos clubes de uma divisão do MEU país, segundo a divisão atual
function clubesDaDivisao(pais,div){
  if(pais!==S.pais||!S.divAtual)return LIGAS[pais][div];
  const out=[];
  LIGAS[pais].forEach(lst=>lst.forEach(c=>{if(S.divAtual[c[0]]===div)out.push(c)}));
  return out;
}
// posição (pais|div|idx) de cada clube na lista FIXA LIGAS: o elenco é guardado por esta chave e NUNCA muda de dono
function chaveFixa(pais,nome){
  for(let dv=0;dv<LIGAS[pais].length;dv++){const i=LIGAS[pais][dv].findIndex(c=>c[0]===nome);if(i>=0)return{div:dv,idx:i}}
  return null;
}
// Elenco de um clube do meu país pelo NOME (independe da divisão atual)
function clubePorNome(nome){
  const m=S.clubes.find(c=>c.nome===nome);if(m)return m;
  const ch=chaveFixa(S.pais,nome);if(!ch)return null;
  return clubeMundo(S.pais,ch.div,ch.idx);
}
function forcaClubeNome(nome){const c=clubePorNome(nome);return c?c.forca:40}
// Simula a temporada de uma divisão que o jogador não disputa (todos contra todos, ida e volta, com a força real do elenco)
function simulaDivisao(nomes,rg){
  const pts={},sg={};nomes.forEach(n=>{pts[n]=0;sg[n]=0});
  const f={};nomes.forEach(n=>{f[n]=forcaClubeNome(n)});
  for(let i=0;i<nomes.length;i++)for(let k=0;k<nomes.length;k++){
    if(i===k)continue;const a=nomes[i],b=nomes[k];
    const ma=Math.max(.25,(f[a]+3-f[b])/22+1.35),mb=Math.max(.25,(f[b]-f[a]-3)/22+1.0);
    const g=(m)=>{let L=Math.exp(-m),q=0,pr=1;do{q++;pr*=rg()}while(pr>L);return q-1};
    const ga=g(ma),gb=g(mb);
    if(ga>gb)pts[a]+=3;else if(ga<gb)pts[b]+=3;else{pts[a]++;pts[b]++}
    sg[a]+=ga-gb;sg[b]+=gb-ga;
  }
  return[...nomes].sort((x,y)=>pts[y]-pts[x]||sg[y]-sg[x]||(rg()-.5));
}
// Executado no fim da temporada. tabelaMinha: nomes na ordem final da MINHA divisão.
function aplicaAcessoRebaixamento(tabelaMinha){
  garanteDivAtual();
  const nDiv=LIGAS[S.pais].length;
  const tabelas=[];
  for(let dv=0;dv<nDiv;dv++){
    const nomes=clubesDaDivisao(S.pais,dv).map(c=>c[0]);
    if(dv===S.div)tabelas[dv]=tabelaMinha.slice();
    else tabelas[dv]=simulaDivisao(nomes,rngClube("acesso|"+S.pais+"|"+dv+"|"+S.temp));
  }
  const movs=[];                       // {nome,de,para}
  const k=[];
  for(let i=0;i<nDiv-1;i++)k[i]=Math.min(4,Math.floor(tabelas[i].length/4),Math.floor(tabelas[i+1].length/4));
  const novo=tabelas.map(t=>t.slice());
  for(let i=0;i<nDiv-1;i++){
    const kk=k[i];if(kk<=0)continue;
    const cai=tabelas[i].slice(-kk),sobe=tabelas[i+1].slice(0,kk);
    cai.forEach(n=>movs.push({nome:n,de:i,para:i+1}));
    sobe.forEach(n=>movs.push({nome:n,de:i+1,para:i}));
  }
  movs.forEach(m=>{S.divAtual[m.nome]=m.para});
  S.ultimosMov=movs;
  // classificação final da 1ª divisão (antes dos movimentos), por nome: decide as vagas continentais
  S.tabFinal=tabelas[0].map(nome=>{const info=infoPorNome(nome);return{nome,sig:info.sig,cor:info.cor,cor2:info.cor2,forca:forcaClubeNome(nome),id:null,idx:info.idx,div:info.div}});
  return movs;
}


// Reorganiza S.clubes para a divisão em que o meu clube vai jogar na próxima temporada.
// Cada clube leva consigo elenco, caixa, estádio, técnico, formação e escudo.
function reconstroiMinhaLiga(novaDiv,nomeMeu){
  garanteDivAtual();
  const nomes=clubesDaDivisao(S.pais,novaDiv).map(c=>c[0]);
  const velhos={};S.clubes.forEach(c=>{velhos[c.nome]=c});
  const novos=nomes.map((nome,i)=>{
    let c=velhos[nome];
    if(!c){ // clube que veio de outra divisão: usa o elenco fixo do mundo e vira um clube "da liga"
      const ch=chaveFixa(S.pais,nome);
      const mundo=clubeMundo(S.pais,ch.div,ch.idx);
      const info=LIGAS[S.pais][ch.div][ch.idx];
      c=Object.assign({},mundo);
      delete c.ext;delete c.pais;delete c.div;delete c.idx;
      c.sig=info[1];c.cor=info[2];c.cor2=info[3];
      c.escudo=c.escudo||null;
      c.caixa=Math.round((2+((semente(nome+"|cx")>>>0)%9))*1000000/(1+novaDiv*0.8));
      // o clube sai do cache do mundo: seu elenco passa a viver em S.clubes
      if(S.ext)delete S.ext[S.pais+"|"+ch.div+"|"+ch.idx];
    }
    c.id=i;
    c.pts=c.j=c.v=c.e=c.d=c.gp=c.gc=0;
    return c;
  });
  // clubes que saíram da minha liga voltam ao cache do mundo (sem perder elenco)
  S.clubes.forEach(c=>{
    if(nomes.includes(c.nome))return;
    const ch=chaveFixa(S.pais,c.nome);if(!ch)return;
    if(!S.ext)S.ext={};
    const copia=Object.assign({},c,{ext:true,pais:S.pais,div:ch.div,idx:ch.idx});
    S.ext[S.pais+"|"+ch.div+"|"+ch.idx]=copia;
  });
  S.clubes=novos;
  S.div=novaDiv;
  S.meu=novos.findIndex(c=>c.nome===nomeMeu);
  S.ing=15000/(1+novaDiv*.6);
  const n=novos.length;
  S.fixt=fixtures(n%2?n+1:n,n);
}


function infoPorNome(nome){ // dados de cadastro de um clube do meu país, pelo nome
  const ch=chaveFixa(S.pais,nome);
  if(!ch)return{sig:"",cor:"#445566",cor2:"#fff",idx:null,div:0};
  const c=LIGAS[S.pais][ch.div][ch.idx];
  return{sig:c[1],cor:c[2],cor2:c[3],idx:ch.idx,div:ch.div};
}


// Classificação da 1ª divisão do meu país (por nome) usada para as vagas continentais.
//  - depois da 1ª temporada: a tabela final guardada (S.tabFinal, sempre da 1ª divisão)
//  - na 1ª temporada, se eu jogo a 1ª divisão: ordena pela força dos elencos

// ===== MUNDO COMPACTO =====
// S.mundo[chave] = { c: [[idade,f10,pot,art,golsLiga,gen] x 22], pico, e?:{...extras} }  (só o que muda)
// Nome, posição e habilidades NÃO são guardados: vêm da semente + posição no elenco + geração (gen).
function chaveClube(pais,div,idx){return pais+"|"+div+"|"+idx}
function picoClube(pais,div,idx){return picoDe(pais,div)-Math.floor(rngClube(chaveClube(pais,div,idx)+'|p')()*8)}
function baseMundo(chave,pico){ // elenco original (gen 0), sempre igual para a mesma semente
  return geraElencoFixo(chave,pico);
}
function jogadorDeGeracao(chave,i,gen,pico){ // jovem de reposição determinístico
  const rg=rngClube(chave+"|rep|"+i+"|"+gen);
  const jr=criaJogadorFixo(POS22[i],pico-12-Math.floor(rg()*9),rg,17+Math.floor(rg()*3));jr.pot=Math.min(95,jr.f+Math.floor(rg()*23));jr.mk=mkDaChave(chave);jr.val=valorDe(jr.f,jr.idade,jr.pot,jr.mk);jr.sal=salarioDe(jr.f,jr.mk);return jr;
}
function compactaElenco(elenco){return elenco.map(j=>[j.idade,Math.round((j.fReal!=null?j.fReal:j.f)*10),j.pot,j.art||0,j.golsLiga||0,j.gen||0,idParaNum(j.id),empacotaIdent(j)])}

// ===== IDENTIDADE CONGELADA (v43) =====
// Cada jogador do mundo guarda, no save, um id curto (t[6]) e UM inteiro (t[7]) que empacota: nome (sílaba1, sílaba2, sobrenome),
// 2 habilidades, categoria (ideal/bom/fraco), contrato e moral. Assim os jogadores NUNCA mudam ao reabrir o jogo ou trocar de versão.
const HAB_LISTA=["Finalização","Cabeceio","Chute longo","Velocidade","Drible","Passe","Visão de jogo","Cruzamento","Passe longo","Saída de bola","Desarme","Marcação","Antecipação","Reflexos","Posicionamento","Jogo aéreo","Pênaltis","Resistência"];
const CAT_LISTA=["ideal","bom","fraco"];
function empacotaIdent(j){
  const s1=Math.max(0,SILABAS1.indexOf(j.nome.split(" ")[0].slice(0,2))),n=j.nome;
  // o nome é "Sil1"+"Sil2"+" "+"Sobrenome": recupera os 3 índices pela própria tabela
  const partes=n.split(" ");const sob=Math.max(0,SOBRE.indexOf(partes[partes.length-1]));
  let i1=-1,i2=-1;const junto=partes[0];
  for(let a=0;a<SILABAS1.length&&i1<0;a++){if(!junto.startsWith(SILABAS1[a]))continue;const resto=junto.slice(SILABAS1[a].length);const b=SILABAS2.indexOf(resto);if(b>=0){i1=a;i2=b}}
  if(i1<0){i1=0;i2=0}
  const h1=Math.max(0,HAB_LISTA.indexOf((j.hab||[])[0])),h2=Math.max(0,HAB_LISTA.indexOf((j.hab||[])[1]));
  const cat=Math.max(0,CAT_LISTA.indexOf(j.habCat||"bom"));
  const ct=Math.max(1,Math.min(4,j.ct||1)),hum=Math.max(0,Math.min(63,(j.hum||40)-30));
  // nome: i1(20) i2(20) sob(18) · hab: h1(18) h2(18) · cat(3) · ct(5) · hum(64)
  return(((((((i1*20+i2)*18+sob)*18+h1)*18+h2)*3+cat)*5+ct)*64+hum);
}
function desempacotaIdent(v){
  const hum=v%64;v=Math.floor(v/64);const ct=v%5;v=Math.floor(v/5);const cat=v%3;v=Math.floor(v/3);
  const h2=v%18;v=Math.floor(v/18);const h1=v%18;v=Math.floor(v/18);const sob=v%18;v=Math.floor(v/18);const i2=v%20;v=Math.floor(v/20);const i1=v%20;
  return{nome:SILABAS1[i1]+SILABAS2[i2]+" "+SOBRE[sob],hab:[HAB_LISTA[h1],HAB_LISTA[h2]],habCat:CAT_LISTA[cat],ct:ct||1,hum:hum+30};
}
// converte um id "jXXXX" (string) em número curto estável e de volta: guardamos o inteiro, o id do jogo é "j"+base36
function idParaNum(id){let h=0;for(let i=0;i<id.length;i++)h=(Math.imul(h,31)+id.charCodeAt(i))>>>0;return h}
function numParaId(n){return"j"+n.toString(36)}

function criaEstadoMundo(chave,pico){return{pico,c:compactaElenco(baseMundo(chave,pico))}}
function elencoDoMundo(chave,pico,estado){ // reconstrói os 22 jogadores a partir do estado compacto
  const precisaBase=estado.c.some(t=>t[7]==null||(t[5]||0)===0);
  const base=precisaBase?baseMundo(chave,pico):null;
  return estado.c.map((t,i)=>{
    const gen=t[5]||0;
    const j=(gen===0&&base)?Object.assign({},base[i]):(gen>0?jogadorDeGeracao(chave,i,gen,pico):Object.assign({},base?base[i]:{}));
    if(t[7]!=null){                                   // identidade congelada: manda sobre o gerador
      const d=desempacotaIdent(t[7]);j.nome=d.nome;j.hab=d.hab;j.habCat=d.habCat;j.ct=d.ct;j.hum=d.hum;
      j.id=numParaId(t[6]);j.pos=POS22[i];j.papel=null;j.papel=papelDe(j);
    }else{                                            // save antigo: congela agora (próximo save grava)
      t[6]=idParaNum(j.id);t[7]=empacotaIdent(j);
    }
    j.idade=t[0];j.fReal=t[1]/10;j.f=Math.round(t[1]/10);j.pot=t[2];j.art=t[3];j.golsLiga=t[4];j.assistLiga=0;j.gen=gen;j.gols=0;j.num=NUM_SLOT[i];
    j.mk=mkDaChave(chave);j.val=valorDe(j.f,j.idade,j.pot,j.mk);j.sal=salarioDe(j.f,j.mk);
    return j;
  });
}


function compactaElencoComGen(elenco,anterior){
  // enquanto o clube é "compacto", o elenco tem 22 jogadores na mesma ordem dos slots; a identidade congelada é preservada
  return elenco.map((j,i)=>{const a=anterior[i]||[];return[j.idade,Math.round((j.fReal!=null?j.fReal:j.f)*10),j.pot,j.art||0,j.golsLiga||0,(a[5]||0)||j.gen||0,a[6]!=null?a[6]:idParaNum(j.id),a[7]!=null?a[7]:empacotaIdent(j)]});
}


// ===== EVOLUÇÃO DO MUNDO INTEIRO (direto no estado compacto) =====
function crescimentoCompacto(idade,f,pot,rg){
  if(idade<=28){
    const falta=Math.max(0,pot-f),frac=fracAnualIdade(idade);
    // v57: 75% do ano já foi pago ao longo das rodadas (evoluiMundoFatia); aqui só a maturação + ruído menor
    const g=falta*frac*(1-EVO_PARTE_JOGOS)+(rg()*1.2-0.5)*.5;
    return Math.max(-0.5,Math.min(falta,g));
  }
  return -(0.5+0.35*(idade-29))+(rg()*0.8-0.4);
}
// Evolui UM clube compacto (estado) para a próxima temporada. Retorna nº de aposentadorias.
function evoluiEstadoMundo(chave,est){
  const rg=rngClube("evo|"+chave+"|"+S.temp);
  let aposent=0;
  const pp=chave.split("|"),inf=(LIGAS[pp[0]]&&LIGAS[pp[0]][+pp[1]])?LIGAS[pp[0]][+pp[1]][+pp[2]]:null;
  const bfm=bonusFamaEvolucao(inf?inf[0]:"");
  est.c=est.c.map((t,i)=>{
    let idade=t[0]+1,f=t[1]/10,pot=t[2],art=t[3],gen=t[5]||0;
    f=Math.max(15,Math.min(100,f+crescimentoCompacto(idade,f,pot,rg)+(idade<=28?Math.min(bfm,Math.max(0,pot-f)):0)));
    if(idade>=29&&pot>Math.round(f))pot=Math.round(f);
    if(idade>=39){ // aposenta: entra um jovem da base, gerado pela semente (geração +1 no mesmo slot)
      gen+=1;aposent++;
      const j=jogadorDeGeracao(chave,i,gen,est.pico);
      return[j.idade,Math.round(j.f*10),j.pot,0,0,gen,idParaNum(j.id),empacotaIdent(j)];
    }
    return[idade,Math.round(f*10),pot,art,0,gen,t[6]!=null?t[6]:null,t[7]!=null?t[7]:null];       // golsLiga zera a cada temporada; identidade preservada
  });
  return aposent;
}
// Evolui todos os clubes do mundo que existem em S.mundo e todos os que ainda não foram abertos (criados sob demanda e já evoluídos)
function evoluiMundoTodo(){
  if(!S.mundo)S.mundo={};
  let n=0;
  Object.keys(LIGAS).forEach(pais=>LIGAS[pais].forEach((lst,dv)=>lst.forEach((c,idx)=>{
    if(pais===S.pais&&S.clubes.find(x=>x.nome===c[0]))return;           // clubes da minha liga evoluem pelo caminho normal
    const k=chaveClube(pais,dv,idx);
    if(S.ext&&S.ext[k]&&S.ext[k].mexido){evoluiElenco(S.ext[k],k);n++;return}   // clube alterado: elenco completo
    if(!S.mundo[k])S.mundo[k]=criaEstadoMundo(k,picoClube(pais,dv,idx));
    // se existe na memória (montado nesta sessão), sincroniza antes de evoluir
    if(S._mem&&S._mem[k]&&S._mem[k].compacto)S.mundo[k].c=compactaElencoComGen(S._mem[k].elenco,S.mundo[k].c);
    evoluiEstadoMundo(k,S.mundo[k]);n++;
  })));
  S._mem={};                                                              // descarta o cache: será remontado já evoluído
  S.mundoTemp=S.temp;S._evoMundoG=null;
  return n;
}


// ===== LIGAS VIVAS DO MUNDO (etapa 2) =====
// S.ligas["pais|div"] = { k:rodadas jogadas, R:total, nomes:[clubes], tab:{nome:[pts,j,v,e,d,gp,gc]}, gols:{"nome#slot":gols}, ultimos:[[a,b,ga,gb],...] }
// Tudo guardado em arrays curtos (compacto). Os gols vão para o SLOT do jogador (posição no elenco), sem montar nomes.
const PESO_POS={ATA:5,PE:2.5,MEI:2.5,VOL:1,ZAG:.4,LD:.4,LE:.4,GOL:0};
function rodadasDe(n){return n%2===0?2*(n-1):2*n}
function chaveLiga(pais,div){return pais+"|"+div}
// calendário todos-contra-todos (algoritmo do círculo), ida e volta. Devolve rodadas [[ia,ib],...]
function calendarioLiga(n){
  const m=n%2?n+1:n,t=[...Array(m).keys()],R=[];
  for(let r=0;r<m-1;r++){
    const jogos=[];
    for(let i=0;i<m/2;i++){const a=t[i],b=t[m-1-i];if(a<n&&b<n)jogos.push([a,b])}
    R.push(jogos);t.splice(1,0,t.pop());
  }
  return R.concat(R.map(r=>r.map(([a,b])=>[b,a])));
}
function criaLigaViva(pais,div){
  const nomes=clubesNaDivisao(pais,div).map(c=>c[0]);
  const tab={};nomes.forEach(n=>{tab[n]=[0,0,0,0,0,0,0]});
  return{k:0,R:rodadasDe(nomes.length),nomes,tab,gols:{},ass:{},ultimos:[],temp:S.temp};
}
function garanteLigasVivas(){
  if(!S.ligas)S.ligas={};
  Object.keys(LIGAS).forEach(pais=>LIGAS[pais].forEach((_,div)=>{
    const k=chaveLiga(pais,div);
    if(pais===S.pais&&div===S.div)return;                     // a MINHA divisão é simulada pelo motor normal
    if(!S.ligas[k]||S.ligas[k].temp!==S.temp)S.ligas[k]=criaLigaViva(pais,div);
  }));
}
// pesos de gol por slot do elenco compacto: usa a força de cada slot (quem é melhor faz mais gols)
function pesosDeGol(pais,div,nome){
  const ch=chaveFixa(pais,nome);if(!ch)return POS22.map(p=>PESO_POS[p]);
  const k=chaveClube(pais,ch.div,ch.idx);
  const est=S.mundo&&S.mundo[k];
  return POS22.map((pos,i)=>{
    const f=est?est.c[i][1]/10:50;
    return PESO_POS[pos]*Math.pow(Math.max(20,f)/60,2);
  });
}
function golDeSlot(pesos,r){
  let tot=0;for(let i=0;i<pesos.length;i++)tot+=pesos[i];
  if(tot<=0)return 13;
  let x=r*tot,acc=0;
  for(let i=0;i<pesos.length;i++){acc+=pesos[i];if(x<=acc)return i}
  return pesos.length-1;
}
function forcaParaLiga(pais,div,nome){
  // força real do elenco (estado compacto → média dos 11 melhores), sem montar nomes
  const ch=chaveFixa(pais,nome);if(!ch)return 45;
  const k=chaveClube(pais,ch.div,ch.idx);
  if(!S.mundo)S.mundo={};
  if(!S.mundo[k])S.mundo[k]=criaEstadoMundo(k,picoClube(pais,ch.div,ch.idx));
  if(S.ext&&S.ext[k]&&S.ext[k].mexido)return S.ext[k].forca;
  const f=S.mundo[k].c.map(t=>t[1]/10).sort((a,b)=>b-a).slice(0,11);
  return f.reduce((q,x)=>q+x,0)/11;
}
function jogaRodadaLiga(pais,div,rg){
  const L=S.ligas[chaveLiga(pais,div)];if(!L||L.k>=L.R)return;
  if(!L.cal)L.cal=calendarioLiga(L.nomes.length);      // calendário em memória (não é salvo: regenerado)
  const jogos=L.cal[L.k]||[];L.ultimos=[];
  jogos.forEach(([ia,ib])=>{
    const a=L.nomes[ia],b=L.nomes[ib];
    const fa=forcaParaLiga(pais,div,a)+3,fb=forcaParaLiga(pais,div,b);
    const gm=(m)=>{const lim=Math.exp(-m);let q=0,pr=1;do{q++;pr*=rg()}while(pr>lim);return q-1};
    const ga=gm(Math.max(.25,(fa-fb)/22+1.35)),gb=gm(Math.max(.25,(fb-fa)/22+1.0));
    const ta=L.tab[a],tb=L.tab[b];
    ta[1]++;tb[1]++;ta[5]+=ga;ta[6]+=gb;tb[5]+=gb;tb[6]+=ga;
    if(ga>gb){ta[0]+=3;ta[2]++;tb[4]++}else if(ga<gb){tb[0]+=3;tb[2]++;ta[4]++}else{ta[0]++;tb[0]++;ta[3]++;tb[3]++}
    [[a,ga],[b,gb]].forEach(([clube,g])=>{
      if(!g)return;const pw=pesosDeGol(pais,div,clube);
      let pa=null;
      for(let q=0;q<g;q++){const sl=golDeSlot(pw,rg());const kk=clube+"#"+sl;L.gols[kk]=(L.gols[kk]||0)+1;
        if(rg()<.68){                                               // v61: assistência de jogada (68% dos gols)
          if(!pa)pa=pesosDeAssist(pais,div,clube);
          const pz=pa.slice();pz[sl]=0;                              // o autor não assiste a si mesmo
          const sa=golDeSlot(pz,rg());const ka=clube+"#"+sa;
          if(!L.ass)L.ass={};L.ass[ka]=(L.ass[ka]||0)+1;
        }
      }
    });
    L.ultimos.push([ia,ib,ga,gb]);
  });
  L.k++;
}
// Avança TODAS as divisões do mundo (menos a minha) proporcionalmente ao progresso global (g de G passos)
function avancaMundo(g,G){
  garanteLigasVivas();
  const rg=rngClube("mundo|"+S.temp+"|"+g);
  Object.keys(S.ligas).forEach(k=>{
    const L=S.ligas[k];const [pais,div]=k.split("|");
    const alvo=Math.min(L.R,Math.ceil(g*L.R/G));
    while(L.k<alvo)jogaRodadaLiga(pais,+div,rg);
  });
  try{ if(S._evoMundoG!==g){ const prev=S._evoMundoG==null?0:S._evoMundoG; S._evoMundoG=g; if(g>prev) evoluiMundoFatia((g-prev)/Math.max(1,G)); } }catch(e){}   // v57: o mundo evolui ao longo da temporada
}
function tabelaDe(pais,div){ // classificação ordenada de qualquer divisão (minha ou do mundo), por nome
  if(pais===S.pais&&div===S.div){
    return S.clubes.map(c=>({nome:c.nome,pts:c.pts,j:c.j,v:c.v,e:c.e,d:c.d,gp:c.gp,gc:c.gc}))
      .sort((a,b)=>b.pts-a.pts||(b.gp-b.gc)-(a.gp-a.gc)||b.gp-a.gp);
  }
  if(!S.ligas||!S.ligas[chaveLiga(pais,div)]||S.ligas[chaveLiga(pais,div)].temp!==S.temp){try{garanteLigasVivas()}catch(e){}}
  const L=S.ligas&&S.ligas[chaveLiga(pais,div)];if(!L)return[];
  return L.nomes.map(n=>{const t=L.tab[n];return{nome:n,pts:t[0],j:t[1],v:t[2],e:t[3],d:t[4],gp:t[5],gc:t[6]}})
    .sort((a,b)=>b.pts-a.pts||(b.gp-b.gc)-(a.gp-a.gc)||b.gp-a.gp);
}


// Artilheiro de cada divisão do mundo: o slot com mais gols vira +1 artilharia (e pode virar estrela)
function fechaArtilhariaMundo(){
  const avisos=[];
  Object.keys(S.ligas||{}).forEach(k=>{
    const L=S.ligas[k];if(!L||!Object.keys(L.gols).length)return;
    let melhor=null,mg=-1;
    Object.keys(L.gols).forEach(kk=>{if(L.gols[kk]>mg||(L.gols[kk]===mg&&kk<melhor)){mg=L.gols[kk];melhor=kk}});
    const [clube,slot]=[melhor.slice(0,melhor.lastIndexOf("#")),+melhor.slice(melhor.lastIndexOf("#")+1)];
    try{ // v61: líder de assistências da liga fica no histórico (artHistMundo)
      let ma=null,mv=-1;Object.keys(L.ass||{}).forEach(kk=>{if(L.ass[kk]>mv||(L.ass[kk]===mv&&kk<ma)){mv=L.ass[kk];ma=kk}});
      if(ma&&mv>0){const [pa0,dv0]=k.split("|");const cl0=ma.slice(0,ma.lastIndexOf("#")),sl0=+ma.slice(ma.lastIndexOf("#")+1);const ch0=chaveFixa(pa0,cl0);
        if(ch0){const kc0=chaveClube(pa0,ch0.div,ch0.idx);let nm0="Jogador";try{nm0=nomeDoSlot(kc0,pa0,ch0.div,ch0.idx,sl0)}catch(e){}
          if(!S.astHist)S.astHist=[];S.astHist.push({temp:S.temp,pais:pa0,div:+dv0,nome:nm0,clube:cl0,a:mv});S.astHist=S.astHist.filter(x=>S.temp-x.temp<8)}}
    }catch(e){}
    const [pais]=k.split("|");const ch=chaveFixa(pais,clube);if(!ch)return;
    const kc=chaveClube(pais,ch.div,ch.idx);
    if(!S.mundo)S.mundo={};
    if(!S.mundo[kc])S.mundo[kc]=criaEstadoMundo(kc,picoClube(pais,ch.div,ch.idx));
    try{ // v61: artilheiro de cada liga do mundo no histórico (guarda 8 temporadas)
      let nmA="Jogador";try{nmA=nomeDoSlot(kc,pais,ch.div,ch.idx,slot)}catch(e){}
      if(!S.artHistMundo)S.artHistMundo=[];
      S.artHistMundo.push({temp:S.temp,pais,div:ch.div,nome:nmA,clube,gols:mg});
      S.artHistMundo=S.artHistMundo.filter(x=>S.temp-x.temp<8);
    }catch(e){}
    const alt=S.ext&&S.ext[kc]&&S.ext[kc].mexido;
    if(alt){const j=S.ext[kc].elenco[slot];if(j){const antes=j.art||0;j.art=antes+1}return}   // clube alterado: slot pode não ser o mesmo; ignora com segurança
    const t=S.mundo[kc].c[slot];if(!t)return;
    const antes=t[3];t[3]=antes+1;
    const niv=a=>a>=5?2:a>=3?1:0;
    if(niv(t[3])>niv(antes)){
      const nome=nomeDoSlot(kc,pais,ch.div,ch.idx,slot);
      avisos.push({pais,clube,nome,nivel:niv(t[3]),art:t[3],liga:LIGANOME[pais][ch.div]});
    }
  });
  return avisos;
}
function nomeDoSlot(kc,pais,div,idx,slot){
  const est=S.mundo[kc];const pico=est.pico;
  const gen=est.c[slot][5]||0;
  const j=gen===0?baseMundo(kc,pico)[slot]:jogadorDeGeracao(kc,slot,gen,pico);
  return j.nome;
}


// ===== DIVISÃO ATUAL DE TODOS OS PAÍSES (etapa 3) =====
// S.divMundo[pais][nome] = divisão atual do clube (0 = 1ª). O meu país usa S.divAtual (mesma ideia, já existente).
function garanteDivMundo(){
  if(!S.divMundo)S.divMundo={};
  Object.keys(LIGAS).forEach(pais=>{
    if(pais===S.pais)return;
    if(S.divMundo[pais])return;
    const m={};LIGAS[pais].forEach((lst,dv)=>lst.forEach(c=>{m[c[0]]=dv}));
    S.divMundo[pais]=m;
  });
}
function divDoClube(pais,nome){
  if(pais===S.pais){garanteDivAtual();return S.divAtual[nome]}
  garanteDivMundo();return S.divMundo[pais]?S.divMundo[pais][nome]:undefined;
}
// lista de clubes [nome,sig,cor,cor2] da divisão ATUAL de qualquer país
function clubesNaDivisao(pais,div){
  if(pais===S.pais)return clubesDaDivisao(pais,div);
  garanteDivMundo();
  const out=[];LIGAS[pais].forEach(lst=>lst.forEach(c=>{if(S.divMundo[pais][c[0]]===div)out.push(c)}));
  return out;
}
// Fim de temporada do MUNDO: usa as tabelas das ligas vivas para subir/cair em todos os países (menos o meu, que já tem a sua regra)
function acessoRebaixamentoMundo(){
  garanteDivMundo();
  const todos=[];
  Object.keys(LIGAS).forEach(pais=>{
    if(pais===S.pais)return;
    const nd=LIGAS[pais].length;
    const tabs=[];
    for(let dv=0;dv<nd;dv++){
      const t=tabelaDe(pais,dv);
      tabs[dv]=t.map(x=>x.nome);
    }
    const movs=[];
    for(let i=0;i<nd-1;i++){
      const kk=Math.min(4,Math.floor(tabs[i].length/4),Math.floor(tabs[i+1].length/4));
      if(kk<=0)continue;
      tabs[i].slice(-kk).forEach(n=>movs.push({nome:n,de:i,para:i+1,pais}));
      tabs[i+1].slice(0,kk).forEach(n=>movs.push({nome:n,de:i+1,para:i,pais}));
    }
    movs.forEach(m=>{S.divMundo[pais][m.nome]=m.para});
    // classificação final da 1ª divisão (antes dos movimentos): alimenta as vagas continentais
    if(!S.tabFinalMundo)S.tabFinalMundo={};
    S.tabFinalMundo[pais]=tabs[0].slice();
    movs.forEach(m=>todos.push(m));
  });
  return todos;
}


// ===== COPA NACIONAL DOS OUTROS PAÍSES =====
// S.copasMundo[pais] = { temp, vivos:[nome], fase, campeao, hist:[[fase,[[a,b,ga,gb]...]]] }  (compacto)
// Mata-mata de jogo único com TODOS os clubes das divisões (divisão ATUAL). Fases preliminares nivelam até potência de 2.
function copaMundoNomeFase(n){return n===2?"Final":n===4?"Semifinal":n===8?"Quartas de final":n===16?"Oitavas de final":n===32?"16 avos de final":"Fase preliminar"}
function copaMundoInicia(pais){
  if(!S.copasMundo)S.copasMundo={};
  const nomes=[];
  LIGAS[pais].forEach((_,dv)=>clubesNaDivisao(pais,dv).forEach(c=>nomes.push(c[0])));
  let alvo0=1;while(alvo0*2<=nomes.length)alvo0*=2;
  S.copasMundo[pais]={temp:S.temp,vivos:nomes,fase:0,total:(nomes.length>alvo0?1:0)+Math.round(Math.log2(alvo0)),campeao:null,hist:[]};
  return S.copasMundo[pais];
}
function copaMundoGaranteTemporada(){
  Object.keys(LIGAS).forEach(pais=>{
    if(pais===S.pais)return;                                   // a minha tem a copa completa
    const c=S.copasMundo&&S.copasMundo[pais];
    if(!c||c.temp!==S.temp)copaMundoInicia(pais);
  });
}
// joga UMA fase da copa do país; quem tem divisão menor joga primeiro nas preliminares
function copaMundoJogaFase(pais,rg){
  const c=S.copasMundo[pais];if(!c||c.campeao)return;
  let v=c.vivos.slice();const n=v.length;
  if(n<=1){c.campeao=v[0]||null;return}
  let alvo=1;while(alvo*2<=n)alvo*=2;
  let jogam,folga=[];
  if(n===alvo){jogam=v}
  else{                                                         // preliminar: só o excedente joga, os de divisão menor primeiro
    const ord=v.map(nm=>({nm,d:divDoClube(pais,nm)||0,r:rg()})).sort((a,b)=>b.d-a.d||a.r-b.r).map(o=>o.nm);
    const jogos=n-alvo;                                         // nº de jogos preliminares
    jogam=ord.slice(0,jogos*2);folga=ord.slice(jogos*2);
  }
  const emb=jogam.map(nm=>({nm,r:rg()})).sort((a,b)=>a.r-b.r).map(o=>o.nm);
  const vencedores=[],reg=[];
  for(let i=0;i+1<emb.length;i+=2){
    const a=emb[i],b=emb[i+1];
    const fa=forcaParaLiga(pais,0,a)+3,fb=forcaParaLiga(pais,0,b);
    const gm=m=>{const lim=Math.exp(-m);let q=0,pr=1;do{q++;pr*=rg()}while(pr>lim);return q-1};
    let ga=gm(Math.max(.25,(fa-fb)/22+1.35)),gb=gm(Math.max(.25,(fb-fa)/22+1.0));
    if(ga===gb){const pa=1/(1+Math.exp(-(fa-fb)/12));if(rg()<pa)ga++;else gb++}   // pênaltis: leve vantagem do mais forte
    vencedores.push(ga>gb?a:b);reg.push([a,b,ga,gb]);
  }
  c.hist.push([n===alvo?copaMundoNomeFase(n):"Fase preliminar",reg]);
  c.vivos=[...folga,...vencedores];c.fase++;
  if(c.vivos.length===1)c.campeao=c.vivos[0];
}
// Avança as copas do mundo proporcionalmente ao progresso da temporada (prog 0..1): janela 6%-66%
function copaMundoAvanca(prog){
  copaMundoGaranteTemporada();
  const rg=rngClube("copaMundo|"+S.temp+"|"+Math.round(prog*1000));
  Object.keys(S.copasMundo).forEach(pais=>{
    const c=S.copasMundo[pais];if(!c||c.temp!==S.temp||c.campeao||pais===S.pais)return;
    const total=c.total||6;                                      // nº de fases fixado no início da copa
    const quer=prog>=.66?total:Math.min(total,Math.floor(total*Math.max(0,(prog-.06))/(.66-.06)));
    let guard=0;while(!c.campeao&&c.fase<quer&&guard++<8)copaMundoJogaFase(pais,rg);
  });
}
function campeaoCopaMundo(pais){
  const c=S.copasMundo&&S.copasMundo[pais];
  if(!c||c.temp!==S.temp-1&&c.temp!==S.temp)return null;
  return c.campeao;
}


function fechaCopasMundo(){
  copaMundoAvanca(1);                                              // termina o que faltar
  if(!S.campeoesCopa)S.campeoesCopa={};
  if(!S.histCopaMundo)S.histCopaMundo=[];
  Object.keys(S.copasMundo||{}).forEach(pais=>{
    const c=S.copasMundo[pais];if(!c||c.temp!==S.temp||pais===S.pais)return;
    if(!c.campeao){let g=0;const rg=rngClube("copaFim|"+pais+"|"+S.temp);while(!c.campeao&&g++<10)copaMundoJogaFase(pais,rg)}
    if(c.campeao){S.campeoesCopa[pais]={temp:S.temp,nome:c.campeao};S.histCopaMundo.push({temp:S.temp,pais,nome:c.campeao})}
  });
  if(S.histCopaMundo.length>400)S.histCopaMundo=S.histCopaMundo.slice(-400);
}


// ===== ENERGIA POR DIAS DE DESCANSO + NOTAS E GANHO DE FORÇA (v32) =====
// Data real (em dias) da data atual da agenda; usada para medir o descanso entre jogos.
function diaAbsolutoAgenda(i){
  const d=S.agenda&&S.agenda[i];if(!d)return null;
  return Math.floor(Date.UTC(d.ano,d.mes,d.dia)/86400000);
}
// Quantos dias de descanso o clube teve antes do jogo na data S.dia (compara com a data anterior da agenda)
function diasDescansoAntes(){
  const a=diaAbsolutoAgenda(S.dia),b=S.dia>0?diaAbsolutoAgenda(S.dia-1):null;
  if(a==null||b==null)return 7;
  return Math.max(0,a-b);
}
// Desgaste do jogo (feito logo ao fim da partida) — vale para liga e copas
function desgasteJogo(j,copa){
  const base=copa?rnd(14,24):Math.round(rnd(18,28)*poupaEnergia(j)*((j.hab||[]).includes("Resistência")?.8:1));
  return base;
}
// Aplica, ao FIM de um jogo do meu clube, o desgaste de quem jogou e a recuperação de quem não jogou.
// A recuperação para o PRÓXIMO jogo é aplicada na hora em que a próxima data começa (ver recuperaParaProximoJogo).
function energiaPosJogo(clube,copa){
  // v58: antes de mexer em 'tit', registra quem ATUOU neste jogo (para entrosamento/moral) e o resultado do meu time
  let res=0,classico=false;
  try{
    const P=S.pos;
    if(P){const meuA=P.a===S.meu,mg=meuA?P.ga:P.gb,ag=meuA?P.gb:P.ga;res=mg>ag?1:mg<ag?-1:0;
      const adv=S.clubes[meuA?P.b:P.a];classico=!!(adv&&ehRival(adv.nome))}
  }catch(e){}
  clube.elenco.forEach(j=>{j.jogou_ultimo=!!j.tit});
  try{atualizaEntrosMoral(clube,res,classico);registraClassico(res,classico)}catch(e){}
  try{if(!S._clbak||true){verificaPedidosSaida()}}catch(e){}
  try{if(S.pos&&S.pos.a===S.meu){desgasteGramado();if(S.pos.clima==='chuva'||S.pos.clima==='tempestade')S.gramado=Math.max(20,S.gramado-1.5)}}catch(e){}
  clube.elenco.forEach(j=>{
    const e0=j.en==null?100:j.en;
    if(j.tit){j.en=Math.max(20,e0-desgasteJogo(j,copa));j.ultimoJogoDia=diaAbsolutoAgenda(S.dia)}
    j.jogou=j.jogou||!!j.tit;
    if(j.lesao>0&&!j.lesAoVivo)j.lesao--;
    j.lesAoVivo=false;j.lesionadoJogo=false;
  });
}
// Chamada ao avançar a data do calendário: quem descansou 4+ dias volta a 100%; menos que isso recupera 8 por dia (dias seguidos: 100 → 85 → 70)
function recuperaParaProximoJogo(clube){
  const hoje=diaAbsolutoAgenda(S.dia);if(hoje==null)return;
  clube.elenco.forEach(j=>{
    const e0=j.en==null?100:j.en;
    if(e0>=100)return;
    const ref=(j.ultimoJogoDia!=null)?j.ultimoJogoDia:hoje-7;
    const dias=Math.max(0,hoje-ref);
    j.en=dias>=4?100:Math.min(100,e0+8*dias);
  });
}
// ---------- notas por jogador e ganho de força a cada 10 jogos ----------
// j.nts = últimas notas do bloco atual (máx 10). Ao completar 10 jogos, avalia o bloco e zera.
function registraNotasJogo(clube,listaNotas){
  // listaNotas: [{id,nota}] de quem atuou
  listaNotas.forEach(o=>{
    const j=clube.elenco.find(x=>x.id===o.id);if(!j)return;
    if(!j.nts)j.nts=[];
    j.nts.push(o.nota);
    j.mediaNota=Math.round(j.nts.reduce((q,x)=>q+x,0)/j.nts.length*10)/10;
    if(j.nts.length>=10)avaliaBlocoNotas(clube,j);
  });
}
function registraNotasDoPos(clube,meuEhA){
  try{
    if(!S.pos)return;
    const lado=meuEhA?S.pos.A:S.pos.B;
    S.avisosForca=[];
    if(lado&&lado.lista)registraNotasJogo(clube,lado.lista.map(o=>({id:o.id,nota:o.nota})));
    // v57: evolução jogo a jogo — todo mundo que atuou ganha de acordo com nota e minutos; avisa quem subiu um ponto inteiro
    try{

        const d=aplicaGanhoJogo(clube,j,g);

      });
      S.avisosForca=subiu;
    }catch(e){}
    S.pos.ganhos=(S.avisosForca||[]).slice();S.avisosForca=[];
    // histórico completo por partida (para a ficha do jogador)
    const advC=S.clubes[meuEhA?S.pos.b:S.pos.a];
    const meuG=meuEhA?S.pos.ga:S.pos.gb,advG=meuEhA?S.pos.gb:S.pos.ga;

    if(lado&&lado.lista)lado.lista.forEach(o=>{
      const j=clube.elenco.find(x=>x.id===o.id);if(!j)return;
      if(!j.hn)j.hn=[];

}
function avaliaBlocoNotas(clube,j){

  const ns=j.nts.slice(0,10);j.nts=[];

// pontos de fama: base (continental 40, mundial 75, regional 10) + títulos do jogo
function famaBase(nome){return FAMA_MUNDIAL.includes(nome)?75:FAMA_CONTINENTAL.includes(nome)?40:10}
function titulosClube(nome){
  const t=S.titulos&&S.titulos[nome];return t||{liga:0,copa:0,cont:0,mundial:0};

  const t=titulosClube(nome);

}
function nivelFama(nome){const p=pontosFama(nome);return p>=85?2:p>=45?1:0}

function registraTitulosTemporada(campeaoMinhaLiga){
  const nomeDe=(e)=>{try{return(e&&e.campeao!=null&&e.parts&&e.parts[e.campeao])?e.parts[e.campeao].nome:null}catch(x){return null}};
  const premia=[];
  const add=(nome,tipo,pais,comp)=>{if(!nome)return;registraTitulo(nome,tipo);premia.push({nome,tipo,pais});try{regTituloTec(nome,comp||tipo,pais||S.pais)}catch(e){}};
  add(campeaoMinhaLiga,"liga",S.pais,"liga");
  add(nomeDe(S.cn),"copa",S.pais,"copa");
  add(nomeDe(S.cl),"cont",null,"cl");add(nomeDe(S.el),"cont",null,"el");add(nomeDe(S.lb),"cont",null,"lb");add(nomeDe(S.sa),"cont",null,"sa");
  if(!S.campContinental)S.campContinental=[];
  [[S.cl,"eur"],[S.lb,"sul"]].forEach(([e,conf])=>{const n=nomeDe(e);if(n)S.campContinental.push({temp:S.temp,nome:n,conf})});
  if(S.campContinental.length>12)S.campContinental=S.campContinental.slice(-12);
  // ligas e copas dos outros países
  Object.keys(S.ligas||{}).forEach(k=>{
    const [pais,dv]=k.split("|");if(+dv!==0||pais===S.pais)return;
    const t=tabelaDe(pais,0);if(t.length)add(t[0].nome,"liga",pais,"liga");

}

function premioLiga(pais,div,posFinal,nClubes){
  const econ=ECON_PAIS[pais]||.6,esc=[1,.22,.06][div]||.04;

function lancaPremio(valor,descricao){

  };

  // anfitrião: um clube do meu país (o mais forte ainda fora)

  if(fora){const ch=chaveFixa(S.pais,fora.nome);if(ch)add(fora.nome,S.pais,"anf",forcaParaLiga(S.pais,ch.div,fora.nome),fora.sig,fora.cor,fora.cor2)}

function mundialInicia(){

  for(let pote=0;pote<4;pote++){
    const fatia=ord.slice(pote*8,pote*8+8).map(x=>({x,r:rg()})).sort((a,b)=>a.r-b.r).map(o=>o.x);
    fatia.forEach((t,i)=>grupos[i].push(t));
  }

function mundialPartida(a,b,rg,mata){
  const fa=a.forca+3,fb=b.forca;
  const gm=m=>{const lim=Math.exp(-m);let q=0,pr=1;do{q++;pr*=rg()}while(pr>lim);return q-1};
  let ga=gm(Math.max(.25,(fa-fb)/22+1.35)),gb=gm(Math.max(.25,(fb-fa)/22+1.0));
  let pen=false;
  if(mata&&ga===gb){pen=true;const pa=1/(1+Math.exp(-(fa-fb)/12));if(rg()<pa)ga++;else gb++}
  return[ga,gb,pen];
}

    const par=[];for(let i=0;i<8;i+=2){par.push([cls[i][0],cls[i+1][1]]);par.push([cls[i+1][0],cls[i][1]])}

// ===== PÊNALTI AO VIVO + COBRADORES (v46) =====
// Pênalti: o tempo para, abre a mesma tela de escalação do seu jogo e você escolhe quem cobra. O adversário (IA) escolhe o melhor cobrador.
function melhorCobrador(c){ // IA: maior força + bônus de Finalização, entre quem está em campo (sem goleiro)
  const em=c.elenco.filter(x=>x.tit&&!x.expulso&&x.pos!=="GOL");
  em.sort((a,b)=>(b.f+((b.hab||[]).includes("Finalização")?4:0))-(a.f+((a.hab||[]).includes("Finalização")?4:0)));
  return em[0]||null;
}
function goleiroEmCampo(c){return c.elenco.find(x=>x.tit&&!x.expulso&&x.pos==="GOL")||null}
function chancePenalti(cob,gol){
  const fc=cob?cob.f+bonusEstrela(cob):40,fg=gol?gol.f+bonusEstrela(gol):40;
  let c=.76+(fc-fg)/250;
  if(cob&&(cob.hab||[]).includes("Finalização"))c+=.04;
  if(gol&&(gol.hab||[]).includes("Pênaltis"))c-=.06;
  if(cob){const en=(cob.en==null?100:cob.en)/100;c-=(1-en)*.08}       // cansado erra mais
  return Math.max(.45,Math.min(.92,c));
}
// resolve a cobrança: cobradorId = jogador escolhido (ou null → melhor cobrador). Registra gol ou defesa/trave/fora.
function resolvePenalti(j,sA,cobradorId){
  const L=S.live;const F=sA?S.clubes[j.a]:S.clubes[j.b],D=sA?S.clubes[j.b]:S.clubes[j.a];
  let cob=cobradorId?F.elenco.find(x=>x.id===cobradorId&&x.tit&&!x.expulso):null;
  if(!cob)cob=melhorCobrador(F);
  const gk=goleiroEmCampo(D);
  const pg=chancePenalti(cob,gk);
  const r=R();
  const nome=cob?cob.nome:"Cobrador";
  const lado=sA?"a":"b";
  const meuTime=(sA&&j.a===S.meu)||(!sA&&j.b===S.meu),jogoMeu=(j.a===S.meu||j.b===S.meu);
  if(r<pg){                                                                  // GOL
    if(cob){cob.gols++;if(!(S.live&&S.live.emCL))cob.golsLiga=(cob.golsLiga||0)+1}
    sA?j.ga++:j.gb++;sA?j.st.fa++:j.st.fb++;sA?j.st.ga_++:j.st.gb_++;
    j.ev.push({m:L.min,t:"g",lado,n:nome,jid:cob?cob.id:null,pen:true});
    if(jogoMeu&&!L.pulando){if(meuTime){somGol();golFx("GOOOL! (pênalti)")}else somGolContra();
      narraGol({meu:meuTime,contra:!meuTime,autor:nome.split(" ").slice(-1)[0],time:F.nome,golsA:sA?j.ga:j.gb,golsB:sA?j.gb:j.ga,min:L.min})}
    return{gol:true,nome};
  }
  const tipo=r<pg+(1-pg)*.55?"defesa":r<pg+(1-pg)*.8?"trave":"fora";           // defesa do goleiro, trave ou para fora
  sA?j.st.fa++:j.st.fb++;if(tipo==="defesa")sA?j.st.ga_++:j.st.gb_++;
  j.ev.push({m:L.min,t:"p",lado,n:nome,jid:cob?cob.id:null,res:tipo});
  if(jogoMeu&&!L.pulando){if(meuTime){somLamento();toast("❌ Pênalti perdido!")}else{somGol();toast("🧤 Seu goleiro pegou!")}}
  return{gol:false,tipo,nome};
}

// ===== FALTAS DIRETAS (v47) =====
// Falta perigosa perto da área (~1,1 por jogo, somando os dois times). O cobrador do SEU time vem do campo "Cobrança de faltas" da Tática
// (sem janela de escolha); se ele não está em campo, o jogo usa o melhor batedor disponível. A IA usa sempre o melhor batedor.
function cobradorFaltaDe(c,meu){
  const em=c.elenco.filter(x=>x.tit&&!x.expulso&&x.pos!=="GOL");
  if(meu&&S.cob){const x=em.find(z=>z.id===S.cob);if(x)return x}
  const pt=x=>x.f+((x.hab||[]).includes("Chute longo")?6:0)+((x.hab||[]).includes("Finalização")?4:0);
  return em.sort((a,b)=>pt(b)-pt(a))[0]||null;
}
function chanceFalta(cob,gol){
  let p=.06;
  if(cob){
    p*=1+(cob.f+bonusEstrela(cob)-50)/200;                                     // cobrador melhor chuta melhor
    if((cob.hab||[]).includes("Chute longo"))p*=1.35;
    if((cob.hab||[]).includes("Finalização"))p*=1.25;
    p*=.9+.1*((cob.en==null?100:cob.en)/100);                                   // cansado chuta pior
  }
  if(gol)p*=1-(gol.f+bonusEstrela(gol)-50)/350;                                  // goleiro bom defende mais
  return Math.max(.015,Math.min(.22,p));
}
function resolveFalta(j,sA,meuAtacando){
  const L=S.live;const F=sA?S.clubes[j.a]:S.clubes[j.b],D=sA?S.clubes[j.b]:S.clubes[j.a];

  const meuTime=(sA&&j.a===S.meu)||(!sA&&j.b===S.meu),jogoMeu=(j.a===S.meu||j.b===S.meu);
  sA?j.st.fa++:j.st.fb++;
  if(R()<chanceFalta(cob,gk)){                                         // GOL de falta
    if(cob){cob.gols++;if(!(S.live&&S.live.emCL))cob.golsLiga=(cob.golsLiga||0)+1}
    sA?j.ga++:j.gb++;sA?j.st.ga_++:j.st.gb_++;
    j.ev.push({m:L.min,t:"g",lado,n:nome,jid:cob?cob.id:null,falta:true});
    if(jogoMeu&&!L.pulando){if(meuTime){somGol();golFx("GOOOL! (falta)")}else somGolContra();
      narraGol({meu:meuTime,contra:!meuTime,autor:nome.split(" ").slice(-1)[0],time:F.nome,golsA:sA?j.ga:j.gb,golsB:sA?j.gb:j.ga,min:L.min})}
    return;
  }
  const r=R(),tipo=r<.4?"defesa":r<.62?"trave":r<.82?"fora":"barreira";   // defesa do goleiro, trave, para fora ou na barreira
  if(tipo==="defesa")sA?j.st.ga_++:j.st.gb_++;
  j.ev.push({m:L.min,t:"p",lado,n:nome,jid:cob?cob.id:null,res:tipo,falta:true});
}

// ===== LESÕES AO VIVO (v48) =====
// Risco por jogador em campo e por minuto: 0,0004 × (2 − energia/100) × fator da marcação × fator da idade.
// ≈ 0,43 lesões por time por jogo (≈ 16 por temporada). O lesionado sai NA HORA; no SEU time o jogo para e abre a mesma tela do vermelho.
const LES_MARC={Leve:.85,Normal:1,Forte:1.25};
function gravidadeLesao(){          // v54: lesões mais curtas (média ≈ 2,3 jogos); as graves continuam raras
  const r=R();
  return r<.50?1:r<.75?2:r<.90?rnd(3,4):r<.98?rnd(5,8):rnd(9,14);
}
const NOMES_LESAO=["torção no tornozelo","lesão muscular","pancada no joelho","distensão","contusão","entorse","dor na coxa","lesão no ligamento"];
function sorteiaLesaoAoVivo(j,clube,souMeu){
  const L=S.live;if(!L)return null;
  const fLes=(CLIMAS[j.clima||'sol']||CLIMAS.sol).les*fatorGramadoLesao(j.gramado==null?70:j.gramado);
  if(!j._les)j._les={};const ladoK=clube===S.clubes[j.a]?"a":"b";if(j._les[ladoK])return null;       // v54: no máximo 1 lesão por time por jogo
  const marc=souMeu?(LES_MARC[TTc(clube).marc]||1):1;
  const em=clube.elenco.filter(x=>x.tit&&!x.expulso&&!(x.lesao>0));
  for(const x of em){
    const en=(x.en==null?100:x.en)/100;
    const fi=x.idade<=22?.85:x.idade<=30?1:1.3;
    if(R()<.0001*(2-en)*marc*fi*fLes){                                        // v54: ≈ 0,11 lesões por time por jogo (≈ 6 por temporada) — antes 0,45
      x.lesao=gravidadeLesao();x.lesAoVivo=true;x.lesNome=NOMES_LESAO[Math.floor(R()*NOMES_LESAO.length)];
      x.tit=false;x.em_campo=false;x.lesionadoJogo=true;j._les[ladoK]=true;           // sai de campo agora
      if(clube===meuReal()||clube===S.clubes[S.meu])abreVagaLesao(x);                  // v62: a vaga fica na partida, não na marca do jogador
      j.ev.push({m:L.min,t:"l",lado:clube===S.clubes[j.a]?"a":"b",n:x.nome,jid:x.id,jogos:x.lesao,tipo:x.lesNome});
      return x;
    }
  }
  return null;
}


// Entra o melhor reserva da MESMA posição no lugar de quem saiu machucado (IA, ou o seu time se você tocar em "Fim").
// A troca por lesão NÃO gasta uma das 5 substituições.
function iaCompletaTime(c){
  const vagas=c.elenco.filter(x=>x.lesionadoJogo&&!x.tit);
  vagas.forEach(sai=>{
    sai.lesionadoJogo=false;try{fechaVagaLesao(sai.id)}catch(e){}
    const fe0=x=>x.f*(0.7+0.3*(x.en==null?100:x.en)/100);
    const pool=c.elenco.filter(x=>!x.tit&&!(x.lesao>0)&&!x.expulso&&!(x.suspenso>0)&&x.id!==sai.id);
    let melhor=pool.filter(x=>x.pos===sai.pos).sort((a,b)=>fe0(b)-fe0(a))[0];
    if(!melhor)melhor=pool.filter(x=>sai.pos==="GOL"?x.pos==="GOL":x.pos!=="GOL").sort((a,b)=>fe0(b)-fe0(a))[0];
    if(!melhor)return;
    melhor.px=sai.px;melhor.py=sai.py;melhor._g=grupoPos(melhor);melhor._slot=sai._slot;melhor._role=sai._role;melhor.tit=true;
    if(S.cap===sai.id)S.cap=melhor.id;
    const L=S.live;if(L){const jg=L.jogos.find(g=>S.clubes[g.a]===c||S.clubes[g.b]===c);if(jg){
      const lado=S.clubes[jg.a]===c?"a":"b";
      jg.ev.push({m:L.min,t:"s",lado,n:melhor.nome+" ↔ "+sai.nome,les:true});
      jg.subs.push({m:L.min,lado,entra:melhor.id,sai:sai.id,en:melhor.nome,sn:sai.nome,ep:melhor.pos,les:true});
    }}
  });
}

// ===== CATEGORIA DE BASE (v49) =====
// Todo fim de temporada o seu clube recebe 2–4 garotos (15–18 anos) com potencial. Ficam em eu.base (NÃO contam nos 32).
// Qualidade: pico do clube, nível do estádio (investimento) e fama. Você promove (vai ao elenco) ou dispensa. Quem não for decidido em 2 temporadas sai.
function geraBaseClube(c){
  if(!c.base)c.base=[];
  const nivelEst=(c.estadio&&c.estadio.nivel)||(S.estadio&&S.estadio.nivel)||1;
  const inv=nivelEst>=4?2:nivelEst>=2?1:0;
  const pico=Math.max(30,Math.round(c.forca||50));
  const n=2+(R()<.5?1:0)+(inv>=1&&R()<.4?1:0);
  const nasc=[];
  for(let i=0;i<n;i++){
    const pos=pick(["GOL","ZAG","ZAG","LD","LE","VOL","MEI","MEI","ATA","ATA","PE"]);
    const idade=rnd(15,18),rg=R;
    const f=Math.max(22,pico-rnd(12,20)+(inv>=2?2:0));
    const j=criaJogadorFixo(pos,f,rg,idade);
    j.pot=Math.min(95,Math.max(j.pot,f+rnd(8,22)+(inv>=2?3:0)));        // base tem potencial alto (calibrado em 40 anos de simulação: não infla o mundo)
    j.val=valorDe(j.f,j.idade,j.pot,j.mk);j.sal=Math.max(1,Math.round(salarioDe(j.f,j.mk)*.5));j.ct=3;j.anoBase=S.temp;j.nBase=true;
    j.nome=j.nome;nasc.push(j);
  }
  c.base=c.base.filter(j=>S.temp-(j.anoBase||S.temp)<2).concat(nasc);   // garotos não decididos há 2 temporadas saem
  return nasc;
}
function promoveBase(id){
  const eu=S.clubes[S.meu];if(!eu.base)return;
  const j=eu.base.find(x=>x.id===id);if(!j)return;
  if(elencoCheio(eu))return avisoCheio();
  eu.base=eu.base.filter(x=>x.id!==id);delete j.nBase;j.tit=false;j.ct=3;j.en=100;j.gols=0;
  try{if(j.num==null||eu.elenco.some(x=>x.num===j.num))j.num=null}catch(e){}
  jogadorNovoNoClube(j);j.entr=45;eu.elenco.push(j);try{atribuiNumeros(eu)}catch(e){}
  save();render();toast(j.nome+" foi promovido ao elenco!");
}
function dispensaBase(id){
  const eu=S.clubes[S.meu];if(!eu.base)return;
  const j=eu.base.find(x=>x.id===id);if(!j)return;
  confirma("Dispensar "+j.nome+" da base?",()=>{eu.base=eu.base.filter(x=>x.id!==id);save();render()});
}
function abaBase(){
  const eu=S.clubes[S.meu];if(!eu.base)eu.base=[];
  let h=topoAba("🌱","Categoria de base","Novos talentos todo ano. Promova os melhores.",[[eu.base.length,"Na base"],[eu.elenco.length+"/"+MAX_ELENCO,"Elenco"]]);
  if(!eu.base.length)h+=`<div class="card"><small class="mu">Nenhum garoto na base agora. Novos talentos chegam no fim de cada temporada (2 a 4). Estádio melhor = base melhor.</small></div>`;
  else{
    h+=`<div class="card"><small class="mu">Eles não contam nos ${MAX_ELENCO} do elenco. Quem não for decidido em 2 temporadas é liberado.</small><div class="tbL">`;
    [...eu.base].sort((a,b)=>b.pot-a.pot).forEach(j=>{
      h+=`<div class="tbR"><span class="tbN"><span><b>${j.nome}</b><small>${j.pos} · ${j.idade} anos · Força ${j.f} · Potencial ${j.pot}${(j.hab||[]).length?' · '+j.hab.join(", "):''}</small></span></span><span style="display:flex;gap:6px"><button class="sm s" onclick="promoveBase('${j.id}')">⬆️ Promover</button><button class="sm" onclick="dispensaBase('${j.id}')">Dispensar</button></span></div>`;
    });
    h+=`</div></div>`;
  }
  return h;
}

function numeroLivre(c,n,exceto){return !c.elenco.some(x=>x.id!==exceto&&x.num===n)}
function mudaNumero(id,val){
  const eu=S.clubes[S.meu],j=eu.elenco.find(x=>x.id===id);if(!j)return;
  const n=parseInt(val,10);
  if(!(n>=1&&n<=99)){aviso("Escolha um número de 1 a 99.");render();return}
